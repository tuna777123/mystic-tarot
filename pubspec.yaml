name: mystic_tarot
description: A private, multilingual, local-first premium tarot, journaling, and spiritual companion app.
publish_to: none
version: 1.18.0+24

environment:
  sdk: ">=3.4.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  audioplayers: ^6.8.1
  flutter_local_notifications: ^19.5.0
  flutter_timezone: ^5.1.0
  purchases_flutter: ^10.5.0
  share_plus: ^12.0.2
  shared_preferences: ^2.5.3
  timezone: ^0.10.1
  url_launcher: ^6.3.2

dependency_overrides:
  # jni 1.0.1 currently fails during Android Gradle evaluation because its
  # Kotlin extension is not available in this project's generated shell.
  # Keep the last known-good release until the upstream package is corrected.
  jni: 1.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_launcher_icons: ^0.14.4
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/audio/

flutter_launcher_icons:
  android: true
  ios: true
  image_path: assets/store/app-icon-1024.jpg
  adaptive_icon_background: "#090816"
  adaptive_icon_foreground: assets/store/app-icon-1024.jpg
  adaptive_icon_foreground_inset: 18
  min_sdk_android: 24
  remove_alpha_ios: true
  background_color_ios: "#090816"
