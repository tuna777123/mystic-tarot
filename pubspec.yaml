name: mystic_tarot
description: A private, multilingual, local-first tarot, journaling, and spiritual companion app supported by privacy-aware advertising.
publish_to: none
version: 1.22.3+32

environment:
  sdk: ">=3.10.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  audioplayers: ^6.8.1
  cryptography: ^2.9.0
  cupertino_icons: ^1.0.9
  flutter_local_notifications: ^19.5.0
  flutter_secure_storage: ^10.3.1
  flutter_timezone: ^5.1.0
  google_mobile_ads: ^9.0.0
  local_auth: ^3.0.2
  purchases_flutter: ^10.5.0
  share_plus: ^13.3.0
  shared_preferences: ^2.5.3
  timezone: ^0.10.1
  url_launcher: ^6.3.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_launcher_icons: ^0.14.4
  flutter_lints: ^4.0.0
  image: ^4.8.0

flutter:
  uses-material-design: true
  assets:
    - assets/audio/

flutter_launcher_icons:
  android: true
  ios: true
  image_path: assets/store/app-icon-1024.jpg
  adaptive_icon_background: "#090816"
  adaptive_icon_foreground: assets/store/app-icon-1024.jpg
  adaptive_icon_foreground_inset: 18
  min_sdk_android: 24
  remove_alpha_ios: true
  background_color_ios: "#090816"
