name: mystic_tarot
description: A private, multilingual, local-first premium tarot, journaling, and spiritual companion app.
publish_to: none
version: 1.15.0+21

environment:
  sdk: ">=3.4.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  shared_preferences: ^2.5.3
  url_launcher: ^6.3.1
  share_plus: ^12.0.2
  in_app_purchase: ^3.2.3
  flutter_local_notifications: ^19.5.0
  timezone: ^0.10.1
  purchases_flutter: ^9.12.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  flutter_launcher_icons: ^0.14.4
  image: ^4.5.4

dependency_overrides:
  jni: 1.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/

flutter_launcher_icons:
  android: true
  ios: true
  image_path: assets/mystic_tarot_app_icon.png
  adaptive_icon_background: "#120D1D"
  adaptive_icon_foreground: assets/mystic_tarot_app_icon_foreground.png
  remove_alpha_ios: true
