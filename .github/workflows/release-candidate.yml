name: Release Candidate

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "lib/**"
      - "test/**"
      - "assets/**"
      - "pubspec.yaml"
      - "pubspec.lock"
      - "tool/**"
      - ".github/workflows/release-candidate.yml"

permissions:
  contents: read

concurrency:
  group: release-candidate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android-qa:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Generate native shells
        run: flutter create . --platforms=android,ios --org com.tunabozcali

      - name: Apply canonical store and platform configuration
        run: dart run tool/configure_store_identifiers.dart

      - name: Install dependencies
        run: flutter pub get --enforce-lockfile

      - name: Generate branded launcher icon
        run: dart run flutter_launcher_icons

      - name: Verify Dart formatting
        run: dart format --output=none --set-exit-if-changed lib test tool

      - name: Verify clean diff
        run: git diff --check

      - name: Verify launch surface
        run: bash tool/verify_launch_surface.sh

      - name: Analyze
        run: flutter analyze --fatal-infos

      - name: Test
        run: flutter test

      - name: Build Android QA APK
        run: flutter build apk --release

      - name: Upload Android QA APK
        uses: actions/upload-artifact@v7
        with:
          name: mystic-tarot-android-qa
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 14
