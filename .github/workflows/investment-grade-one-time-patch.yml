name: Investment Grade One-Time Patch

on:
  push:
    branches: [product/investment-grade-growth]
    paths:
      - '.github/workflows/investment-grade-one-time-patch.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: product/investment-grade-growth
          fetch-depth: 0

      - name: Apply exact source migration
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('lib/src/mystic_living_journal_feature.dart')
          source = path.read_text()

          def replace_once(old, new, label):
              global source
              count = source.count(old)
              if count != 1:
                  raise SystemExit(f'{label}: expected exactly 1 match, found {count}')
              source = source.replace(old, new, 1)

          replace_once(
              "import 'package:flutter/material.dart';\n",
              "import 'package:flutter/material.dart';\nimport 'package:share_plus/share_plus.dart';\n",
              'share_plus import',
          )
          replace_once(
              "import 'mystic_mirror.dart';\n",
              "import 'mystic_mirror.dart';\nimport 'mystic_mirror_share.dart';\n",
              'Mirror share import',
          )
          replace_once(
              '        _buildPremiumCard(),\n',
              '        _buildPatternLabCard(),\n',
              'Insights Pattern Lab call',
          )

          old_method = '''  Widget _buildPremiumCard() {
            return Container(
              padding: const EdgeInsets.all(18),
              decoration: BoxDecoration(
                gradient: const LinearGradient(
                  colors: [Color(0xFF4B2E72), Color(0xFF21152F)],
                ),
                borderRadius: BorderRadius.circular(22),
                border: Border.all(color: MysticColors.gold.withValues(alpha: .28)),
              ),
              child: Column(
                crossAxisAlignment: CrossAxisAlignment.start,
                children: [
                  const Icon(Icons.hub_outlined, color: MysticColors.gold),
                  const SizedBox(height: 10),
                  Text(
                    _copy('Unlock your full pattern map', 'Tüm örüntü haritanı aç'),
                    style: const TextStyle(fontSize: 17, fontWeight: FontWeight.w900),
                  ),
                  const SizedBox(height: 7),
                  Text(
                    _copy(
                      'Reveal longer emotional cycles, yearly reviews, and deeper memory connections. Your basic 24-hour Mirror always remains available.',
                      'Uzun duygusal döngüleri, yıllık özetleri ve derin hafıza bağlantılarını gör. Temel 24 saatlik Ayna her zaman kullanılabilir kalır.',
                    ),
                    style: const TextStyle(color: MysticColors.mist),
                  ),
                  const SizedBox(height: 14),
                  FilledButton.icon(
                    onPressed: widget.onPremium,
                    icon: const Icon(Icons.auto_awesome, size: 18),
                    label: Text(_copy('Explore Premium', 'Premium’u keşfet')),
                  ),
                ],
              ),
            );
          }
'''

          new_method = '''  Widget _buildPatternLabCard() {
            final completed = mirrors.length;
            final readingCount = widget.records.length;
            final evidenceCount = completed.clamp(0, readingCount);
            final progress = readingCount == 0 ? 0.0 : evidenceCount / readingCount;
            return Container(
              padding: const EdgeInsets.all(18),
              decoration: BoxDecoration(
                gradient: const LinearGradient(
                  colors: [Color(0xFF4B2E72), Color(0xFF21152F)],
                ),
                borderRadius: BorderRadius.circular(22),
                border: Border.all(color: MysticColors.gold.withValues(alpha: .28)),
              ),
              child: Column(
                crossAxisAlignment: CrossAxisAlignment.start,
                children: [
                  const Icon(Icons.hub_outlined, color: MysticColors.gold),
                  const SizedBox(height: 10),
                  Text(
                    _mirrorCopy(
                      en: 'Your Pattern Lab grows with evidence',
                      tr: 'Örüntü Laboratuvarın kanıtla büyür',
                      es: 'Tu Laboratorio de Patrones crece con evidencia',
                      fr: 'Votre Laboratoire de schémas grandit avec les preuves',
                      pt: 'Seu Laboratório de Padrões cresce com evidências',
                    ),
                    style: const TextStyle(fontSize: 17, fontWeight: FontWeight.w900),
                  ),
                  const SizedBox(height: 7),
                  Text(
                    _mirrorCopy(
                      en: 'Every saved reading and honest 24-hour check-in adds context. Nothing is locked: richer patterns appear as your private history earns enough evidence.',
                      tr: 'Her kayıtlı okuma ve dürüst 24 saatlik kontrol yeni bağlam ekler. Hiçbir şey kilitli değil: özel geçmişin yeterli kanıt biriktirdikçe daha zengin örüntüler görünür.',
                      es: 'Cada lectura guardada y revisión honesta de 24 horas añade contexto. Nada está bloqueado: los patrones más ricos aparecen cuando tu historial privado reúne suficiente evidencia.',
                      fr: 'Chaque tirage enregistré et bilan honnête après 24 h ajoute du contexte. Rien n’est verrouillé : des schémas plus riches apparaissent lorsque votre historique privé accumule assez de preuves.',
                      pt: 'Cada leitura salva e check-in honesto de 24 horas adiciona contexto. Nada fica bloqueado: padrões mais ricos aparecem quando seu histórico privado reúne evidências suficientes.',
                    ),
                    style: const TextStyle(color: MysticColors.mist),
                  ),
                  const SizedBox(height: 13),
                  ClipRRect(
                    borderRadius: BorderRadius.circular(99),
                    child: LinearProgressIndicator(
                      value: progress,
                      minHeight: 7,
                      backgroundColor: Colors.white10,
                      color: MysticColors.gold,
                    ),
                  ),
                  const SizedBox(height: 8),
                  Text(
                    _mirrorCopy(
                      en: '$completed reality check-ins • $readingCount saved readings',
                      tr: '$completed gerçeklik kontrolü • $readingCount kayıtlı okuma',
                      es: '$completed revisiones de realidad • $readingCount lecturas guardadas',
                      fr: '$completed bilans de réalité • $readingCount tirages enregistrés',
                      pt: '$completed check-ins de realidade • $readingCount leituras salvas',
                    ),
                    style: const TextStyle(
                      color: MysticColors.lavender,
                      fontSize: 11,
                      fontWeight: FontWeight.w800,
                    ),
                  ),
                  const SizedBox(height: 14),
                  FilledButton.icon(
                    onPressed: () => setState(() => section = _JournalSection.map),
                    icon: const Icon(Icons.hub_rounded, size: 18),
                    label: Text(
                      _mirrorCopy(
                        en: 'Open my Pattern Map',
                        tr: 'Örüntü Haritamı aç',
                        es: 'Abrir mi Mapa de Patrones',
                        fr: 'Ouvrir ma Carte des schémas',
                        pt: 'Abrir meu Mapa de Padrões',
                      ),
                    ),
                  ),
                ],
              ),
            );
          }
'''
          replace_once(old_method, new_method, 'Premium card replacement')

          note_block = '''          if (mirror.note.trim().isNotEmpty) ...[
            const SizedBox(height: 6),
            Text(
              mirror.note,
              style: const TextStyle(color: MysticColors.mist, height: 1.4),
            ),
          ],
'''
          share_block = note_block + '''          const SizedBox(height: 8),
          Align(
            alignment: Alignment.centerLeft,
            child: TextButton.icon(
              onPressed: () async {
                await SharePlus.instance.share(
                  ShareParams(
                    text: mysticMirrorShareText(widget.language),
                    subject: mysticMirrorShareSubject(widget.language),
                  ),
                );
              },
              icon: const Icon(Icons.ios_share_rounded, size: 17),
              label: Text(
                _mirrorCopy(
                  en: 'Share the 24h ritual',
                  tr: '24 saatlik ritüeli paylaş',
                  es: 'Compartir el ritual de 24 h',
                  fr: 'Partager le rituel de 24 h',
                  pt: 'Compartilhar o ritual de 24 h',
                ),
              ),
            ),
          ),
'''
          replace_once(note_block, share_block, 'Mirror share action')

          lock_icon = '''          const Icon(
            Icons.lock_outline_rounded,
            size: 16,
            color: MysticColors.lavender,
          ),
'''
          open_icon = '''          const Icon(
            Icons.arrow_forward_rounded,
            size: 16,
            color: MysticColors.lavender,
          ),
'''
          replace_once(lock_icon, open_icon, 'Empty-state lock icon')

          for phrase in [
              'Unlock your full pattern map',
              'Explore Premium',
              'Premium’u keşfet',
          ]:
              if phrase in source:
                  raise SystemExit(f'forbidden paid-model phrase remains: {phrase}')

          path.write_text(source)

          readme = Path('README.md')
          readme_text = readme.read_text()
          old = '- at least one hour between app-open ad opportunities;'
          new = '- at least two hours between app-open ad opportunities;'
          if readme_text.count(old) != 1:
              raise SystemExit('README app-open interval anchor mismatch')
          readme.write_text(readme_text.replace(old, new, 1))

          verifier = Path('tool/verify_launch_surface.sh')
          verifier_text = verifier.read_text()
          anchor = "require_contains STORE_RELEASE.md 'no paid subscription'\n"
          guard = anchor + """\nfor paid_phrase in \\
  'Unlock your full pattern map' \\
  'Explore Premium' \\
  'Premium spreads continue' \\
  'Premium’u keşfet'; do
  forbid_contains lib/src/mystic_living_journal_feature.dart \"$paid_phrase\"
  forbid_contains lib/src/growth_engine.dart \"$paid_phrase\"
done
"""
          if verifier_text.count(anchor) != 1:
              raise SystemExit('launch verifier anchor mismatch')
          verifier.write_text(verifier_text.replace(anchor, guard, 1))
          PY

          dart format lib/src/mystic_living_journal_feature.dart lib/src/mystic_mirror_share.dart lib/src/business_metrics.dart test/business_metrics_test.dart test/mystic_mirror_share_test.dart test/growth_engine_test.dart
          grep -Fq 'Your Pattern Lab grows with evidence' lib/src/mystic_living_journal_feature.dart
          grep -Fq 'Share the 24h ritual' lib/src/mystic_living_journal_feature.dart
          ! grep -Fiq 'Explore Premium' lib/src/mystic_living_journal_feature.dart
          ! grep -Fiq 'Unlock your full pattern map' lib/src/mystic_living_journal_feature.dart

      - name: Commit migration and remove one-time workflow
        shell: bash
        run: |
          set -euo pipefail
          git rm .github/workflows/investment-grade-one-time-patch.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add lib/src/mystic_living_journal_feature.dart README.md tool/verify_launch_surface.sh lib/src/mystic_mirror_share.dart lib/src/business_metrics.dart test/business_metrics_test.dart test/mystic_mirror_share_test.dart test/growth_engine_test.dart
          git commit -m 'Harden investment-grade retention and free product UX'
          git push origin HEAD:product/investment-grade-growth
