name: Store URL Format Probe

on:
  pull_request:
    paths:
      - test/public_store_urls_test.dart
      - tool/src/public_store_urls.dart
      - tool/store_release_preflight.dart
      - .github/workflows/store-url-format-probe.yml

permissions:
  contents: read

jobs:
  format-probe:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out source
        uses: actions/checkout@v6
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Print canonical Dart format
        run: |
          dart format test/public_store_urls_test.dart tool/src/public_store_urls.dart tool/store_release_preflight.dart
          echo '---BEGIN TEST FILE---'
          cat test/public_store_urls_test.dart
          echo '---END TEST FILE---'
          echo '---BEGIN URL TOOL FILE---'
          cat tool/src/public_store_urls.dart
          echo '---END URL TOOL FILE---'
          echo '---BEGIN PREFLIGHT FILE---'
          cat tool/store_release_preflight.dart
          echo '---END PREFLIGHT FILE---'
