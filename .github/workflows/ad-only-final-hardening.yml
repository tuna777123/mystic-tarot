  const KotlinPluginWarningFailure(this.message);

  final String message;

  @override
  String toString() => message;
}

const conditionallyCompatibleLegacyKgpPlugins = <String>{'flutter_timezone'};

const expectedLegacyKgpPlugins = <String>{
  ...conditionallyCompatibleLegacyKgpPlugins,
};

class KotlinPluginPolicyDelta {
  const KotlinPluginPolicyDelta({
    required this.missing,
    required this.unexpected,
  });

  final Set<String> missing;
  final Set<String> unexpected;

  bool get isValid => missing.isEmpty && unexpected.isEmpty;
}

Set<String> parseLegacyKgpPlugins(String buildLog) {
  final match = RegExp(
    r'plugins that apply Kotlin Gradle Plugin \\(KGP\\):\\s*([^\\r\\n]+)',
    caseSensitive: false,
  ).firstMatch(buildLog);
  if (match == null) {
    return <String>{};
  }

  return match
      .group(1)!
      .split(',')
      .map((plugin) => plugin.trim())
      .where((plugin) => plugin.isNotEmpty)
      .toSet();
}

KotlinPluginPolicyDelta compareLegacyKgpPlugins(Set<String> observed) {
  return KotlinPluginPolicyDelta(
    missing: expectedLegacyKgpPlugins.difference(observed),
    unexpected: observed.difference(expectedLegacyKgpPlugins),
  );
}

String buildKotlinCompatibilityReport(Set<String> observed) {
  final sortedObserved = _sorted(observed);
  final conditional = _sorted(
    observed.intersection(conditionallyCompatibleLegacyKgpPlugins),
  );

  return '''# Mystic Tarot Built-in Kotlin Audit

- Result: **PASS**
- Reviewed Flutter warning entries: `${sortedObserved.join(', ')}`
- Conditional compatibility warning: `${conditional.join(', ')}`
- Unknown or regressed plugins: `none`
- Policy drift: `none`

`flutter_timezone` conditionally avoids the legacy Kotlin Gradle Plugin when
Built-in Kotlin is enabled; Flutter's warning scan does not evaluate that
condition. `purchases_flutter` is intentionally absent from the dependency
graph in the advertising-only release. Any addition, removal, or warning-format
change stops the release until this reviewed classification is updated.
''';
}

List<String> _sorted(Iterable<String> values) {
  return values.toList()..sort();
}
""")

          Path('test/kotlin_plugin_warnings_test.dart').write_text("""import 'package:flutter_test/flutter_test.dart';

import '../tool/src/kotlin_plugin_warnings.dart';

void main() {
  test('parses the Flutter KGP warning list', () {
    const log = '''
WARNING: Your app uses the following plugins that apply Kotlin Gradle Plugin (KGP): flutter_timezone
Future versions of Flutter will fail to build.
''';

    expect(parseLegacyKgpPlugins(log), <String>{'flutter_timezone'});
  });

  test('returns empty when the warning is absent', () {
    expect(parseLegacyKgpPlugins('Build completed successfully.'), isEmpty);
  });

  test('the reviewed set contains only the plugin still shipped', () {
    expect(conditionallyCompatibleLegacyKgpPlugins, {'flutter_timezone'});
    expect(expectedLegacyKgpPlugins, {'flutter_timezone'});
  });

  test('accepts only the exact reviewed warning set', () {
    final delta = compareLegacyKgpPlugins(<String>{'flutter_timezone'});

    expect(delta.isValid, isTrue);
    expect(delta.missing, isEmpty);
    expect(delta.unexpected, isEmpty);
  });

  test('detects a disappeared warning for explicit policy review', () {
    final delta = compareLegacyKgpPlugins(<String>{});

    expect(delta.isValid, isFalse);
    expect(delta.missing, {'flutter_timezone'});
    expect(delta.unexpected, isEmpty);
  });

  test('blocks billing and unknown legacy plugins if they reappear', () {
    final delta = compareLegacyKgpPlugins(<String>{
      'flutter_timezone',
      'purchases_flutter',
      'share_plus',
      'unexpected_plugin',
    });

    expect(delta.isValid, isFalse);
    expect(delta.missing, isEmpty);
    expect(delta.unexpected, {
      'purchases_flutter',
      'share_plus',
      'unexpected_plugin',
    });
  });

  test('report records that only the conditional warning remains', () {
    final report = buildKotlinCompatibilityReport(<String>{'flutter_timezone'});

    expect(report, contains('Result: **PASS**'));
    expect(
      report,
      contains('Conditional compatibility warning: `flutter_timezone`'),
    );
    expect(report, contains('purchases_flutter` is intentionally absent'));
  });
}
""")

