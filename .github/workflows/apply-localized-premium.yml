name: Apply localized premium screen

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/localized-premium-plan
          fetch-depth: 0
      - name: Wire localized premium plan
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('lib/src/app.dart')
          text = path.read_text()
          anchor = "import 'models.dart';\n"
          line = "import 'localized_premium_screen.dart';\n"
          if line not in text:
              text = text.replace(anchor, anchor + line, 1)
          old = "PremiumScreen(source: source)"
          new = "LocalizedPremiumScreen(source: source, language: language)"
          if old in text:
              text = text.replace(old, new, 1)
          elif new not in text:
              raise SystemExit('Premium route anchor not found')
          path.write_text(text)
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lib/src/app.dart
          git commit -m "feat: route premium checkout through localized plan screen" || exit 0
          git push origin HEAD:feature/localized-premium-plan
