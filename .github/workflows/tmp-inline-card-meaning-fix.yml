name: Temporary Inline Card Meaning Fix

on:
  push:
    branches:
      - product/context-aware-meanings

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: product/context-aware-meanings
          fetch-depth: 0
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.9'
          channel: stable
          cache: true
      - name: Inline multi-sentence localized meanings inside synthesis
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('lib/src/reading_synthesis.dart')
          text = path.read_text()
          replacements = 0
          for name in ('card', 'first', 'second', 'bridge', 'last', 'lens'):
              old = f'_sentence({name}.meaning)'
              new = f'_sentence(_inline({name}.meaning))'
              count = text.count(old)
              if count:
                  text = text.replace(old, new)
                  replacements += count
          if replacements < 6:
              raise SystemExit(f'expected at least 6 meaning replacements, found {replacements}')
          anchor = "String _sentence(String value) {\n"
          helper = """String _inline(String value) {\n  final text = value.trim();\n  if (text.isEmpty) return text;\n  return text\n      .replaceAll(RegExp(r'[.!?…]+\\s+'), '; ')\n      .replaceAll(RegExp(r'[.!?…]+$'), '');\n}\n\n"""
          if helper not in text:
              if text.count(anchor) != 1:
                  raise SystemExit('sentence helper anchor changed')
              text = text.replace(anchor, helper + anchor, 1)
          path.write_text(text)
          PY
          dart format lib/src/reading_synthesis.dart
      - name: Commit fix
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet; then exit 0; fi
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add lib/src/reading_synthesis.dart
          git commit -m "Keep deep-spread meanings position-bound"
          git push origin HEAD:product/context-aware-meanings
