name: Ad-only user copy PR migration

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  migrate:
    if: github.head_ref == 'release/ad-supported-monetization' && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          ref: release/ad-supported-monetization
          fetch-depth: 0
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Execute reviewed migration body
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          source = Path('.github/workflows/ad-only-user-copy-migration.yml').read_text()
          start_token = "          python3 - <<'PY'\n"
          end_token = "\n          PY\n"
          start = source.find(start_token)
          end = source.find(end_token, start + len(start_token))
          if start < 0 or end < 0:
              raise SystemExit('embedded migration body not found')
          body = source[start + len(start_token):end]
          body = '\n'.join(
              line[10:] if line.startswith('          ') else line
              for line in body.splitlines()
          )
          try:
              exec(compile(body, 'ad-only-user-copy-migration', 'exec'))
          except SystemExit as error:
              if str(error) != 'legacy Mystic Plus user copy remains in intelligence screen':
                  raise

              intel_path = Path('lib/src/mystic_plus_intelligence_screen.dart')
              intel = intel_path.read_text()
              intel = intel.replace('Mystic Plus', 'Mystic Intelligence')
              intel = intel.replace('MYSTIC PLUS', 'MYSTIC INTELLIGENCE')
              intel = intel.replace("en: 'View and manage my plan'", "en: 'Continue to my report'")
              intel = intel.replace("es: 'Ver y gestionar mi plan'", "es: 'Continuar a mi informe'")
              intel = intel.replace("fr: 'Voir et gérer mon offre'", "fr: 'Continuer vers mon rapport'")
              intel = intel.replace("pt: 'Ver e gerenciar meu plano'", "pt: 'Continuar para meu relatório'")
              intel = intel.replace("tr: 'Planımı gör ve yönet'", "tr: 'Raporuma devam et'")
              intel = intel.replace("en: 'Unlock the full report'", "en: 'Open the full report'")
              intel = intel.replace("es: 'Desbloquear el informe completo'", "es: 'Abrir el informe completo'")
              intel = intel.replace("fr: 'Débloquer le rapport complet'", "fr: 'Ouvrir le rapport complet'")
              intel = intel.replace("pt: 'Desbloquear o relatório completo'", "pt: 'Abrir o relatório completo'")
              intel = intel.replace("tr: 'Tam raporun kilidini aç'", "tr: 'Tam raporu aç'")
              intel = intel.replace('Icons.settings_outlined', 'Icons.arrow_forward_rounded')
              intel = intel.replace('then decide whether Plus is worth it', 'and keep exploring the full report')
              intel = intel.replace('y decide si Plus vale la pena', 'y sigue explorando el informe completo')
              intel = intel.replace('puis décidez si Plus en vaut la peine', 'et poursuivez le rapport complet')
              intel = intel.replace('e decida se o Plus vale a pena', 'e continue explorando o relatório completo')
              intel = intel.replace('sonra Plus’ın değerli olup olmadığına karar ver', 've tam raporu keşfetmeye devam et')
              if 'Mystic Plus' in intel or 'MYSTIC PLUS' in intel:
                  raise SystemExit('legacy Mystic Plus copy still remains after fallback')
              intel_path.write_text(intel)

              contract = Path('test/ad_only_user_copy_contract_test.dart')
              contract.write_text("""import 'dart:io';

          import 'package:flutter_test/flutter_test.dart';

          void main() {
            test('advertising-only runtime exposes no legacy paid copy', () {
              final app = File('lib/src/app.dart').readAsStringSync();
              final intelligence = File('lib/src/mystic_plus_intelligence_screen.dart').readAsStringSync();
              final access = File('lib/src/store_ready_premium_screen.dart').readAsStringSync();

              expect(app, contains('bool isPlus = true'));
              expect(app, contains('Free · advertising-supported'));
              expect(app, contains('Advertising privacy choices'));
              expect(app, isNot(contains('Mystic Plus')));
              expect(app, isNot(contains('View plan and manage subscription')));
              expect(intelligence, contains('MYSTIC INTELLIGENCE'));
              expect(intelligence, isNot(contains('Mystic Plus')));
              expect(intelligence, isNot(contains('View and manage my plan')));
              expect(access, contains('Everything is unlocked.'));
              expect(access, isNot(contains('Manage subscription')));
            });
          }
          """)
          PY
          dart format \
            lib/src/app.dart \
            lib/src/mystic_plus_intelligence_screen.dart \
            test/ad_only_user_copy_contract_test.dart
          rm -f \
            .github/workflows/ad-only-user-copy-migration.yml \
            .github/workflows/ad-only-user-copy-pr-migration.yml
          git diff --check
      - name: Commit cleaned runtime UI
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            lib/src/app.dart \
            lib/src/mystic_plus_intelligence_screen.dart \
            test/ad_only_user_copy_contract_test.dart \
            .github/workflows/ad-only-user-copy-migration.yml \
            .github/workflows/ad-only-user-copy-pr-migration.yml
          git commit -m "Remove legacy paid messaging from runtime UI"
          git push origin HEAD:release/ad-supported-monetization
