name: Integrate Mystic Tarot v1.13

on:
  push:
    branches: [feature/v1.13-activation-retention]

permissions:
  contents: write

concurrency:
  group: integrate-v113
  cancel-in-progress: false

jobs:
  integrate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out feature branch
        uses: actions/checkout@v4
        with:
          ref: feature/v1.13-activation-retention
          fetch-depth: 0

      - name: Materialize final v1.13 source
        run: python tool/integrate_v113_bootstrap.py

      - name: Commit clean product tree
        run: |
          git config user.name "mystic-release-bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "feat: ship v1.13 activation and ritual retention"
          git push origin HEAD:feature/v1.13-activation-retention
