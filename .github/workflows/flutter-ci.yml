name: Apply Mystic Tarot v1.13 fix

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: apply-v113-fix-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  apply-fix:
    runs-on: ubuntu-latest
    steps:
      - name: Check out feature branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0

      - name: Apply verified source fix
        run: |
          python tool/fix_v113_context.py
          git checkout HEAD -- .github/workflows/flutter-ci.yml

      - name: Commit clean source fix
        run: |
          git config user.name "mystic-release-bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "fix: guard reminder UI across async gaps"
          git push origin HEAD:${{ github.head_ref }}
