name: Flutter CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: flutter-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Generate platform shells
        run: flutter create . --platforms=android,ios --org com.tunabozcali

      - name: Set permanent store identifiers
        run: |
          find android ios -type f \( -name "*.kt" -o -name "*.gradle.kts" -o -name "project.pbxproj" \) -print0 \
            | xargs -0 sed -i \
                -e 's/com\.tunabozcali\.mystic_tarot/com.tunabozcali.mystictarot/g' \
                -e 's/com\.tunabozcali\.mysticTarot/com.tunabozcali.mystictarot/g'
          grep -R "com.tunabozcali.mystictarot" android/app
          grep "com.tunabozcali.mystictarot" ios/Runner.xcodeproj/project.pbxproj

      - name: Install dependencies
        run: flutter pub get

      - name: Generate branded native icons
        run: dart run flutter_launcher_icons

      - name: Analyze
        run: flutter analyze

      - name: Test
        run: flutter test

      - name: Build web release
        run: flutter build web --release

      - name: Build Android release bundle
        run: flutter build appbundle --release

      - name: Upload web release
        uses: actions/upload-artifact@v4
        with:
          name: mystic-tarot-web
          path: build/web
          if-no-files-found: error

      - name: Upload Android bundle
        uses: actions/upload-artifact@v4
        with:
          name: mystic-tarot-android-aab
          path: build/app/outputs/bundle/release/app-release.aab
          if-no-files-found: error
