name: Flutter CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: flutter-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  responsive-fix:
    if: github.event_name == 'pull_request' && github.head_ref == 'release/french-and-quality'
    runs-on: ubuntu-latest
    steps:
      - name: Check out French release branch
        uses: actions/checkout@v4
        with:
          ref: release/french-and-quality

      - name: Apply responsive multilingual layouts once
        shell: bash
        run: |
          if [ ! -f .responsive-trigger ]; then
            echo 'Responsive corrections already applied.'
            exit 0
          fi
          python3 - <<'PY'
          from pathlib import Path

          def replace_section(text, key, start_marker, end_marker, replacement):
              key_at = text.index(key)
              start = text.rfind(start_marker, 0, key_at)
              end = text.index(end_marker, key_at)
              assert start >= 0 and end > start
              return text[:start] + replacement + text[end:]

          app = Path('lib/src/app.dart')
          text = app.read_text()
          text = replace_section(
              text,
              "'CHOOSE YOUR CARDS'",
              '        Row(\n',
              '        const SizedBox(height: 9),',
              """        Row(
          crossAxisAlignment: CrossAxisAlignment.start,
          children: [
            Expanded(
              child: Text(
                mysticText(
                  widget.language,
                  'CHOOSE YOUR CARDS',
                  'KARTLARINI SEÇ',
                ),
                maxLines: 2,
                style: const TextStyle(
                  fontFamily: 'Arial',
                  color: MysticColors.gold,
                  fontSize: 10,
                  fontWeight: FontWeight.w900,
                  letterSpacing: 1.15,
                ),
              ),
            ),
            const SizedBox(width: 12),
            Expanded(
              child: Text(
                mysticText(
                  widget.language,
                  'Trust the first pull',
                  'İlk çekime güven',
                ),
                maxLines: 2,
                textAlign: TextAlign.end,
                style: Theme.of(context).textTheme.bodyMedium?.copyWith(fontSize: 10),
              ),
            ),
          ],
        ),
""",
          )
          text = replace_section(
              text,
              "'The first signal is forming…'",
              '              firstChild: Center(\n',
              '              secondChild:',
              """              firstChild: Row(
                children: [
                  const SizedBox(
                    width: 16,
                    height: 16,
                    child: CircularProgressIndicator(
                      strokeWidth: 2,
                      color: MysticColors.gold,
                    ),
                  ),
                  const SizedBox(width: 10),
                  Expanded(
                    child: Text(
                      mysticText(
                        widget.language,
                        'The first signal is forming…',
                        'İlk işaret şekilleniyor…',
                      ),
                      maxLines: 2,
                      textAlign: TextAlign.center,
                      style: const TextStyle(
                        fontFamily: 'Arial',
                        color: MysticColors.lavender,
                        fontSize: 11,
                      ),
                    ),
                  ),
                ],
              ),
""",
          )
          text = replace_section(
              text,
              "'The rest of your spread'",
              '            Row(\n',
              '            const SizedBox(height: 12),',
              """            Row(
              crossAxisAlignment: CrossAxisAlignment.start,
              children: [
                Expanded(
                  child: Text(
                    mysticText(
                      widget.language,
                      'The rest of your spread',
                      'Açılımının geri kalanı',
                    ),
                    maxLines: 2,
                    style: Theme.of(context).textTheme.titleLarge,
                  ),
                ),
                const SizedBox(width: 12),
                Flexible(
                  child: Text(
                    mysticText(
                      widget.language,
                      '${widget.kind.cardCount - 1} LOCKED',
                      '${widget.kind.cardCount - 1} KİLİTLİ',
                    ),
                    maxLines: 2,
                    textAlign: TextAlign.end,
                    style: const TextStyle(
                      fontFamily: 'Arial',
                      color: MysticColors.gold,
                      fontSize: 8,
                      fontWeight: FontWeight.w900,
                      letterSpacing: .8,
                    ),
                  ),
                ),
              ],
            ),
""",
          )
          app.write_text(text)

          widgets = Path('lib/src/widgets.dart')
          value = widgets.read_text()
          start = value.index('  @override\n  Widget build(BuildContext context) => SizedBox(', value.index('class GoldButton'))
          end = value.index('\n}\n\nclass TarotCardFace', start)
          replacement = """  @override
  Widget build(BuildContext context) => SizedBox(
        width: double.infinity,
        height: 56,
        child: FilledButton(
          onPressed: onPressed,
          style: FilledButton.styleFrom(
            foregroundColor: MysticColors.ink,
            backgroundColor: MysticColors.gold,
            disabledBackgroundColor: MysticColors.gold.withValues(alpha: .25),
            shape: RoundedRectangleBorder(borderRadius: BorderRadius.circular(18)),
          ),
          child: Row(
            mainAxisAlignment: MainAxisAlignment.center,
            children: [
              if (icon != null) Icon(icon, size: 18),
              if (icon != null) const SizedBox(width: 8),
              Flexible(
                child: Text(
                  label,
                  maxLines: 2,
                  overflow: TextOverflow.ellipsis,
                  textAlign: TextAlign.center,
                ),
              ),
            ],
          ),
        ),
      );"""
          widgets.write_text(value[:start] + replacement + value[end:])

          tests = Path('test/widget_test.dart')
          test_text = tests.read_text()
          old = """      MysticLanguage.spanish,
      MysticLanguage.portugueseBrazil,
"""
          new = """      MysticLanguage.spanish,
      MysticLanguage.french,
      MysticLanguage.portugueseBrazil,
"""
          assert old in test_text
          tests.write_text(test_text.replace(old, new, 1))
          PY
          rm -f .responsive-trigger
          rm -f .github/workflows/fix-french-responsive.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git diff --cached --check
          git commit -m 'fix: make multilingual reading layouts responsive'
          git push origin HEAD:release/french-and-quality

  test-and-build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Generate platform shells
        run: flutter create . --platforms=android,ios --org com.tunabozcali

      - name: Set permanent store identifiers
        run: dart run tool/configure_store_identifiers.dart

      - name: Validate protected signing configurator
        run: |
          cp android/app/build.gradle.kts /tmp/mystic-build.gradle.kts
          dart run tool/configure_android_signing.dart
          grep -q 'signingConfigs.getByName("release")' android/app/build.gradle.kts
          mv /tmp/mystic-build.gradle.kts android/app/build.gradle.kts

      - name: Install dependencies
        run: flutter pub get

      - name: Generate branded native icons
        run: dart run flutter_launcher_icons

      - name: Analyze
        run: flutter analyze

      - name: Test
        run: flutter test

      - name: Build web release
        run: flutter build web --release

      - name: Build Android release bundle
        run: flutter build appbundle --release

      - name: Upload web release
        uses: actions/upload-artifact@v4
        with:
          name: mystic-tarot-web
          path: build/web
          if-no-files-found: error

      - name: Upload Android bundle
        uses: actions/upload-artifact@v4
        with:
          name: mystic-tarot-android-aab
          path: build/app/outputs/bundle/release/app-release.aab
          if-no-files-found: error
