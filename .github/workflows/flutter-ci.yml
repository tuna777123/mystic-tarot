name: Integrate Mystic Tarot v1.13

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: integrate-v113-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  integrate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out feature branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0

      - name: Materialize final v1.13 source
        run: |
          wc -c tool/.v113_payload.part*
          sha256sum tool/.v113_payload.part*
          python tool/integrate_v113_bootstrap.py
          git checkout HEAD -- .github/workflows/flutter-ci.yml

      - name: Commit clean product tree
        run: |
          git config user.name "mystic-release-bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "feat: ship v1.13 activation and ritual retention"
          git push origin HEAD:${{ github.head_ref }}
