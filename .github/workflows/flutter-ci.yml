name: Flutter CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref_name }}
          fetch-depth: 0

      - name: Integrate seven-language onboarding and profile
        if: github.event_name == 'pull_request' && github.head_ref == 'feature/mystic-soul-experience'
        run: |
          python3 - <<'PY'
          from pathlib import Path

          flagship = Path('lib/src/flagship.dart')
          text = flagship.read_text()
          old_enum = """enum MysticLanguage {
            english('English', 'EN'),
            turkish('Türkçe', 'TR');
          """.replace('  ', '', 1)
          new_enum = """enum MysticLanguage {
            english('English', 'EN'),
            spanish('Español', 'ES'),
            french('Français', 'FR'),
            portugueseBrazil('Português (Brasil)', 'PT-BR'),
            turkish('Türkçe', 'TR'),
            italian('Italiano', 'IT'),
            german('Deutsch', 'DE');
          """.replace('  ', '', 1)
          if old_enum in text:
              flagship.write_text(text.replace(old_enum, new_enum, 1))

          app = Path('lib/src/app.dart')
          text = app.read_text()
          old_picker = """      SegmentedButton<MysticLanguage>(
            segments: MysticLanguage.values.map((item) => ButtonSegment(value: item, label: Text(item.label))).toList(),
            selected: {language},
            onSelectionChanged: (value) => setState(() => language = value.first),
          ),
          """.replace('  ', '', 1)
          new_picker = """      Wrap(
            alignment: WrapAlignment.center,
            spacing: 8,
            runSpacing: 8,
            children: MysticLanguage.values.map((item) => ChoiceChip(
              label: Text(item.label),
              selected: language == item,
              onSelected: (_) => setState(() => language = item),
              selectedColor: MysticColors.violet,
            )).toList(),
          ),
          """.replace('  ', '', 1)
          if old_picker in text:
              app.write_text(text.replace(old_picker, new_picker, 1))

          test = Path('test/mystic_language_integration_test.dart')
          test.write_text("""import 'package:flutter_test/flutter_test.dart';
          import 'package:mystic_tarot/src/flagship.dart';

          void main() {
            test('application language model exposes all seven languages', () {
              expect(MysticLanguage.values.length, 7);
              expect(MysticLanguage.values.map((item) => item.label), containsAll(<String>[
                'English', 'Español', 'Français', 'Português (Brasil)',
                'Türkçe', 'Italiano', 'Deutsch',
              ]));
            });

            test('legacy copy falls back to English outside Turkish', () {
              for (final language in MysticLanguage.values.where((item) => item != MysticLanguage.turkish)) {
                expect(mysticText(language, 'Read', 'Oku'), 'Read');
              }
              expect(mysticText(MysticLanguage.turkish, 'Read', 'Oku'), 'Oku');
            });
          }
          """.replace('          ', ''))
          PY

          if ! git diff --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add lib/src/flagship.dart lib/src/app.dart test/mystic_language_integration_test.dart
            git commit -m "feat: connect seven languages to onboarding and profile"
            git push origin HEAD:feature/mystic-soul-experience
          fi

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Generate platform shells
        run: flutter create .

      - name: Install dependencies
        run: flutter pub get

      - name: Generate branded native icons
        run: dart run flutter_launcher_icons

      - name: Analyze
        run: flutter analyze

      - name: Test
        run: flutter test

      - name: Build web release
        run: flutter build web --release

      - name: Build Android release bundle
        run: flutter build appbundle --release

      - name: Upload web release
        uses: actions/upload-artifact@v4
        with:
          name: mystic-tarot-web
          path: build/web
          if-no-files-found: error

      - name: Upload Android bundle
        uses: actions/upload-artifact@v4
        with:
          name: mystic-tarot-android-aab
          path: build/app/outputs/bundle/release/app-release.aab
          if-no-files-found: error
