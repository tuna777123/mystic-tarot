name: Flutter CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref_name }}
          fetch-depth: 0

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Generate platform shells
        run: flutter create .

      - name: Install dependencies
        run: flutter pub get

      - name: Generate branded native icons
        run: dart run flutter_launcher_icons

      - name: Analyze
        run: |
          set +e
          flutter analyze > analyzer-output.txt 2>&1
          status=$?
          cat analyzer-output.txt
          if [ "$status" -ne 0 ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add analyzer-output.txt
            git commit -m "chore: capture onboarding analyzer diagnostics" || true
            git push origin HEAD:feature/seven-language-onboarding || true
          fi
          exit $status

      - name: Test
        run: flutter test

      - name: Build web release
        run: flutter build web --release

      - name: Build Android release bundle
        run: flutter build appbundle --release
