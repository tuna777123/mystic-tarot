name: Flutter CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: flutter-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Upload temporary source snapshot
        uses: actions/upload-artifact@v4
        with:
          name: mystic-tarot-source
          path: |
            lib
            test
            tool
            web
            docs
            pubspec.yaml
            pubspec.lock
            README.md
            RELEASE_NOTES.md
            STORE_RELEASE.md
            .github/workflows/flutter-ci.yml
          if-no-files-found: error
          retention-days: 1

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Generate platform shells
        run: flutter create . --platforms=android,ios --org com.tunabozcali

      - name: Set permanent store identifiers
        run: dart run tool/configure_store_identifiers.dart

      - name: Validate protected signing configurator
        run: |
          cp android/app/build.gradle.kts /tmp/mystic-build.gradle.kts
          dart run tool/configure_android_signing.dart
          grep -q 'signingConfigs.getByName("release")' android/app/build.gradle.kts
          mv /tmp/mystic-build.gradle.kts android/app/build.gradle.kts

      - name: Install dependencies
        run: flutter pub get

      - name: Generate branded native icons
        run: dart run flutter_launcher_icons

      - name: Analyze
        run: flutter analyze

      - name: Test
        run: flutter test

      - name: Build web release
        run: flutter build web --release

      - name: Build Android release bundle
        run: flutter build appbundle --release

      - name: Upload web release
        uses: actions/upload-artifact@v4
        with:
          name: mystic-tarot-web
          path: build/web
          if-no-files-found: error

      - name: Upload Android bundle
        uses: actions/upload-artifact@v4
        with:
          name: mystic-tarot-android-aab
          path: build/app/outputs/bundle/release/app-release.aab
          if-no-files-found: error
