name: Flutter CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: flutter-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Materialize v1.21 release candidate
        if: github.event_name == 'pull_request' && github.head_ref == 'feature/v1.21-launch-differentiation'
        run: python tool/v121_integrate.py

      - name: Format v1.21 release files
        if: github.event_name == 'pull_request' && github.head_ref == 'feature/v1.21-launch-differentiation'
        run: >-
          dart format
          lib/src/app.dart
          lib/src/launch_differentiation.dart
          lib/src/mystic_next_step.dart
          lib/src/reading_position.dart
          lib/src/reading_synthesis.dart
          lib/src/store_ready_premium_screen.dart
          test/launch_differentiation_test.dart
          test/reading_synthesis_test.dart
          test/v118_private_journal_transfer_contract_test.dart
          test/v120_private_app_lock_contract_test.dart
          test/v121_launch_differentiation_contract_test.dart

      - name: Generate platform shells
        run: flutter create . --platforms=android,ios --org com.tunabozcali

      - name: Set permanent store identifiers
        run: dart run tool/configure_store_identifiers.dart

      - name: Configure daily ritual notifications
        run: dart run tool/configure_ritual_notifications.dart

      - name: Configure private app lock
        run: dart run tool/configure_app_lock.dart

      - name: Validate protected signing configurator
        run: |
          cp android/app/build.gradle.kts /tmp/mystic-build.gradle.kts
          dart run tool/configure_android_signing.dart
          grep -q 'signingConfigs.getByName("release")' android/app/build.gradle.kts
          mv /tmp/mystic-build.gradle.kts android/app/build.gradle.kts

      - name: Install dependencies
        run: flutter pub get

      - name: Generate branded native icons
        run: dart run flutter_launcher_icons

      - name: Analyze
        run: flutter analyze

      - name: Test
        run: flutter test

      - name: Build web release
        run: flutter build web --release

      - name: Build Android release bundle
        run: flutter build appbundle --release

      - name: Upload verified v1.21 source
        if: github.event_name == 'pull_request' && github.head_ref == 'feature/v1.21-launch-differentiation'
        uses: actions/upload-artifact@v4
        with:
          name: mystic-tarot-v121-verified-source
          if-no-files-found: error
          path: |
            lib/src/app.dart
            lib/src/launch_differentiation.dart
            lib/src/mystic_next_step.dart
            lib/src/reading_position.dart
            lib/src/reading_synthesis.dart
            lib/src/store_ready_premium_screen.dart
            pubspec.yaml
            README.md
            STORE_RELEASE.md
            RELEASE_NOTES.md
            RELEASE_NOTES_1.21.md
            test/launch_differentiation_test.dart
            test/reading_synthesis_test.dart
            test/v118_private_journal_transfer_contract_test.dart
            test/v120_private_app_lock_contract_test.dart
            test/v121_launch_differentiation_contract_test.dart

      - name: Upload web release
        uses: actions/upload-artifact@v4
        with:
          name: mystic-tarot-web
          path: build/web
          if-no-files-found: error

      - name: Upload Android bundle
        uses: actions/upload-artifact@v4
        with:
          name: mystic-tarot-android-aab
          path: build/app/outputs/bundle/release/app-release.aab
          if-no-files-found: error
