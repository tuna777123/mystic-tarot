name: Flutter CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  # BEGIN JOURNEY INTEGRATION JOB
  integrate-journey:
    if: ${{ github.event_name == 'pull_request' && startsWith(github.head_ref, 'feature/journey-final-integration-v') }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Check out integration branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0

      - name: Apply final Journey integration
        shell: python
        run: |
          from pathlib import Path

          app_path = Path('lib/src/app.dart')
          text = app_path.read_text()

          if "import 'mystic_journey_feature.dart';" not in text:
              import_needle = "import 'mystic_identity_screen.dart';\n"
              import_replacement = import_needle + "import 'mystic_journey_feature.dart';\n"
              if text.count(import_needle) != 1:
                  raise SystemExit('Journey import anchor was not unique')
              text = text.replace(import_needle, import_replacement, 1)

              tab_needle = "          JourneyScreen(streak: streak, xp: xp, records: journal, discoveredCards: discoveredCards, completedRituals: completedRituals, claimedRewards: claimedRewards, completedArcanaDays: completedArcanaDays, language: language, onOpenDestiny: _openDestinyHub, onCompleteRitual: _completeRitual, onClaimReward: _claimReward),\n"
              tab_replacement = "\n".join([
                  "          MysticJourneysFeature(",
                  "            language: language,",
                  "            onOpenDestiny: _openDestinyHub,",
                  "            onStartReading: () {",
                  "              setState(() => tab = 0);",
                  "              _startReading(ReadingKind.daily);",
                  "            },",
                  "          ),",
                  "",
              ])
              if text.count(tab_needle) != 1:
                  raise SystemExit('Path tab anchor was not unique')
              text = text.replace(tab_needle, tab_replacement, 1)

              methods_needle = "\n".join([
                  "  void _completeRitual(String id) {",
                  "    if (completedRituals.contains(id)) return;",
                  "    setState(() {",
                  "      completedRituals.add(id);",
                  "      xp += 15;",
                  "    });",
                  "    _saveProgress();",
                  "  }",
                  "",
                  "  void _claimReward(int milestone) {",
                  "    if (xp < milestone || claimedRewards.contains(milestone)) return;",
                  "    setState(() => claimedRewards.add(milestone));",
                  "    _saveProgress();",
                  "  }",
                  "",
                  "",
              ])
              if text.count(methods_needle) != 1:
                  raise SystemExit('Legacy Path method anchor was not unique')
              text = text.replace(methods_needle, '', 1)
              app_path.write_text(text)

          marker = Path('docs/JOURNEY_INTEGRATION_REQUEST.md')
          if marker.exists():
              marker.unlink()

          legacy_workflow = Path('.github/workflows/apply-journey-integration.yml')
          if legacy_workflow.exists():
              legacy_workflow.unlink()

          ci_path = Path('.github/workflows/flutter-ci.yml')
          ci_text = ci_path.read_text()
          begin_marker = '  # BEGIN ' + 'JOURNEY INTEGRATION JOB\n'
          end_marker = '  # END ' + 'JOURNEY INTEGRATION JOB\n'
          start = ci_text.index(begin_marker)
          finish = ci_text.index(end_marker, start) + len(end_marker)
          ci_path.write_text(ci_text[:start] + ci_text[finish:])

      - name: Commit integrated app shell
        shell: bash
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat: integrate Mystic Journeys into the app shell [journey-integrated]"
          git push origin HEAD:${{ github.head_ref }}
  # END JOURNEY INTEGRATION JOB

  test-and-build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Generate platform shells
        run: flutter create .

      - name: Install dependencies
        run: flutter pub get

      - name: Generate branded native icons
        run: dart run flutter_launcher_icons

      - name: Analyze
        run: flutter analyze

      - name: Test
        run: flutter test

      - name: Build web release
        run: flutter build web --release

      - name: Build Android release bundle
        run: flutter build appbundle --release

      - name: Upload web release
        uses: actions/upload-artifact@v4
        with:
          name: mystic-tarot-web
          path: build/web
          if-no-files-found: error

      - name: Upload Android bundle
        uses: actions/upload-artifact@v4
        with:
          name: mystic-tarot-android-aab
          path: build/app/outputs/bundle/release/app-release.aab
          if-no-files-found: error
