name: Flutter CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref_name }}
          fetch-depth: 0

      - name: Deduplicate onboarding helpers
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('lib/src/app.dart')
          text = path.read_text()
          block = """  String _copy({required String en, required String es, required String fr, required String pt, required String tr, required String it, required String de}) => localized(language.appLanguage, english: en, spanish: es, french: fr, portugueseBrazil: pt, turkish: tr, italian: it, german: de);

  String _intentionLabel(String value) => switch (value) {
        'Clarity' => _copy(en: 'Clarity', es: 'Claridad', fr: 'Clarté', pt: 'Clareza', tr: 'Netlik', it: 'Chiarezza', de: 'Klarheit'),
        'Love' => _copy(en: 'Love', es: 'Amor', fr: 'Amour', pt: 'Amor', tr: 'Aşk', it: 'Amore', de: 'Liebe'),
        'Purpose' => _copy(en: 'Purpose', es: 'Propósito', fr: 'Mission', pt: 'Propósito', tr: 'Amaç', it: 'Scopo', de: 'Bestimmung'),
        'Healing' => _copy(en: 'Healing', es: 'Sanación', fr: 'Guérison', pt: 'Cura', tr: 'İyileşme', it: 'Guarigione', de: 'Heilung'),
        _ => value,
      };

"""
          if text.count(block) > 1:
              first = text.find(block)
              second = text.find(block, first + len(block))
              text = text[:second] + text[second + len(block):]
          path.write_text(text)
          Path('analyzer-output.txt').unlink(missing_ok=True)
          PY

          if ! git diff --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add -A
            git commit -m "fix: deduplicate onboarding localization helpers"
            git push origin HEAD:feature/seven-language-onboarding
          fi

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Generate platform shells
        run: flutter create .

      - name: Install dependencies
        run: flutter pub get

      - name: Generate branded native icons
        run: dart run flutter_launcher_icons

      - name: Analyze
        run: flutter analyze

      - name: Test
        run: flutter test

      - name: Build web release
        run: flutter build web --release

      - name: Build Android release bundle
        run: flutter build appbundle --release

      - name: Upload web release
        uses: actions/upload-artifact@v4
        with:
          name: mystic-tarot-web
          path: build/web
          if-no-files-found: error

      - name: Upload Android bundle
        uses: actions/upload-artifact@v4
        with:
          name: mystic-tarot-android-aab
          path: build/app/outputs/bundle/release/app-release.aab
          if-no-files-found: error
