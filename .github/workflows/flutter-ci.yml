name: Flutter CI

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Integrate Memory Map into Living Journal
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('lib/src/mystic_living_journal_feature.dart')
          text = path.read_text()
          text = text.replace(
              "import 'models.dart';\n",
              "import 'models.dart';\nimport 'mystic_memory_map_feature.dart';\n",
              1,
          )
          text = text.replace(
              'enum _JournalSection { timeline, insights, search }',
              'enum _JournalSection { timeline, insights, map, search }',
              1,
          )
          search_segment = """          ButtonSegment<_JournalSection>(
            value: _JournalSection.search,
            icon: const Icon(Icons.search, size: 17),
            label: Text(_copy('Search', 'Ara')),
          ),"""
          map_and_search = """          ButtonSegment<_JournalSection>(
            value: _JournalSection.map,
            icon: const Icon(Icons.hub_outlined, size: 17),
            label: Text(_copy('Map', 'Harita')),
          ),
          ButtonSegment<_JournalSection>(
            value: _JournalSection.search,
            icon: const Icon(Icons.search, size: 17),
            label: Text(_copy('Search', 'Ara')),
          ),"""
          if '_JournalSection.map' not in text:
              text = text.replace(search_segment, map_and_search, 1)
          switch_anchor = """        _JournalSection.insights => _buildInsights(),
        _JournalSection.search => _buildSearch(),"""
          switch_value = """        _JournalSection.insights => _buildInsights(),
        _JournalSection.map => MysticMemoryMapFeature(
            records: widget.records,
            language: widget.language,
          ),
        _JournalSection.search => _buildSearch(),"""
          if 'MysticMemoryMapFeature(' not in text:
              text = text.replace(switch_anchor, switch_value, 1)
          path.write_text(text)
          PY

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Generate platform shells
        run: flutter create .

      - name: Install dependencies
        run: flutter pub get

      - name: Generate branded native icons
        run: dart run flutter_launcher_icons

      - name: Analyze
        run: flutter analyze

      - name: Test
        run: flutter test

      - name: Build web release
        run: flutter build web --release

      - name: Build Android release bundle
        run: flutter build appbundle --release

      - name: Commit integration and restore production CI
        run: |
          git checkout HEAD^ -- .github/workflows/flutter-ci.yml
          rm -f .github/workflows/integrate-memory-map.yml docs/memory-map-release-note.md
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lib/src/mystic_living_journal_feature.dart .github/workflows/flutter-ci.yml .github/workflows/integrate-memory-map.yml docs/memory-map-release-note.md
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "feat: integrate Memory Map into Living Journal"
          git push origin HEAD:main

      - name: Upload web release
        uses: actions/upload-artifact@v4
        with:
          name: mystic-tarot-web
          path: build/web
          if-no-files-found: error

      - name: Upload Android bundle
        uses: actions/upload-artifact@v4
        with:
          name: mystic-tarot-android-aab
          path: build/app/outputs/bundle/release/app-release.aab
          if-no-files-found: error
