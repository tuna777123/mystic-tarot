name: Repair Mystic Tarot v1.17

on:
  push:
    branches:
      - feature/v1.17-oracle-language-integrity
    paths:
      - tool/repair_v117.py
      - .github/workflows/repair-v117.yml

permissions:
  contents: write

jobs:
  repair-v117:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/v1.17-oracle-language-integrity
          fetch-depth: 0
      - run: python3 tool/repair_v117.py
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lib/src/app.dart test/v117_oracle_language_contract_test.dart
          git diff --cached --quiet && exit 0
          git commit -m "Repair scoped v1.17 Oracle integration"
          git push origin HEAD:feature/v1.17-oracle-language-integrity
