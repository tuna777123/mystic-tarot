name: Kotlin Audit Format Probe

on:
  pull_request:
    paths:
      - test/kotlin_plugin_warnings_test.dart
      - tool/src/kotlin_plugin_warnings.dart
      - .github/workflows/kotlin-audit-format-probe.yml

permissions:
  contents: read

jobs:
  format-probe:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out source
        uses: actions/checkout@v6
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Print canonical Dart format
        run: |
          dart format test/kotlin_plugin_warnings_test.dart tool/src/kotlin_plugin_warnings.dart
          echo '---BEGIN TEST FILE---'
          cat test/kotlin_plugin_warnings_test.dart
          echo '---END TEST FILE---'
          echo '---BEGIN TOOL FILE---'
          cat tool/src/kotlin_plugin_warnings.dart
          echo '---END TOOL FILE---'
