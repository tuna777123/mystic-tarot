name: Apply language integration

on:
  push:
    branches:
      - feature/mystic-soul-experience
    paths:
      - .github/workflows/apply-language-integration.yml

permissions:
  contents: write

jobs:
  integrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/mystic-soul-experience
          fetch-depth: 0

      - name: Expand application language model
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('lib/src/flagship.dart')
          text = path.read_text()
          old = """enum MysticLanguage {
  english('English', 'EN'),
  turkish('Türkçe', 'TR');
"""
          new = """enum MysticLanguage {
  english('English', 'EN'),
  spanish('Español', 'ES'),
  french('Français', 'FR'),
  portugueseBrazil('Português (Brasil)', 'PT-BR'),
  turkish('Türkçe', 'TR'),
  italian('Italiano', 'IT'),
  german('Deutsch', 'DE');
"""
          if old not in text:
              raise SystemExit('MysticLanguage source block was not found')
          path.write_text(text.replace(old, new, 1))
          PY

      - name: Add integration coverage
        run: |
          cat > test/mystic_language_integration_test.dart <<'DART'
          import 'package:flutter_test/flutter_test.dart';
          import 'package:mystic_tarot/src/flagship.dart';

          void main() {
            test('legacy application language model exposes all seven languages', () {
              expect(MysticLanguage.values.map((item) => item.label), containsAll(<String>[
                'English',
                'Español',
                'Français',
                'Português (Brasil)',
                'Türkçe',
                'Italiano',
                'Deutsch',
              ]));
              expect(MysticLanguage.values.length, 7);
            });

            test('untranslated legacy screens fall back to English', () {
              expect(mysticText(MysticLanguage.spanish, 'Read', 'Oku'), 'Read');
              expect(mysticText(MysticLanguage.french, 'Read', 'Oku'), 'Read');
              expect(mysticText(MysticLanguage.portugueseBrazil, 'Read', 'Oku'), 'Read');
              expect(mysticText(MysticLanguage.italian, 'Read', 'Oku'), 'Read');
              expect(mysticText(MysticLanguage.german, 'Read', 'Oku'), 'Read');
              expect(mysticText(MysticLanguage.turkish, 'Read', 'Oku'), 'Oku');
            });
          }
          DART

      - name: Remove one-shot migration workflow
        run: rm .github/workflows/apply-language-integration.yml

      - name: Commit integrated application language model
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lib/src/flagship.dart test/mystic_language_integration_test.dart .github/workflows/apply-language-integration.yml
          git commit -m "feat: connect seven languages to onboarding and profile"
          git push origin HEAD:feature/mystic-soul-experience
