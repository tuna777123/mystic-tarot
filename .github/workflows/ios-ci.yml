name: iOS Release CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ios-release-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-ios-release:
    runs-on: macos-latest
    timeout-minutes: 45
    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Verify Apple submission SDK floor
        run: bash tool/verify_apple_submission_sdk.sh

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Generate native shells
        run: flutter create . --platforms=android,ios --org com.tunabozcali

      - name: Configure permanent store identity
        run: dart run tool/configure_store_identifiers.dart

      - name: Configure daily ritual notifications
        run: dart run tool/configure_ritual_notifications.dart

      - name: Configure private app lock
        run: dart run tool/configure_app_lock.dart

      - name: Install dependencies
        run: flutter pub get --enforce-lockfile

      - name: Generate branded native icons
        run: dart run flutter_launcher_icons

      - name: Build unsigned iOS release
        run: flutter build ios --release --no-codesign

      - name: Record iOS Mobile Ads SDK evidence
        run: |
          dart run tool/collect_mobile_ads_sdk_evidence.dart \
            --platform=ios \
            --output=build/reports/mobile-ads-sdk-evidence-ios.json

      - name: Audit iOS privacy manifests
        run: |
          dart run tool/audit_ios_privacy_manifests.dart \
            --app=build/ios/iphoneos/Runner.app \
            --output=build/reports/ios-privacy-manifest-evidence.json

      - name: Verify release application
        run: |
          test -d build/ios/iphoneos/Runner.app
          grep -q 'com.tunabozcali.mystictarot' ios/Runner.xcodeproj/project.pbxproj

      - name: Upload iOS Mobile Ads SDK evidence
        uses: actions/upload-artifact@v7
        with:
          name: mystic-tarot-ios-mobile-ads-sdk-evidence
          path: build/reports/mobile-ads-sdk-evidence-ios.json
          if-no-files-found: error

      - name: Upload iOS privacy manifest evidence
        uses: actions/upload-artifact@v7
        with:
          name: mystic-tarot-ios-privacy-manifest-evidence
          path: build/reports/ios-privacy-manifest-evidence.json
          if-no-files-found: error
