name: Temporary Scaffold Preservation Check

on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/lockfile-refresh-bootstrap.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out exact PR head
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Set up validated Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.9'
          channel: stable
          cache: true
      - name: Prove scaffold mutates source manifest
        shell: bash
        run: |
          set -euo pipefail
          cp pubspec.yaml "$RUNNER_TEMP/pubspec.yaml.source"
          cp pubspec.lock "$RUNNER_TEMP/pubspec.lock.source"
          flutter create . --platforms=android,ios --org com.tunabozcali --no-pub
          echo '--- scaffold diff for dependency sources ---'
          git --no-pager diff -- pubspec.yaml pubspec.lock || true
          cp "$RUNNER_TEMP/pubspec.yaml.source" pubspec.yaml
          cp "$RUNNER_TEMP/pubspec.lock.source" pubspec.lock
      - name: Verify restored source with enforced lockfile
        run: flutter pub get --enforce-lockfile
      - name: Verify dependency sources stayed byte-identical
        shell: bash
        run: |
          set -euo pipefail
          cmp -s pubspec.yaml "$RUNNER_TEMP/pubspec.yaml.source"
          cmp -s pubspec.lock "$RUNNER_TEMP/pubspec.lock.source"
