name: Apply Category Leader Polish

on:
  push:
    branches:
      - agent/category-leader-pass

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply product polish
        shell: bash
        run: |
          set -euo pipefail
          if [[ ! -f tool/category_leader_pass.patch ]]; then
            echo "Category leader patch already applied."
            exit 0
          fi
          git apply --check tool/category_leader_pass.patch
          git apply tool/category_leader_pass.patch
          rm tool/category_leader_pass.patch
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lib/src/app.dart \
            lib/src/reading_explanation.dart \
            lib/src/mystic_living_journal_feature.dart \
            test/category_leader_ux_contract_test.dart \
            tool/category_leader_pass.patch
          git commit -m "Polish category leader experience"
          git push origin HEAD:agent/category-leader-pass
