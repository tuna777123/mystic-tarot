name: Apply store purchase foundation

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/store-purchase-foundation
          fetch-depth: 0
      - name: Wire store-ready premium checkout
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('lib/src/app.dart')
          text = path.read_text()
          anchor = "import 'store_purchase_service.dart';\n"
          import_line = "import 'store_ready_premium_screen.dart';\n"
          model_anchor = "import 'sound.dart';\n"
          if import_line not in text:
              text = text.replace(model_anchor, model_anchor + import_line, 1)
          old = "LocalizedPremiumScreen(source: source, language: language)"
          new = "StoreReadyPremiumScreen(source: source, language: language)"
          if old in text:
              text = text.replace(old, new, 1)
          elif new not in text:
              raise SystemExit('Premium route anchor not found')
          path.write_text(text)
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lib/src/app.dart
          git commit -m "feat: route premium checkout through store foundation" || exit 0
          git push origin HEAD:feature/store-purchase-foundation
