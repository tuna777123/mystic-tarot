name: Apply Core Localization Patch

on:
  push:
    branches: [localization/core-languages]

permissions:
  contents: write

concurrency:
  group: apply-core-localization
  cancel-in-progress: false

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          ref: localization/core-languages
          fetch-depth: 0

      - name: Reassemble and verify localization patch
        shell: bash
        run: |
          set -euo pipefail
          cat .localization/patch.part.* > /tmp/localization.patch.b64
          echo '2a4140d4eb42e227c099d239c05996464dab8a54a86be23dc0866e07e67f4d3b  /tmp/localization.patch.b64' | sha256sum --check
          base64 --decode /tmp/localization.patch.b64 > /tmp/localization.patch.xz
          echo '500f4c5986f112b31e2eabf31212e7892f423a2d430df060160313318cd7bbf8  /tmp/localization.patch.xz' | sha256sum --check
          xz --decompress --stdout /tmp/localization.patch.xz > /tmp/localization.patch
          echo 'dcdba904386a10edc11897be1b85891a30707e8419cbcb064218854a7f761073  /tmp/localization.patch' | sha256sum --check

      - name: Apply complete Spanish and Brazilian Portuguese release
        shell: bash
        run: |
          set -euo pipefail
          git apply --check /tmp/localization.patch
          git apply /tmp/localization.patch
          rm -rf .localization
          rm -f .github/workflows/localization-source-snapshot.yml

      - name: Commit localized release
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'feat: launch Spanish and Brazilian Portuguese'
          git push origin HEAD:localization/core-languages
