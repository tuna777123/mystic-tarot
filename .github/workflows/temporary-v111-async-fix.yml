name: Temporary Mystic Tarot 1.11 async fix

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - name: Check out release candidate
        uses: actions/checkout@v4
        with:
          ref: release/v1.11.0-rc
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Apply exact async-context fix
        run: python3 tool/fix_v111_async_context.py

      - name: Commit fixed release candidate
        run: |
          rm tool/fix_v111_async_context.py
          git config user.name "Mystic Release Bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -m "fix: guard journal export context after async load"
          git push origin HEAD:release/v1.11.0-rc

      - name: Remove temporary workflow from main
        run: |
          git fetch origin main
          git switch --force-create main origin/main
          git rm .github/workflows/temporary-v111-async-fix.yml
          git commit -m "chore: remove completed v1.11 async fix"
          git push origin HEAD:main
