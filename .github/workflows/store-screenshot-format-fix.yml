name: Store Screenshot Format Fix

on:
  push:
    branches:
      - release/localized-store-screenshot-pack
    paths:
      - .github/workflows/store-screenshot-format-fix.yml

permissions:
  contents: write

jobs:
  format-and-push:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out screenshot branch
        uses: actions/checkout@v6
        with:
          ref: release/localized-store-screenshot-pack
          fetch-depth: 0

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Apply canonical Dart formatting
        run: |
          dart format \
            lib/src/store_showcase.dart \
            test/store_screenshot_generator_test.dart \
            tool/verify_store_screenshot_pack.dart

      - name: Commit canonical formatting
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          if git diff --quiet; then
            exit 0
          fi
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add \
            lib/src/store_showcase.dart \
            test/store_screenshot_generator_test.dart \
            tool/verify_store_screenshot_pack.dart
          git commit -m "style: apply canonical screenshot pipeline formatting"
          git push origin HEAD:release/localized-store-screenshot-pack
