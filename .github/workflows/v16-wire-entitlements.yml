name: Wire v1.6 entitlements

on:
  push:
    branches:
      - release/v1.6-revenue

permissions:
  contents: write

jobs:
  patch-and-validate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: release/v1.6-revenue

      - name: Wire verified Plus entitlement into the app
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('lib/src/app.dart')
          text = path.read_text()

          def replace(old, new, expected=1):
              global text
              count = text.count(old)
              if count != expected:
                  raise SystemExit(f'Expected {expected} occurrence(s), found {count}: {old[:120]!r}')
              text = text.replace(old, new)

          replace(
              "import 'store_ready_premium_screen.dart';\n",
              "import 'store_purchase_service.dart';\nimport 'store_ready_premium_screen.dart';\n",
          )
          replace(
              "  final navigatorKey = GlobalKey<NavigatorState>();\n  bool ready = false;",
              "  final navigatorKey = GlobalKey<NavigatorState>();\n  final subscriptionStore = StorePurchaseService();\n  bool isPlus = false;\n  bool ready = false;",
          )
          replace(
              "  void initState() {\n    super.initState();\n    MysticSoundscape.instance.load();\n    _loadProgress();\n  }\n",
              "  void initState() {\n    super.initState();\n    subscriptionStore.addListener(_syncSubscription);\n    subscriptionStore.initialize();\n    MysticSoundscape.instance.load();\n    _loadProgress();\n  }\n\n  void _syncSubscription() {\n    if (!mounted || isPlus == subscriptionStore.isPlus) return;\n    setState(() => isPlus = subscriptionStore.isPlus);\n  }\n\n  @override\n  void dispose() {\n    subscriptionStore.removeListener(_syncSubscription);\n    subscriptionStore.dispose();\n    super.dispose();\n  }\n",
          )
          replace(
              "          HomeScreen(\n            userName: userName,",
              "          HomeScreen(\n            isPlus: isPlus,\n            userName: userName,",
          )
          replace(
              "            freeReadingsLeft: max(0, freeDeepReadingLimit - deepReadingsToday),",
              "            freeReadingsLeft: isPlus\n                ? -1\n                : max(0, freeDeepReadingLimit - deepReadingsToday),",
          )
          replace(
              "            onPremiumSpread: _previewPremiumReading,",
              "            onPremiumSpread:\n                isPlus ? _startReading : _previewPremiumReading,",
          )
          replace(
              "    if (_premiumReadingKinds.contains(kind)) {",
              "    if (!isPlus && _premiumReadingKinds.contains(kind)) {",
          )
          replace(
              "    if (kind != ReadingKind.daily && deepReadingsToday >= freeDeepReadingLimit) {",
              "    if (!isPlus &&\n        kind != ReadingKind.daily &&\n        deepReadingsToday >= freeDeepReadingLimit) {",
          )
          replace(
              "ReadingFlow(kind: kind, deckStyle: deckStyle, userName: userName, intention: intention, language: language, pastRecords: journal, onPremium:",
              "ReadingFlow(kind: kind, deckStyle: deckStyle, userName: userName, intention: intention, language: language, isPlus: isPlus, pastRecords: journal, onPremium:",
          )
          replace(
              "  const HomeScreen({required this.userName,",
              "  const HomeScreen({required this.isPlus, required this.userName,",
          )
          replace(
              "  final String userName;\n  final String intention;",
              "  final bool isPlus;\n  final String userName;\n  final String intention;",
          )
          replace(
              "const Icon(Icons.lock_outline, color: MysticColors.gold, size: 17)",
              "Icon(isPlus ? Icons.lock_open_rounded : Icons.lock_outline, color: MysticColors.gold, size: 17)",
          )
          replace(
              "  const ReadingFlow({required this.kind, required this.deckStyle, required this.userName, required this.intention, required this.language, required this.pastRecords, required this.onPremium, required this.onComplete, super.key});",
              "  const ReadingFlow({required this.kind, required this.deckStyle, required this.userName, required this.intention, required this.language, required this.isPlus, required this.pastRecords, required this.onPremium, required this.onComplete, super.key});",
          )
          replace(
              "  final MysticLanguage language;\n  final List<ReadingRecord> pastRecords;",
              "  final MysticLanguage language;\n  final bool isPlus;\n  final List<ReadingRecord> pastRecords;",
          )
          replace(
              "onTap: oracleQuestionUsed ? widget.onPremium : () => Navigator.push(",
              "onTap: !widget.isPlus && oracleQuestionUsed ? widget.onPremium : () => Navigator.push(",
          )
          replace(
              "onQuestionUsed: () { if (mounted) setState(() => oracleQuestionUsed = true); },",
              "onQuestionUsed: () { if (!widget.isPlus && mounted) setState(() => oracleQuestionUsed = true); },",
          )
          replace(
              "child: Text(oracleQuestionUsed ? '✦' : '◉',",
              "child: Text(widget.isPlus ? '∞' : oracleQuestionUsed ? '✦' : '◉',",
          )
          replace(
              "Text(oracleQuestionUsed ? mysticText(widget.language, 'CONTINUE PLUS', 'PLUS İLE DEVAM') : mysticText(widget.language, '1 FREE', '1 ÜCRETSİZ'),",
              "Text(widget.isPlus ? mysticText(widget.language, 'UNLIMITED', 'SINIRSIZ') : oracleQuestionUsed ? mysticText(widget.language, 'CONTINUE PLUS', 'PLUS İLE DEVAM') : mysticText(widget.language, '1 FREE', '1 ÜCRETSİZ'),",
          )
          replace(
              "Text(oracleQuestionUsed ? mysticText(widget.language, 'Your free answer is complete. Continue the dialogue with Mystic Plus.', 'Ücretsiz cevabın tamamlandı. Diyaloğa Mystic Plus ile devam et.') : mysticText(widget.language, 'Go beyond the first interpretation with one personal follow-up question.', 'Kişisel bir devam sorusuyla ilk yorumun ötesine geç.'),",
              "Text(widget.isPlus ? mysticText(widget.language, 'Ask another personal follow-up whenever you return to this reading.', 'Bu okumaya her döndüğünde yeni bir kişisel devam sorusu sor.') : oracleQuestionUsed ? mysticText(widget.language, 'Your free answer is complete. Continue the dialogue with Mystic Plus.', 'Ücretsiz cevabın tamamlandı. Diyaloğa Mystic Plus ile devam et.') : mysticText(widget.language, 'Go beyond the first interpretation with one personal follow-up question.', 'Kişisel bir devam sorusuyla ilk yorumun ötesine geç.'),",
          )
          replace(
              "    final empty = readingsLeft == 0;",
              "    final plus = readingsLeft < 0;\n    final empty = !plus && readingsLeft == 0;",
          )
          replace(
              "Text(empty ? mysticText(language, 'Free deep readings used', 'Ücretsiz derin okumalar kullanıldı') : mysticText(language, '$readingsLeft free deep readings left today', 'Bugün $readingsLeft ücretsiz derin okuman kaldı'),",
              "Text(plus ? mysticText(language, 'Unlimited deep readings active', 'Sınırsız derin okumalar etkin') : empty ? mysticText(language, 'Free deep readings used', 'Ücretsiz derin okumalar kullanıldı') : mysticText(language, '$readingsLeft free deep readings left today', 'Bugün $readingsLeft ücretsiz derin okuman kaldı'),",
          )
          replace(
              "Text(empty ? mysticText(language, 'Unlock unlimited readings with Mystic Plus.', 'Mystic Plus ile sınırsız okumaları aç.') : mysticText(language, 'Your Daily Guidance remains free every day.', 'Günlük Rehberliğin her gün ücretsiz kalır.'),",
              "Text(plus ? mysticText(language, 'Your verified Mystic Plus entitlement is active.', 'Doğrulanmış Mystic Plus hakkın etkin.') : empty ? mysticText(language, 'Unlock unlimited readings with Mystic Plus.', 'Mystic Plus ile sınırsız okumaları aç.') : mysticText(language, 'Your Daily Guidance remains free every day.', 'Günlük Rehberliğin her gün ücretsiz kalır.'),",
          )
          replace(
              "Text(empty ? mysticText(language, 'VIEW PLUS', 'PLUS’I GÖR') : '${3 - readingsLeft}/3',",
              "Text(plus ? mysticText(language, 'PLUS ACTIVE', 'PLUS ETKİN') : empty ? mysticText(language, 'VIEW PLUS', 'PLUS’I GÖR') : '${3 - readingsLeft}/3',",
          )

          path.write_text(text)
          PY

          dart format lib/src/app.dart

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Resolve dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze

      - name: Test
        run: flutter test

      - name: Build web release
        run: flutter build web --release --base-href /mystic-tarot/

      - name: Build Android app bundle
        run: flutter build appbundle --release

      - name: Commit entitlement wiring and remove temporary workflow
        shell: bash
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git rm .github/workflows/v16-wire-entitlements.yml
          git add lib/src/app.dart pubspec.lock
          git commit -m "feat: unlock verified Mystic Plus entitlements"
          git push origin HEAD:release/v1.6-revenue
