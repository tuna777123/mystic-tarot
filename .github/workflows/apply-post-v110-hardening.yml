name: Apply post-v1.10 hardening

on:
  push:
    branches:
      - quality/post-v1.10-hardening
    paths:
      - tool/apply_post_v110_hardening.py
      - .github/workflows/apply-post-v110-hardening.yml

permissions:
  contents: write

concurrency:
  group: apply-post-v110-hardening
  cancel-in-progress: true

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: quality/post-v1.10-hardening
          fetch-depth: 0
      - name: Apply verified product changes
        run: python3 tool/apply_post_v110_hardening.py
      - name: Remove temporary patch machinery
        run: |
          rm tool/apply_post_v110_hardening.py
          rm .github/workflows/apply-post-v110-hardening.yml
      - name: Commit product hardening
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lib/src/app.dart lib/src/widgets.dart test/post_v110_hardening_test.dart tool/apply_post_v110_hardening.py .github/workflows/apply-post-v110-hardening.yml
          git diff --cached --check
          git commit -m "fix: harden preview lifecycle and accessible actions"
          git push origin HEAD:quality/post-v1.10-hardening
