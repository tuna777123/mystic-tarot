name: HP V26 Render Proof

on:
  push:
    branches:
      - hidden-perspective-v26
  workflow_dispatch:

permissions:
  contents: read

jobs:
  render:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: hidden-perspective-v26/package.json

      - name: Download V26 proof media
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p hidden-perspective-v26/public/assets hidden-perspective-v26/public/audio
          python3 - <<'PY'
          import json, os, urllib.request, urllib.parse

          base = 'https://api.firestorage.ai/dev/file'
          share = '0x2coGZcogaj'
          api = f'{base}/shares/{share}'

          targets = {
              'Abandoned Classroom with Open Book.png': 'assets',
              'Forgotten Lessons in an Abandoned Classroom.png': 'assets',
              'The Street They Left Behind.png': 'assets',
              'Houtouwan Reclaimed by Nature.png': 'assets',
              'Buses line Pripyat for evacuation.png': 'assets',
              "Smoke Beneath Centralia's Cracked Road.png": 'assets',
              'Villa Epecuén Beneath the Floodwaters.png': 'assets',
              'Ordinary Life in Pripyat, 1985.png': 'assets',
              'Pripyat’s Silent Ferris Wheel.png': 'assets',
              'Maunsell Sea Forts in Grey Mist.png': 'assets',
              'Buzludzha in winter fog.png': 'assets',
              "Pripyat's Empty Avenue and Rusted Ferris Wheel.png": 'assets',
              'Centralia mine fire, four documentary views.png': 'assets',
              'Plymouth Buried in Volcanic Ash.png': 'assets',
              'Beneath the Maunsell Sea Forts.png': 'assets',
              'abandoned-1.mp3': 'audio',
              'Abandoned 1.wav': 'audio',
          }

          def request_json(url, method='GET'):
              req = urllib.request.Request(url, method=method, headers={'User-Agent':'HP-V26-Render/1.0','Accept':'application/json'})
              with urllib.request.urlopen(req, timeout=60) as r:
                  return json.load(r)

          listing = request_json(f'{api}/files?maxResults=1000')
          files = listing.get('files', [])
          print(f'Firestorage entries: {len(files)}')
          by_name = {}
          for item in files:
              name = item.get('fileName') or item.get('name') or item.get('title')
              if name:
                  by_name.setdefault(name, []).append(item)
                  print(' -', name, item.get('fileId'))

          missing = [name for name in targets if name not in by_name]
          if missing:
              raise SystemExit('Missing proof assets: ' + repr(missing))

          for name, kind in targets.items():
              item = by_name[name][-1]
              fid = item.get('fileId')
              if not fid:
                  raise SystemExit(f'No fileId for {name}')
              ticket = request_json(f'{api}/files/{urllib.parse.quote(str(fid), safe="")}/download', method='POST')
              url = ticket.get('downloadUrl')
              if not url:
                  raise SystemExit(f'No downloadUrl for {name}: {ticket}')
              dest = os.path.join('hidden-perspective-v26', 'public', kind, name)
              req = urllib.request.Request(url, headers={'User-Agent':'HP-V26-Render/1.0'})
              with urllib.request.urlopen(req, timeout=180) as r, open(dest, 'wb') as f:
                  while True:
                      chunk = r.read(1024 * 1024)
                      if not chunk:
                          break
                      f.write(chunk)
              size = os.path.getsize(dest)
              if size < 1024:
                  raise SystemExit(f'Suspiciously small download for {name}: {size}')
              print(f'DOWNLOADED {name}: {size} bytes')
          PY

      - name: Verify media files
        shell: bash
        run: |
          set -euo pipefail
          find hidden-perspective-v26/public -type f -maxdepth 2 -printf '%P | %s bytes\n' | sort
          file hidden-perspective-v26/public/audio/*

      - name: Install Remotion project
        working-directory: hidden-perspective-v26
        run: npm install --no-audit --no-fund

      - name: TypeScript gate
        working-directory: hidden-perspective-v26
        run: npx tsc --noEmit

      - name: Render first 37.47 seconds
        working-directory: hidden-perspective-v26
        run: |
          mkdir -p out/qc_frames
          npx remotion render src/index.ts HiddenPerspectiveV26Proof out/HP_V26_PROOF_FIRST37S.mp4 \
            --codec=h264 \
            --crf=16 \
            --audio-bitrate=192k \
            --frames=0-1123 \
            --concurrency=2

      - name: Technical QC
        working-directory: hidden-perspective-v26
        shell: bash
        run: |
          set -euo pipefail
          ffprobe -v error -show_entries format=duration,size,bit_rate -show_entries stream=index,codec_name,codec_type,width,height,r_frame_rate,sample_rate,channels -of json out/HP_V26_PROOF_FIRST37S.mp4 | tee out/HP_V26_PROOF_FIRST37S_FFPROBE.json
          ffmpeg -v error -i out/HP_V26_PROOF_FIRST37S.mp4 -f null -
          ffmpeg -hide_banner -v warning -i out/HP_V26_PROOF_FIRST37S.mp4 -vf "blackdetect=d=0.35:pix_th=0.02" -an -f null - 2> out/blackdetect.txt || true
          ffmpeg -hide_banner -v warning -i out/HP_V26_PROOF_FIRST37S.mp4 -af "silencedetect=n=-45dB:d=0.8" -vn -f null - 2> out/silencedetect.txt || true
          for t in 0.5 3.4 6.8 9.9 12.2 15.1 17.9 20.6 24.6 27.2 29.0 30.9 32.6 33.4 34.4 35.7 37.2; do
            ffmpeg -hide_banner -loglevel error -ss "$t" -i out/HP_V26_PROOF_FIRST37S.mp4 -frames:v 1 -q:v 2 "out/qc_frames/frame_${t}.jpg"
          done
          ffmpeg -hide_banner -loglevel error -i out/HP_V26_PROOF_FIRST37S.mp4 -vf "fps=1/4,scale=480:-2,tile=5x2:padding=4:margin=4" -frames:v 1 -q:v 2 out/HP_V26_PROOF_CONTACT.jpg
          echo '=== blackdetect ==='
          cat out/blackdetect.txt
          echo '=== silencedetect ==='
          cat out/silencedetect.txt

      - name: Upload proof artifact
        uses: actions/upload-artifact@v4
        with:
          name: hp-v26-proof-first37s
          path: |
            hidden-perspective-v26/out/HP_V26_PROOF_FIRST37S.mp4
            hidden-perspective-v26/out/HP_V26_PROOF_FIRST37S_FFPROBE.json
            hidden-perspective-v26/out/blackdetect.txt
            hidden-perspective-v26/out/silencedetect.txt
            hidden-perspective-v26/out/HP_V26_PROOF_CONTACT.jpg
            hidden-perspective-v26/out/qc_frames/*.jpg
          if-no-files-found: error
          retention-days: 3
