name: French Quality Snapshot

on:
  push:
    branches: [release/french-and-quality]

permissions:
  contents: read

jobs:
  snapshot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/upload-artifact@v4
        with:
          name: french-quality-source
          path: |
            lib
            test
            web
            tool
            pubspec.yaml
            RELEASE_NOTES.md
          if-no-files-found: error
          retention-days: 1
