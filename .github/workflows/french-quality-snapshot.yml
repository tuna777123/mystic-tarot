name: Apply French Quality Release

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]

permissions:
  contents: write

concurrency:
  group: apply-french-quality-pr
  cancel-in-progress: false

jobs:
  apply:
    if: github.event.pull_request.head.ref == 'release/french-and-quality'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: release/french-and-quality
          fetch-depth: 0
      - name: Rebuild and verify patch
        shell: bash
        run: |
          test "$(tr -d '\n' < .quality/french-v3.patch.01.b64 | sha256sum | cut -d' ' -f1)" = '88e97b5f883a73b12bd69a6d89cab30a9828e0b4fdc792658b3ebca0936b79dc'
          test "$(tr -d '\n' < .quality/french-v3.patch.02.b64 | sha256sum | cut -d' ' -f1)" = '29832efb54f6b529a402555c38ebf28959ca6cdaf31b371427e1f322c006597d'
          test "$(tr -d '\n' < .quality/french-v3.patch.03.b64 | sha256sum | cut -d' ' -f1)" = 'c64ff41e4095652d7f46773f1b04ed21c2611ffa9b2f4cdb2510f2aa73f349b9'
          test "$(tr -d '\n' < .quality/french-v3.patch.04.b64 | sha256sum | cut -d' ' -f1)" = 'fb0db11c019839388a17478046c2d58b3dc0434e26b0ed4b06dedfedb28da1e3'
          cat .quality/french-v3.patch.*.b64 | tr -d '\n' | base64 --decode > /tmp/french.patch.gz
          echo '05a3b0e9e12105fff058effa3b738511efd2171703d7a6d055aebd86ea2d6918  /tmp/french.patch.gz' | sha256sum --check -
          gzip --decompress --stdout /tmp/french.patch.gz > /tmp/french.patch
          echo 'ecea0a5b595f2a4670b56b3b7068069c27f9f7549af64f323aa81c6629e36a5e  /tmp/french.patch' | sha256sum --check -
          git apply --check /tmp/french.patch
          git apply /tmp/french.patch
      - name: Remove legacy paywall and localize support routing
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          app = Path('lib/src/app.dart')
          text = app.read_text()
          old_languages = """const launchLanguages = <MysticLanguage>[
            MysticLanguage.english,
            MysticLanguage.turkish,
            MysticLanguage.spanish,
            MysticLanguage.portugueseBrazil,
          ];
          """
          new_languages = """const launchLanguages = <MysticLanguage>[
            MysticLanguage.english,
            MysticLanguage.turkish,
            MysticLanguage.spanish,
            MysticLanguage.french,
            MysticLanguage.portugueseBrazil,
          ];

          String supportPageForLanguage(MysticLanguage language) => switch (language) {
                MysticLanguage.french =>
                  'https://tuna777123.github.io/mystic-tarot/support-fr.html',
                MysticLanguage.turkish =>
                  'https://tuna777123.github.io/mystic-tarot/support-tr.html',
                _ => 'https://tuna777123.github.io/mystic-tarot/support.html',
              };
          """
          assert old_languages in text
          text = text.replace(old_languages, new_languages, 1)
          text = text.replace(
              'Mystic is fully available in English, Turkish, Spanish, and Brazilian Portuguese.',
              'Mystic is fully available in English, Turkish, Spanish, French, and Brazilian Portuguese.',
              1,
          )
          text = text.replace(
              'Mystic bu sürümde İngilizce, Türkçe, İspanyolca ve Brezilya Portekizcesi olarak eksiksiz kullanılabilir.',
              'Mystic bu sürümde İngilizce, Türkçe, İspanyolca, Fransızca ve Brezilya Portekizcesi olarak eksiksiz kullanılabilir.',
              1,
          )
          old_support = """          await Clipboard.setData(
                    const ClipboardData(
                      text: 'https://tuna777123.github.io/mystic-tarot/support.html',
                    ),
                  );"""
          new_support = """          await Clipboard.setData(
                    ClipboardData(text: supportPageForLanguage(widget.language)),
                  );"""
          assert old_support in text
          text = text.replace(old_support, new_support, 1)
          legacy = text.find('class PremiumScreen extends StatefulWidget')
          assert legacy > 0
          text = text[:legacy].rstrip() + '\n'
          app.write_text(text)

          tests = Path('test/widget_test.dart')
          value = tests.read_text()
          start = value.find("  testWidgets('privacy policy describes local-first storage'")
          end = value.find("  testWidgets('living fate map is visible", start)
          assert start > 0 and end > start
          tests.write_text(value[:start] + value[end:])
          PY
      - name: Remove temporary transport files
        shell: bash
        run: |
          rm -rf .quality
          rm -f .github/workflows/french-quality-snapshot.yml
          rm -f .github/workflows/apply-french-quality.yml
      - name: Commit product changes
        shell: bash
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git diff --cached --check
          git commit -m 'feat: complete French localization and quality pass'
          git push origin HEAD:release/french-and-quality
