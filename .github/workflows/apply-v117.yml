name: Apply Mystic Tarot v1.17

on:
  push:
    branches:
      - feature/v1.17-oracle-language-integrity
    paths:
      - tool/apply_v117.py
      - .github/workflows/apply-v117.yml

permissions:
  contents: write

jobs:
  apply-v117:
    runs-on: ubuntu-latest
    steps:
      - name: Check out feature branch
        uses: actions/checkout@v4
        with:
          ref: feature/v1.17-oracle-language-integrity
          fetch-depth: 0
      - name: Apply verified product integration
        run: python3 tool/apply_v117.py
      - name: Commit integrated product files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lib/src/app.dart pubspec.yaml RELEASE_NOTES.md
          git diff --cached --quiet && exit 0
          git commit -m "Integrate v1.17 Oracle language integrity"
          git push origin HEAD:feature/v1.17-oracle-language-integrity
