name: VH05 Final 4K Render

on:
  push:
    paths:
      - '.github/workflows/vh05-final.yml'

permissions:
  contents: write

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Install FFmpeg
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg
          ffmpeg -version
          ffmpeg -encoders | grep -q libx265

      - name: Download approved sources
        env:
          AUDIO_URL: "https://uc254ddf970ca0099805a7888dc6.dl.dropboxusercontent.com/cd/0/get/DISNJGcRX4ucZxrFyVIwHrMxvluXvxkGHuKn1epTea-KbuO-Lq6NQTVMxycJPL8Gfe8RqTg6koiaTzKvWjrJhL6PbFwc281pS4C3iA8tocOIr8LdzMrzb5nOCNRJAFej6EthF1w-Y0EseVGfRH4Zl5wlMuBPjaLleK68or1M1Zo59A/file?c_luid=fc3b25dc"
          VIDEO_URL: "https://res.cloudinary.com/saojrfpq/video/upload/v1789492056/velvet_harmony/vh05_flow_master_loop_4k_h264.mp4"
        run: |
          set -euo pipefail
          curl -fL --retry 5 --retry-delay 2 "$AUDIO_URL" -o audio_master.m4a
          curl -fL --retry 5 --retry-delay 2 "$VIDEO_URL" -o loop_source.mp4
          test $(stat -c%s audio_master.m4a) -eq 473601177
          test $(stat -c%s loop_source.mp4) -gt 40000000
          ffprobe -v error -show_entries stream=codec_name,sample_rate,channels -show_entries format=duration,size -of json audio_master.m4a | tee source_audio.json
          ffprobe -v error -show_entries stream=codec_name,width,height,r_frame_rate -show_entries format=duration,size -of json loop_source.mp4 | tee source_video.json

      - name: Encode one pristine 30-second delivery loop
        run: |
          set -euo pipefail
          ffmpeg -y -i loop_source.mp4 -an \
            -c:v libx265 -preset medium -b:v 1100k -maxrate 1350k -bufsize 2700k \
            -pix_fmt yuv420p -tag:v hvc1 -x265-params keyint=240:min-keyint=24:scenecut=40 \
            loop_4k_delivery.mp4
          WIDTH=$(ffprobe -v error -select_streams v:0 -show_entries stream=width -of csv=p=0 loop_4k_delivery.mp4)
          HEIGHT=$(ffprobe -v error -select_streams v:0 -show_entries stream=height -of csv=p=0 loop_4k_delivery.mp4)
          FPS=$(ffprobe -v error -select_streams v:0 -show_entries stream=r_frame_rate -of csv=p=0 loop_4k_delivery.mp4)
          DUR=$(ffprobe -v error -show_entries format=duration -of csv=p=0 loop_4k_delivery.mp4)
          test "$WIDTH" = "3840"
          test "$HEIGHT" = "2160"
          test "$FPS" = "24/1"
          awk -v d="$DUR" 'BEGIN{exit !(d >= 29.95 && d <= 30.05)}'

      - name: Build exact 3-hour final master
        run: |
          set -euo pipefail
          ffmpeg -y -stream_loop 359 -i loop_4k_delivery.mp4 -i audio_master.m4a \
            -map 0:v:0 -map 1:a:0 \
            -c:v copy -c:a aac -b:a 224k -ar 48000 -ac 2 \
            -t 10800 -shortest -map_metadata -1 \
            -movflags +faststart \
            VH05_FINAL_PUBLISH_MASTER_4K_3H.mp4

      - name: Professional QC
        run: |
          set -euo pipefail
          ffprobe -v error \
            -show_entries format=duration,size,bit_rate \
            -show_entries stream=index,codec_type,codec_name,width,height,r_frame_rate,avg_frame_rate,sample_rate,channels,start_time,duration \
            -of json VH05_FINAL_PUBLISH_MASTER_4K_3H.mp4 | tee VH05_FINAL_QC.json

          WIDTH=$(ffprobe -v error -select_streams v:0 -show_entries stream=width -of csv=p=0 VH05_FINAL_PUBLISH_MASTER_4K_3H.mp4)
          HEIGHT=$(ffprobe -v error -select_streams v:0 -show_entries stream=height -of csv=p=0 VH05_FINAL_PUBLISH_MASTER_4K_3H.mp4)
          FPS=$(ffprobe -v error -select_streams v:0 -show_entries stream=r_frame_rate -of csv=p=0 VH05_FINAL_PUBLISH_MASTER_4K_3H.mp4)
          VCODEC=$(ffprobe -v error -select_streams v:0 -show_entries stream=codec_name -of csv=p=0 VH05_FINAL_PUBLISH_MASTER_4K_3H.mp4)
          ACODEC=$(ffprobe -v error -select_streams a:0 -show_entries stream=codec_name -of csv=p=0 VH05_FINAL_PUBLISH_MASTER_4K_3H.mp4)
          SR=$(ffprobe -v error -select_streams a:0 -show_entries stream=sample_rate -of csv=p=0 VH05_FINAL_PUBLISH_MASTER_4K_3H.mp4)
          CH=$(ffprobe -v error -select_streams a:0 -show_entries stream=channels -of csv=p=0 VH05_FINAL_PUBLISH_MASTER_4K_3H.mp4)
          DUR=$(ffprobe -v error -show_entries format=duration -of csv=p=0 VH05_FINAL_PUBLISH_MASTER_4K_3H.mp4)
          SIZE=$(stat -c%s VH05_FINAL_PUBLISH_MASTER_4K_3H.mp4)

          test "$WIDTH" = "3840"
          test "$HEIGHT" = "2160"
          test "$FPS" = "24/1"
          test "$VCODEC" = "hevc"
          test "$ACODEC" = "aac"
          test "$SR" = "48000"
          test "$CH" = "2"
          awk -v d="$DUR" 'BEGIN{exit !(d >= 10799.5 && d <= 10800.5)}'
          test "$SIZE" -gt 1200000000
          test "$SIZE" -lt 2000000000

          # Decode samples at start, loop seams, 1h, 2h and final minute.
          for T in 0 29 59 89 3595 7195 10770; do
            ffmpeg -v error -ss "$T" -i VH05_FINAL_PUBLISH_MASTER_4K_3H.mp4 -t 8 -map 0:v:0 -map 0:a:0 -f null -
          done

          # Audio must be active from frame zero.
          ffmpeg -hide_banner -ss 0 -i VH05_FINAL_PUBLISH_MASTER_4K_3H.mp4 -t 30 -map 0:a:0 -af volumedetect -f null - 2> audio_qc.txt || true
          grep -E 'mean_volume|max_volume' audio_qc.txt | tee VH05_FINAL_QC.txt
          if grep -q 'mean_volume: -inf' VH05_FINAL_QC.txt; then exit 1; fi
          echo "PASS WIDTH=$WIDTH HEIGHT=$HEIGHT FPS=$FPS VCODEC=$VCODEC AUDIO=$ACODEC SR=$SR CH=$CH DURATION=$DUR SIZE=$SIZE" | tee -a VH05_FINAL_QC.txt
          sha256sum VH05_FINAL_PUBLISH_MASTER_4K_3H.mp4 | tee VH05_FINAL_SHA256.txt

      - name: Publish direct MP4 release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG="vh05-final-${GITHUB_RUN_ID}"
          gh release create "$TAG" \
            VH05_FINAL_PUBLISH_MASTER_4K_3H.mp4 \
            VH05_FINAL_QC.json \
            VH05_FINAL_QC.txt \
            VH05_FINAL_SHA256.txt \
            --repo "$GITHUB_REPOSITORY" \
            --title "Velvet Harmony Video 05 — Final 4K 3H" \
            --notes "QC-verified final master: 3840x2160, 24 fps, exactly 3 hours, HEVC video, AAC 48 kHz stereo, approved music/rain/fireplace master from 0:00."
