name: Fix French Analyze

on:
  push:
    branches: [release/french-and-quality]
    paths: [.github/workflows/fix-french-analyze.yml]

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: release/french-and-quality
      - name: Remove unused import
        shell: bash
        run: |
          sed -i "/package:flutter\/foundation.dart/d" lib/src/app.dart
          rm .github/workflows/fix-french-analyze.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git diff --cached --check
          git commit -m 'fix: remove unused Flutter foundation import'
          git push origin HEAD:release/french-and-quality
