name: Fix French Analyze

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]

permissions:
  contents: write

concurrency:
  group: fix-french-analyze-pr
  cancel-in-progress: true

jobs:
  fix:
    if: github.event.pull_request.head.ref == 'release/french-and-quality'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: release/french-and-quality
      - name: Remove unused import
        shell: bash
        run: |
          sed -i "/package:flutter\/foundation.dart/d" lib/src/app.dart
          rm .github/workflows/fix-french-analyze.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git diff --cached --check
          git commit -m 'fix: remove unused Flutter foundation import'
          git push origin HEAD:release/french-and-quality
