name: Fix store analyzer

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/store-purchase-foundation
          fetch-depth: 0
      - name: Remove stale premium import
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('lib/src/app.dart')
          text = path.read_text()
          text = text.replace("import 'localized_premium_screen.dart';\n", "")
          path.write_text(text)
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lib/src/app.dart
          git commit -m "fix: remove stale premium screen import" || exit 0
          git push origin HEAD:feature/store-purchase-foundation
