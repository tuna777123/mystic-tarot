name: Velvet Harmony Remotion CI

on:
  pull_request:
    paths:
      - 'video-projects/velvet-harmony-v3/**'
      - '.github/workflows/velvet-harmony-remotion-ci.yml'
  workflow_dispatch:

jobs:
  validate-remotion:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: video-projects/velvet-harmony-v3

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: TypeScript validation
        run: npx tsc --noEmit

      - name: Verify Remotion compositions
        run: npx remotion compositions src/index.ts

      - name: Install FFmpeg
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg

      - name: Probe private Drive asset access without changing permissions
        shell: bash
        run: |
          set +e
          URL='https://drive.google.com/uc?export=download&id=1B4dtZcai6GY7CCl7yyDeIo1e3iLKa_1c'
          curl -L --silent --show-error --max-time 45 "$URL" -o /tmp/drive-warm.bin
          CURL_STATUS=$?
          echo "curl_status=$CURL_STATUS"
          ls -l /tmp/drive-warm.bin || true
          file /tmp/drive-warm.bin || true
          ffprobe -v error -show_entries format=format_name,duration,size -of default=nw=1 /tmp/drive-warm.bin || true
          python3 - <<'PY'
          from pathlib import Path
          p=Path('/tmp/drive-warm.bin')
          if p.exists():
              data=p.read_bytes()[:160]
              print('first_bytes_hex=', data[:32].hex())
              print('looks_html=', b'<html' in data.lower() or b'<!doctype' in data.lower())
          PY
          exit 0

      - name: Generate private synthetic smoke assets
        run: |
          mkdir -p public/assets out
          ffmpeg -y -loglevel error -f lavfi -i 'testsrc2=size=1280x720:rate=24' -t 10 -c:v libx264 -preset veryfast -crf 20 -pix_fmt yuv420p public/assets/warm.mp4
          ffmpeg -y -loglevel error -f lavfi -i 'testsrc2=size=1280x720:rate=24' -vf 'hue=h=90' -t 10 -c:v libx264 -preset veryfast -crf 20 -pix_fmt yuv420p public/assets/blue-hour.mp4
          ffmpeg -y -loglevel error -f lavfi -i 'testsrc2=size=1280x720:rate=24' -vf 'hue=h=180' -t 10 -c:v libx264 -preset veryfast -crf 20 -pix_fmt yuv420p public/assets/night.mp4

      - name: Smoke render seamless loop
        run: |
          npx remotion render src/index.ts WarmLoop out/smoke-warm-loop.mp4 \
            --codec=h264 \
            --crf=28 \
            --pixel-format=yuv420p \
            --color-space=bt709 \
            --gop=192 \
            --concurrency=50% \
            --log=verbose

      - name: Smoke render scene transition
        run: |
          npx remotion render src/index.ts TransitionWarmBlue out/smoke-transition.mp4 \
            --codec=h264 \
            --crf=28 \
            --pixel-format=yuv420p \
            --color-space=bt709 \
            --gop=192 \
            --concurrency=50% \
            --log=verbose

      - name: Validate smoke outputs
        run: |
          ffprobe -v error -show_entries stream=width,height,r_frame_rate -of default=nw=1 out/smoke-warm-loop.mp4
          ffprobe -v error -show_entries stream=width,height,r_frame_rate -of default=nw=1 out/smoke-transition.mp4
          test "$(ffprobe -v error -select_streams v:0 -show_entries stream=width -of csv=p=0 out/smoke-warm-loop.mp4)" = "2560"
          test "$(ffprobe -v error -select_streams v:0 -show_entries stream=height -of csv=p=0 out/smoke-warm-loop.mp4)" = "1440"
          test "$(ffprobe -v error -select_streams v:0 -show_entries stream=r_frame_rate -of csv=p=0 out/smoke-warm-loop.mp4)" = "24/1"

      - name: Upload smoke renders
        uses: actions/upload-artifact@v4
        with:
          name: velvet-remotion-smoke-renders
          path: |
            video-projects/velvet-harmony-v3/out/smoke-warm-loop.mp4
            video-projects/velvet-harmony-v3/out/smoke-transition.mp4
          if-no-files-found: error
          retention-days: 3
