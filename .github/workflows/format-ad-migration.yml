name: Format Ad Migration

on:
  push:
    branches: [release/ad-supported-monetization]

permissions:
  contents: write

concurrency:
  group: format-ad-migration
  cancel-in-progress: true

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: release/ad-supported-monetization
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Format migration Dart files
        run: |
          dart format \
            lib/src/ad_revenue_service.dart \
            lib/src/reading_journal_store.dart \
            lib/src/store_purchase_service.dart \
            lib/src/store_ready_premium_screen.dart \
            test/ad_supported_monetization_contract_test.dart \
            test/android_bundle_audit_test.dart \
            test/store_purchase_service_test.dart \
            tool/configure_store_identifiers.dart \
            tool/src/android_bundle_audit.dart
      - name: Commit formatter result
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet; then
            exit 0
          fi
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add lib test tool
          git commit -m "Format advertising-only migration"
          git push origin HEAD:release/ad-supported-monetization
