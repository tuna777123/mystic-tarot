name: Format Ad Migration

on:
  push:
    branches: [release/ad-supported-monetization]

permissions:
  contents: write

concurrency:
  group: format-ad-migration
  cancel-in-progress: true

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: release/ad-supported-monetization
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Format advertising migration Dart source
        run: dart format lib test tool
      - name: Commit formatter result
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet; then
            exit 0
          fi
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add lib test tool
          git commit -m "Format advertising-only migration"
          git push origin HEAD:release/ad-supported-monetization
