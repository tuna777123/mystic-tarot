name: Repair and finalize v1.6 revenue release

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  repair-and-validate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: release/v1.6-revenue

      - name: Apply the verified entitlement wiring
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          workflow = Path('.github/workflows/v16-pr-wire.yml').read_text()
          start = workflow.index("          python3 - <<'PY'\n")
          end = workflow.index('\n      - uses: subosito/flutter-action@v2', start)
          block = workflow[start:end]
          script = '\n'.join(
              line[10:] if line.startswith('          ') else line
              for line in block.splitlines()
          )
          Path('/tmp/wire-entitlements.sh').write_text(script + '\n')
          PY
          bash /tmp/wire-entitlements.sh

      - name: Update widget tests for the Plus state
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('test/widget_test.dart')
          text = path.read_text()
          old = "          language: MysticLanguage.turkish,\n          pastRecords: const [],"
          new = "          language: MysticLanguage.turkish,\n          isPlus: false,\n          pastRecords: const [],"
          count = text.count(old)
          if count != 2:
              raise SystemExit(f'Expected two ReadingFlow test constructors, found {count}')
          path.write_text(text.replace(old, new))
          PY

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Resolve, migrate lints, and format
        run: |
          flutter pub get
          dart fix --apply
          dart format lib test

      - name: Analyze
        run: flutter analyze

      - name: Test
        run: flutter test

      - name: Build web release
        run: flutter build web --release --base-href /mystic-tarot/

      - name: Build Android app bundle
        run: flutter build appbundle --release

      - name: Commit the validated revenue release
        shell: bash
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git rm -f .github/workflows/v16-wire-entitlements.yml
          git rm -f .github/workflows/v16-pr-wire.yml
          git rm -f .github/workflows/v16-repair.yml
          git rm -f docs/v16-build-trigger.txt
          git rm -f docs/v16-pr-ready.txt
          git add lib test pubspec.lock
          git commit -m "feat: finalize verified Mystic Plus access"
          git push origin HEAD:release/v1.6-revenue
