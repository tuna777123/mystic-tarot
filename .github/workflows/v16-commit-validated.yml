name: Commit validated v1.6 revenue release

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  commit-validated-release:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: release/v1.6-revenue

      - name: Apply the already validated Plus wiring
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          workflow = Path('.github/workflows/v16-pr-wire.yml').read_text()
          start = workflow.index("          python3 - <<'PY'\n")
          end = workflow.index('\n      - uses: subosito/flutter-action@v2', start)
          block = workflow[start:end]
          script = '\n'.join(
              line[10:] if line.startswith('          ') else line
              for line in block.splitlines()
          )
          Path('/tmp/wire-entitlements.sh').write_text(script + '\n')
          PY
          bash /tmp/wire-entitlements.sh

      - name: Update Plus-aware widget tests
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('test/widget_test.dart')
          text = path.read_text()
          old = "          language: MysticLanguage.turkish,\n          pastRecords: const [],"
          new = "          language: MysticLanguage.turkish,\n          isPlus: false,\n          pastRecords: const [],"
          count = text.count(old)
          if count != 2:
              raise SystemExit(f'Expected two ReadingFlow test constructors, found {count}')
          path.write_text(text.replace(old, new))
          PY

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Format validated sources
        run: dart format lib/src/app.dart test/widget_test.dart

      - name: Commit sources and remove temporary automation
        shell: bash
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git rm -f .github/workflows/v16-wire-entitlements.yml
          git rm -f .github/workflows/v16-pr-wire.yml
          git rm -f .github/workflows/v16-repair.yml
          git rm -f .github/workflows/v16-finalize-platform.yml
          git rm -f .github/workflows/v16-commit-validated.yml
          git rm -f docs/v16-build-trigger.txt
          git rm -f docs/v16-pr-ready.txt
          git add lib/src/app.dart test/widget_test.dart
          git commit -m "feat: finalize verified Mystic Plus access"
          git push origin HEAD:release/v1.6-revenue
