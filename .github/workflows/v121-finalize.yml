name: Finalize Mystic Tarot v1.21

on:
  push:
    branches:
      - feature/v1.21-launch-differentiation
    paths:
      - .github/workflows/v121-finalize.yml

permissions:
  actions: read
  contents: write

concurrency:
  group: mystic-tarot-v121-finalize
  cancel-in-progress: false

jobs:
  finalize:
    runs-on: ubuntu-latest
    timeout-minutes: 80
    steps:
      - name: Check out feature branch
        uses: actions/checkout@v4
        with:
          ref: feature/v1.21-launch-differentiation
          fetch-depth: 0

      - name: Preserve reviewed synthesis sources
        run: |
          cp lib/src/reading_synthesis.dart /tmp/reading_synthesis.dart
          cp test/reading_synthesis_test.dart /tmp/reading_synthesis_test.dart

      - name: Download the fully verified v1.21 source artifact
        uses: actions/download-artifact@v4
        with:
          name: mystic-tarot-v121-verified-source
          path: /tmp/v121-source
          repository: tuna777123/mystic-tarot
          run-id: 30928245861
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Materialize reviewed clean source
        run: |
          cp -a /tmp/v121-source/. .
          cp /tmp/reading_synthesis.dart lib/src/reading_synthesis.dart
          cp /tmp/reading_synthesis_test.dart test/reading_synthesis_test.dart
          python tool/v121_finalize_patch.py
          git fetch origin main
          git show origin/main:.github/workflows/flutter-ci.yml > .github/workflows/flutter-ci.yml
          rm -f tool/v121_integrate.py
          rm -f tool/v121_finalize_patch.py
          rm -f .github/workflows/v121-finalize.yml

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Format release sources
        run: >-
          dart format
          lib/src/app.dart
          lib/src/launch_differentiation.dart
          lib/src/mystic_next_step.dart
          lib/src/reading_position.dart
          lib/src/reading_synthesis.dart
          lib/src/store_ready_premium_screen.dart
          test/launch_differentiation_test.dart
          test/reading_synthesis_test.dart
          test/v118_private_journal_transfer_contract_test.dart
          test/v120_private_app_lock_contract_test.dart
          test/v121_launch_differentiation_contract_test.dart

      - name: Generate platform shells
        run: flutter create . --platforms=android,ios --org com.tunabozcali

      - name: Configure native release contracts
        run: |
          dart run tool/configure_store_identifiers.dart
          dart run tool/configure_ritual_notifications.dart
          dart run tool/configure_app_lock.dart

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze clean source
        run: flutter analyze

      - name: Test clean source
        run: flutter test

      - name: Build clean web release
        run: flutter build web --release

      - name: Build clean Android App Bundle
        run: flutter build appbundle --release

      - name: Verify release cleanliness
        run: |
          test "$(grep '^version:' pubspec.yaml)" = 'version: 1.21.0+27'
          test ! -e tool/v121_integrate.py
          test ! -e tool/v121_finalize_patch.py
          test ! -e .github/workflows/v121-finalize.yml
          test ! -e .github/workflows/v121-integrate.yml
          grep -q 'The next honest step for the connection' lib/src/reading_position.dart
          grep -q 'The choice that can change the trajectory' lib/src/reading_position.dart
          grep -q 'ReadingKind.celticCross' lib/src/reading_synthesis.dart
          grep -q 'biometrics on supported devices' lib/src/launch_differentiation.dart
          git diff --check

      - name: Stage only approved release files
        run: |
          git add \
            README.md \
            RELEASE_NOTES.md \
            RELEASE_NOTES_1.21.md \
            STORE_RELEASE.md \
            pubspec.yaml \
            lib/src/app.dart \
            lib/src/launch_differentiation.dart \
            lib/src/mystic_next_step.dart \
            lib/src/reading_position.dart \
            lib/src/reading_synthesis.dart \
            lib/src/store_ready_premium_screen.dart \
            test/launch_differentiation_test.dart \
            test/reading_synthesis_test.dart \
            test/v118_private_journal_transfer_contract_test.dart \
            test/v120_private_app_lock_contract_test.dart \
            test/v121_launch_differentiation_contract_test.dart \
            .github/workflows/flutter-ci.yml
          git add -u \
            tool/v121_integrate.py \
            tool/v121_finalize_patch.py \
            .github/workflows/v121-finalize.yml

          cat > /tmp/allowed-files <<'EOF'
          .github/workflows/flutter-ci.yml
          .github/workflows/v121-finalize.yml
          README.md
          RELEASE_NOTES.md
          RELEASE_NOTES_1.21.md
          STORE_RELEASE.md
          lib/src/app.dart
          lib/src/launch_differentiation.dart
          lib/src/mystic_next_step.dart
          lib/src/reading_position.dart
          lib/src/reading_synthesis.dart
          lib/src/store_ready_premium_screen.dart
          pubspec.yaml
          test/launch_differentiation_test.dart
          test/reading_synthesis_test.dart
          test/v118_private_journal_transfer_contract_test.dart
          test/v120_private_app_lock_contract_test.dart
          test/v121_launch_differentiation_contract_test.dart
          tool/v121_finalize_patch.py
          tool/v121_integrate.py
          EOF
          sort -o /tmp/allowed-files /tmp/allowed-files
          git diff --cached --name-only | sort > /tmp/staged-files
          test -z "$(comm -23 /tmp/staged-files /tmp/allowed-files)"
          grep -qx 'pubspec.yaml' /tmp/staged-files
          grep -qx 'lib/src/app.dart' /tmp/staged-files
          grep -qx 'lib/src/reading_synthesis.dart' /tmp/staged-files
          grep -qx 'lib/src/reading_position.dart' /tmp/staged-files
          grep -qx 'test/reading_synthesis_test.dart' /tmp/staged-files
          grep -qx 'tool/v121_integrate.py' /tmp/staged-files
          grep -qx '.github/workflows/v121-finalize.yml' /tmp/staged-files

      - name: Commit the clean verified release
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "release: Mystic Tarot 1.21 launch differentiation"
          git push origin HEAD:feature/v1.21-launch-differentiation
