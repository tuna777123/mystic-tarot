name: Integrate app core hardening

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  integrate:
    if: ${{ !contains(github.event.pull_request.head.sha, 'core-integrated') }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          ref: hardening/journal-integrity
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Apply verified source transformations
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          path = Path('lib/src/app.dart')
          text = path.read_text(encoding='utf-8')

          def replace_once(old: str, new: str, label: str) -> None:
              global text
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{label}: expected exactly one match, found {count}')
              text = text.replace(old, new, 1)

          replace_once("import 'dart:convert';\n", "", 'remove obsolete JSON import')
          replace_once(
              "import 'models.dart';\n",
              "import 'models.dart';\nimport 'reading_journal_store.dart';\n",
              'add durable journal import',
          )
          replace_once(
              "  final subscriptionStore = StorePurchaseService();\n",
              "  final subscriptionStore = StorePurchaseService();\n  final readingJournalStore = ReadingJournalStore();\n",
              'add journal store',
          )
          replace_once(
              "      MysticLanguage.french =>\n        'https://tuna777123.github.io/mystic-tarot/support-fr.html',\n      MysticLanguage.turkish =>\n        'https://tuna777123.github.io/mystic-tarot/support-tr.html',\n      _ => 'https://tuna777123.github.io/mystic-tarot/support.html',\n",
              "      MysticLanguage.french =>\n        'https://tuna777123.github.io/mystic-tarot/support-fr.html',\n      MysticLanguage.turkish =>\n        'https://tuna777123.github.io/mystic-tarot/support-tr.html',\n      MysticLanguage.spanish =>\n        'https://tuna777123.github.io/mystic-tarot/support-es.html',\n      MysticLanguage.portugueseBrazil =>\n        'https://tuna777123.github.io/mystic-tarot/support-pt-br.html',\n      _ => 'https://tuna777123.github.io/mystic-tarot/support.html',\n",
              'complete support localization',
          )
          replace_once(
              "      final prefs = await SharedPreferences.getInstance();\n      final today = _dayKey(DateTime.now());\n",
              "      final prefs = await SharedPreferences.getInstance();\n      final journalLoad = await readingJournalStore.load(\n        legacyRecords:\n            prefs.getStringList(ReadingJournalStore.legacyKey) ?? const <String>[],\n      );\n      final today = _dayKey(DateTime.now());\n",
              'load durable journal',
          )
          replace_once(
              "        claimedRewards.addAll(\n          (prefs.getStringList('claimed_rewards') ?? const []).map(int.parse),\n        );\n",
              "        claimedRewards.addAll(\n          (prefs.getStringList('claimed_rewards') ?? const [])\n              .map(int.tryParse)\n              .whereType<int>(),\n        );\n",
              'harden reward parsing',
          )
          replace_once(
              "        completedArcanaDays.addAll(\n          (prefs.getStringList('completed_arcana_days') ?? const []).map(\n            int.parse,\n          ),\n        );\n",
              "        completedArcanaDays.addAll(\n          (prefs.getStringList('completed_arcana_days') ?? const [])\n              .map(int.tryParse)\n              .whereType<int>(),\n        );\n",
              'harden arcana day parsing',
          )
          replace_once(
              "          if (separator > 0)\n            arcanaReflections[int.parse(encoded.substring(0, separator))] =\n                encoded.substring(separator + 1);\n",
              "          if (separator > 0) {\n            final index = int.tryParse(encoded.substring(0, separator));\n            if (index != null) {\n              arcanaReflections[index] = encoded.substring(separator + 1);\n            }\n          }\n",
              'harden reflection parsing',
          )
          replace_once(
              """        for (final encoded
            in prefs.getStringList('journal_records') ?? const []) {
          final record = _decodeRecord(encoded);
          if (record != null) journal.add(record);
        }
""",
              "        journal.addAll(journalLoad.records);\n",
              'replace legacy journal loop',
          )
          replace_once(
              "        ready = true;\n      });\n    } catch (_) {\n",
              "        ready = true;\n      });\n      if (journalLoad.migratedFromLegacy) {\n        await readingJournalStore.save(journalLoad.records);\n        await readingJournalStore.finishLegacyMigration();\n      }\n    } catch (_) {\n",
              'finish journal migration',
          )
          replace_once(
              """        prefs.setStringList(
          'journal_records',
          journal.take(50).map(_encodeRecord).toList(),
        ),
""",
              "",
              'remove silent fifty-record cap',
          )
          replace_once(
              """      ]);
    } catch (_) {
      // The experience remains usable if local storage is temporarily unavailable.
""",
              """      ]);
      await readingJournalStore.save(journal);
    } catch (_) {
      // The experience remains usable if local storage is temporarily unavailable.
""",
              'persist complete journal',
          )

          codec_pattern = re.compile(
              r"\n  String _encodeRecord\(ReadingRecord record\) => jsonEncode\(\{.*?\n  void _showPremium",
              re.S,
          )
          text, count = codec_pattern.subn("\n  void _showPremium", text, count=1)
          if count != 1:
              raise SystemExit(f'remove obsolete journal codec: expected one match, found {count}')

          replace_once(
              "class _RitualRevealCardState extends State<_RitualRevealCard> {\n  bool faceUp = false;\n",
              "class _RitualRevealCardState extends State<_RitualRevealCard> {\n  bool faceUp = false;\n  Timer? _revealTimer;\n",
              'track reveal timer',
          )
          replace_once(
              "    Future<void>.delayed(widget.delay, () {\n      if (mounted) setState(() => faceUp = true);\n    });\n  }\n\n  @override\n  Widget build(BuildContext context) => TweenAnimationBuilder<double>(\n",
              "    _revealTimer = Timer(widget.delay, () {\n      if (mounted) setState(() => faceUp = true);\n    });\n  }\n\n  @override\n  void dispose() {\n    _revealTimer?.cancel();\n    super.dispose();\n  }\n\n  @override\n  Widget build(BuildContext context) => TweenAnimationBuilder<double>(\n",
              'cancel reveal timer',
          )

          path.write_text(text, encoding='utf-8')
          PY

      - name: Remove temporary integration files
        run: |
          rm .github/workflows/app-core-integration.yml
          rm -f tool/.app_core_integration_trigger

      - name: Commit integrated source
        run: |
          git config user.name "Mystic Release Bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -m "refactor: integrate durable journal and app hardening [core-integrated]"
          git push origin HEAD:hardening/journal-integrity
