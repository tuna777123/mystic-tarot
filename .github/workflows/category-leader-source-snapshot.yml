name: Category Leader Source Snapshot

on:
  push:
    branches:
      - agent/category-leader-pass

permissions:
  contents: read

jobs:
  snapshot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/upload-artifact@v4
        with:
          name: mystic-category-leader-source
          path: |
            lib
            test
            pubspec.yaml
            analysis_options.yaml
            AGENTS.md
          if-no-files-found: error
          retention-days: 1
