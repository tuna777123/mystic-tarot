name: Ad-only source copy cleanup

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]

permissions:
  contents: write

jobs:
  cleanup:
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.head_ref == 'release/ad-supported-monetization'
    runs-on: ubuntu-latest
    steps:
      - name: Check out PR head
        uses: actions/checkout@v6
        with:
          ref: release/ad-supported-monetization
          fetch-depth: 0

      - name: Remove legacy paid-tier user copy
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          app = Path('lib/src/app.dart')
          source = app.read_text()
          replacements = {
              "'PLUS'": "'OPEN'",
              "'PLUS ACTIVE'": "'ALL OPEN'",
              "'PLUS ETKİN'": "'HEPSİ AÇIK'",
              "'VIEW PLUS'": "'ALL OPEN'",
              "'PLUS’I GÖR'": "'HEPSİ AÇIK'",
              "'${kind.cardCount}-card premium spread'": "'${kind.cardCount}-card deep spread'",
              "'${kind.cardCount} kartlık premium açılım'": "'${kind.cardCount} kartlık derin açılım'",
              "'Free deep readings used'": "'Deep readings stay open'",
              "'Ücretsiz derin okumalar kullanıldı'": "'Derin okumalar açık kalır'",
          }
          required = [
              "'PLUS'",
              "'PLUS ACTIVE'",
              "'VIEW PLUS'",
              "'${kind.cardCount}-card premium spread'",
          ]
          for token in required:
              if token not in source:
                  raise SystemExit(f'missing expected app copy anchor: {token}')
          for old, new in replacements.items():
              source = source.replace(old, new)
          app.write_text(source)

          intelligence = Path('lib/src/mystic_plus_intelligence_screen.dart')
          source = intelligence.read_text()
          old = """        const Spacer(),
        const Text(
          'MYSTIC INTELLIGENCE',
          style: TextStyle(
            color: MysticColors.gold,
            fontSize: 10,
            fontWeight: FontWeight.w900,
            letterSpacing: 1.8,
          ),
        ),
        const Spacer(),
"""
          new = """        Expanded(
          child: FittedBox(
            fit: BoxFit.scaleDown,
            child: const Text(
              'MYSTIC INTELLIGENCE',
              style: TextStyle(
                color: MysticColors.gold,
                fontSize: 10,
                fontWeight: FontWeight.w900,
                letterSpacing: 1.8,
              ),
            ),
          ),
        ),
        const SizedBox(width: 8),
"""
          if old not in source:
              raise SystemExit('missing Intelligence header anchor')
          intelligence.write_text(source.replace(old, new, 1))

          # Fail closed if any of the known paid-tier user strings survive.
          final_app = app.read_text()
          forbidden = [
              "'PLUS'",
              "'PLUS ACTIVE'",
              "'PLUS ETKİN'",
              "'VIEW PLUS'",
              "'PLUS’I GÖR'",
              'premium spread',
              'premium açılım',
              'Mystic Plus',
              'manage subscription',
          ]
          for token in forbidden:
              if token.lower() in final_app.lower():
                  raise SystemExit(f'forbidden paid-tier user copy remains: {token}')
          PY

      - name: Commit source cleanup and remove this workflow
        shell: bash
        run: |
          rm -f .github/workflows/ad-only-source-copy-cleanup.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add lib/src/app.dart lib/src/mystic_plus_intelligence_screen.dart .github/workflows/ad-only-source-copy-cleanup.yml
          git commit -m 'Remove remaining paid-tier user copy'
          git push origin HEAD:release/ad-supported-monetization
