name: Apply Category Leader Materializer Fix

on:
  push:
    branches:
      - agent/category-leader-pass

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply materializer fix
        shell: bash
        run: |
          set -euo pipefail
          if [[ ! -f tool/category_leader_materializer.patch ]]; then
            echo "Materializer patch already applied."
            exit 0
          fi
          git apply --check tool/category_leader_materializer.patch
          git apply tool/category_leader_materializer.patch
          rm tool/category_leader_materializer.patch
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tool/materialize_ad_only_ui.dart tool/category_leader_materializer.patch
          git commit -m "Keep materialized growth UI formatted"
          git push origin HEAD:agent/category-leader-pass
