name: Apply premium value bridge

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/premium-value-bridge
          fetch-depth: 0
      - name: Wire premium value screen
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('lib/src/app.dart')
          text = path.read_text()
          import_line = "import 'premium_value_screen.dart';\n"
          anchor = "import 'models.dart';\n"
          if import_line not in text:
              text = text.replace(anchor, anchor + import_line, 1)
          old = "  void _showPremium({String source = 'organic'}) => navigatorKey.currentState!.push(MaterialPageRoute(builder: (_) => PremiumScreen(source: source)));"
          new = "  void _showPremium({String source = 'organic'}) => navigatorKey.currentState!.push(MaterialPageRoute(builder: (_) => PremiumValueScreen(source: source, language: language, onContinue: () => navigatorKey.currentState!.push(MaterialPageRoute(builder: (_) => PremiumScreen(source: source))))));"
          if old in text:
              text = text.replace(old, new, 1)
          elif new not in text:
              raise SystemExit('Premium routing anchor not found')
          path.write_text(text)
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lib/src/app.dart
          git commit -m "feat: add source-aware premium value bridge" || exit 0
          git push origin HEAD:feature/premium-value-bridge
