name: Integrate Mystic Tarot v1.21

on:
  push:
    branches:
      - feature/v1.21-launch-differentiation
    paths:
      - tool/v121_integrate.py
      - .github/workflows/v121-integrate.yml

permissions:
  contents: write

concurrency:
  group: mystic-tarot-v121-integration
  cancel-in-progress: false

jobs:
  integrate-and-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 70
    steps:
      - name: Check out feature branch
        uses: actions/checkout@v4
        with:
          ref: feature/v1.21-launch-differentiation
          fetch-depth: 0

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Apply focused v1.21 product changes
        run: python tool/v121_integrate.py

      - name: Install dependencies
        run: flutter pub get

      - name: Format only v1.21 files
        run: >-
          dart format
          lib/src/app.dart
          lib/src/launch_differentiation.dart
          lib/src/mystic_next_step.dart
          lib/src/reading_synthesis.dart
          lib/src/store_ready_premium_screen.dart
          test/launch_differentiation_test.dart
          test/reading_synthesis_test.dart
          test/v118_private_journal_transfer_contract_test.dart
          test/v120_private_app_lock_contract_test.dart
          test/v121_launch_differentiation_contract_test.dart

      - name: Generate platform shells
        run: flutter create . --platforms=android,ios --org com.tunabozcali

      - name: Set permanent store identifiers
        run: dart run tool/configure_store_identifiers.dart

      - name: Configure daily ritual notifications
        run: dart run tool/configure_ritual_notifications.dart

      - name: Configure private app lock
        run: dart run tool/configure_app_lock.dart

      - name: Analyze
        run: flutter analyze

      - name: Complete automated tests
        run: flutter test

      - name: Build release web app
        run: flutter build web --release

      - name: Build Android App Bundle
        run: flutter build appbundle --release

      - name: Verify clean patch
        run: git diff --check

      - name: Commit verified v1.21 release candidate
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "release: Mystic Tarot 1.21 launch differentiation"
          git push origin HEAD:feature/v1.21-launch-differentiation
