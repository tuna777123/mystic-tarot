name: Apply lockfile enforcement

on:
  push:
    branches:
      - release/lock-production-dependencies
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out branch
        uses: actions/checkout@v6
        with:
          ref: release/lock-production-dependencies
          fetch-depth: 0
      - name: Require committed application lockfile
        run: |
          set -euo pipefail
          test -s pubspec.lock
          git ls-files --error-unmatch pubspec.lock
      - name: Enforce lockfile in every Flutter release workflow
        shell: python
        run: |
          from pathlib import Path

          paths = [
              Path('.github/workflows/flutter-ci.yml'),
              Path('.github/workflows/ios-ci.yml'),
              Path('.github/workflows/pages.yml'),
              Path('.github/workflows/store-release.yml'),
              Path('.github/workflows/store-screenshots.yml'),
          ]
          total = 0
          for path in paths:
              text = path.read_text()
              count = text.count('run: flutter pub get\n')
              if count == 0:
                  raise SystemExit(f'Expected unlocked flutter pub get in {path}')
              text = text.replace(
                  'run: flutter pub get\n',
                  'run: flutter pub get --enforce-lockfile\n',
              )
              path.write_text(text)
              total += count
          if total < 7:
              raise SystemExit(f'Unexpectedly low replacement count: {total}')
      - name: Verify no unlocked workflow install remains
        shell: bash
        run: |
          set -euo pipefail
          if grep -R -n -E '^\s*run: flutter pub get\s*$' .github/workflows; then
            echo 'Unlocked Flutter dependency install remains.' >&2
            exit 1
          fi
          grep -R -n -- '--enforce-lockfile' .github/workflows/flutter-ci.yml .github/workflows/ios-ci.yml .github/workflows/pages.yml .github/workflows/store-release.yml .github/workflows/store-screenshots.yml
      - name: Commit workflow enforcement
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/workflows/flutter-ci.yml .github/workflows/ios-ci.yml .github/workflows/pages.yml .github/workflows/store-release.yml .github/workflows/store-screenshots.yml
          if git diff --cached --quiet; then
            echo "Workflow lockfile enforcement already applied."
            exit 0
          fi
          git commit -m "Enforce locked Flutter dependencies in release workflows"
          git push origin HEAD:release/lock-production-dependencies
