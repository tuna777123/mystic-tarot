name: Apply lockfile enforcement

on:
  push:
    branches:
      - release/lock-production-dependencies
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out branch
        uses: actions/checkout@v6
        with:
          ref: release/lock-production-dependencies
          fetch-depth: 0
      - name: Require committed application lockfile
        run: |
          set -euo pipefail
          test -s pubspec.lock
          git ls-files --error-unmatch pubspec.lock
      - name: Enforce lockfile in every Flutter workflow
        shell: python
        run: |
          from pathlib import Path

          workflow_dir = Path('.github/workflows')
          total = 0
          changed = []
          for path in sorted(workflow_dir.glob('*.yml')):
              if path.name == 'apply-lockfile-enforcement.yml':
                  continue
              text = path.read_text()
              count = text.count('run: flutter pub get\n')
              if count == 0:
                  continue
              path.write_text(
                  text.replace(
                      'run: flutter pub get\n',
                      'run: flutter pub get --enforce-lockfile\n',
                  )
              )
              total += count
              changed.append(str(path))
          if total == 0:
              raise SystemExit('No unlocked Flutter dependency installs found to migrate.')
          print(f'Enforced {total} dependency install(s) across {len(changed)} workflow(s).')
          for path in changed:
              print(path)
      - name: Verify no unlocked workflow install remains
        shell: bash
        run: |
          set -euo pipefail
          if grep -R -n -E '^\s*run: flutter pub get\s*$' .github/workflows; then
            echo 'Unlocked Flutter dependency install remains.' >&2
            exit 1
          fi
          count="$(grep -R -h -- '--enforce-lockfile' .github/workflows/*.yml | wc -l | tr -d ' ')"
          test "$count" -ge 10
          echo "Locked Flutter dependency installs found: $count"
      - name: Commit workflow enforcement
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/workflows/*.yml
          if git diff --cached --quiet; then
            echo "Workflow lockfile enforcement already applied."
            exit 0
          fi
          git commit -m "Enforce locked Flutter dependencies in all workflows"
          git push origin HEAD:release/lock-production-dependencies
