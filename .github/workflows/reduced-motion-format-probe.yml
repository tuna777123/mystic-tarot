name: Reduced Motion Format Probe

on:
  pull_request:
    paths:
      - test/reduced_motion_test.dart
      - .github/workflows/reduced-motion-format-probe.yml

permissions:
  contents: read

jobs:
  format-probe:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out source
        uses: actions/checkout@v6
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Print canonical Dart format
        run: |
          dart format test/reduced_motion_test.dart
          echo '---BEGIN FORMATTED FILE---'
          cat test/reduced_motion_test.dart
          echo '---END FORMATTED FILE---'
