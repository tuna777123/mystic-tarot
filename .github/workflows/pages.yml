name: Deploy GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Configure GitHub Pages
        id: pages
        uses: actions/configure-pages@v6

      - name: Build web release
        run: flutter build web --release --base-href "/${{ github.event.repository.name }}/"

      - name: Disable Jekyll processing
        run: touch build/web/.nojekyll

      - name: Verify application and marketing entry points
        shell: bash
        run: |
          set -euo pipefail
          required=(
            index.html
            landing.html
            landing-en.html
            landing-es.html
            landing-fr.html
            landing-pt-br.html
            marketing-i18n.css
            marketing-i18n.js
            sitemap.xml
            robots.txt
            404.html
          )
          for file in "${required[@]}"; do
            test -s "build/web/$file"
          done

          grep -q 'Kartların ötesini' build/web/landing.html
          grep -q 'See beyond' build/web/landing-en.html
          grep -q 'Mira más allá' build/web/landing-es.html
          grep -q 'Voyez au-delà' build/web/landing-fr.html
          grep -q 'Veja além' build/web/landing-pt-br.html
          grep -q 'Mystic Mirror' build/web/landing-en.html
          grep -q 'hreflang="pt-BR"' build/web/sitemap.xml
          grep -q 'hreflang="x-default"' build/web/sitemap.xml
          grep -q 'mystic-tarot/sitemap.xml' build/web/robots.txt

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: build/web

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    permissions:
      contents: read
      pages: write
      id-token: write
    outputs:
      page_url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5

  report:
    if: always()
    runs-on: ubuntu-latest
    needs: [build, deploy]
    permissions:
      contents: read
      statuses: write
    steps:
      - name: Publish deployment status
        env:
          GH_TOKEN: ${{ github.token }}
          DEPLOY_RESULT: ${{ needs.deploy.result }}
          PAGE_URL: ${{ needs.deploy.outputs.page_url }}
        shell: bash
        run: |
          if [[ "$DEPLOY_RESULT" == "success" ]]; then
            state="success"
            description="Mystic Tarot Pages deployment is live"
          else
            state="failure"
            description="Mystic Tarot Pages deployment failed"
          fi

          args=(
            --method POST
            "repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}"
            -f "state=${state}"
            -f "context=pages/deployment"
            -f "description=${description}"
          )

          if [[ -n "$PAGE_URL" ]]; then
            args+=(-f "target_url=${PAGE_URL}landing.html")
          fi

          gh api "${args[@]}"
