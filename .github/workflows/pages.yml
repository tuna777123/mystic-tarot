name: Deploy GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get --enforce-lockfile

      - name: Configure GitHub Pages
        id: pages
        uses: actions/configure-pages@v6

      - name: Build web release
        run: flutter build web --release --base-href "/${{ github.event.repository.name }}/"

      - name: Disable Jekyll processing
        run: touch build/web/.nojekyll

      - name: Verify application, marketing, sharing, and store-policy entry points
        shell: bash
        run: |
          set -euo pipefail
          required=(
            index.html
            landing.html
            landing-en.html
            landing-es.html
            landing-fr.html
            landing-pt-br.html
            press-kit.html
            privacy.html
            privacy-tr.html
            privacy-es.html
            privacy-fr.html
            privacy-pt-br.html
            terms.html
            terms-tr.html
            terms-es.html
            terms-fr.html
            terms-pt-br.html
            support.html
            support-tr.html
            support-es.html
            support-fr.html
            support-pt-br.html
            legal.css
            marketing-i18n.css
            marketing-i18n.js
            sitemap.xml
            robots.txt
            404.html
          )
          for file in "${required[@]}"; do
            test -s "build/web/$file"
          done

          grep -q 'Kartların ötesini' build/web/landing.html
          grep -q 'See beyond' build/web/landing-en.html
          grep -q 'Mira más allá' build/web/landing-es.html
          grep -q 'Voyez au-delà' build/web/landing-fr.html
          grep -q 'Veja além' build/web/landing-pt-br.html
          grep -q 'Mystic Mirror' build/web/landing-en.html
          grep -q 'Official press & sharing kit' build/web/press-kit.html
          grep -q 'Public web edition available now' build/web/press-kit.html
          grep -q '<h1>Privacy Policy</h1>' build/web/privacy.html
          grep -q '<h1>Gizlilik Politikası</h1>' build/web/privacy-tr.html
          grep -q '<h1>Política de privacidad</h1>' build/web/privacy-es.html
          grep -q '<h1>Politique de confidentialité</h1>' build/web/privacy-fr.html
          grep -q '<h1>Política de Privacidade</h1>' build/web/privacy-pt-br.html
          grep -q '<h1>Terms of Use</h1>' build/web/terms.html
          grep -q '<h1>Kullanım Koşulları</h1>' build/web/terms-tr.html
          grep -q '<h1>Condiciones de uso</h1>' build/web/terms-es.html
          grep -q '<h1>Conditions d’utilisation</h1>' build/web/terms-fr.html
          grep -q '<h1>Termos de Uso</h1>' build/web/terms-pt-br.html
          grep -q '<h1>Support</h1>' build/web/support.html
          grep -q '<h1>Destek</h1>' build/web/support-tr.html
          grep -q '<h1>Soporte</h1>' build/web/support-es.html
          grep -q '<h1>Assistance</h1>' build/web/support-fr.html
          grep -q '<h1>Suporte</h1>' build/web/support-pt-br.html
          grep -q 'press-kit.html' build/web/sitemap.xml
          grep -q 'hreflang="pt-BR"' build/web/sitemap.xml
          grep -q 'hreflang="x-default"' build/web/sitemap.xml
          grep -q 'mystic-tarot/sitemap.xml' build/web/robots.txt

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: build/web

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    permissions:
      contents: read
      pages: write
      id-token: write
    outputs:
      page_url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5

  report:
    if: always()
    runs-on: ubuntu-latest
    needs: [build, deploy]
    permissions:
      contents: read
      statuses: write
    steps:
      - name: Verify live application, sharing, and localized store URLs
        id: live
        if: needs.deploy.result == 'success'
        continue-on-error: true
        env:
          PAGE_URL: ${{ needs.deploy.outputs.page_url }}
        shell: bash
        run: |
          set -euo pipefail
          base_url="${PAGE_URL%/}/"
          paths=(
            ""
            "landing.html"
            "press-kit.html"
            "privacy.html"
            "privacy-tr.html"
            "privacy-es.html"
            "privacy-fr.html"
            "privacy-pt-br.html"
            "terms.html"
            "terms-tr.html"
            "terms-es.html"
            "terms-fr.html"
            "terms-pt-br.html"
            "support.html"
            "support-tr.html"
            "support-es.html"
            "support-fr.html"
            "support-pt-br.html"
          )
          markers=(
            "flutter_bootstrap.js"
            "Kartların ötesini"
            "Official press & sharing kit"
            "<h1>Privacy Policy</h1>"
            "<h1>Gizlilik Politikası</h1>"
            "<h1>Política de privacidad</h1>"
            "<h1>Politique de confidentialité</h1>"
            "<h1>Política de Privacidade</h1>"
            "<h1>Terms of Use</h1>"
            "<h1>Kullanım Koşulları</h1>"
            "<h1>Condiciones de uso</h1>"
            "<h1>Conditions d’utilisation</h1>"
            "<h1>Termos de Uso</h1>"
            "<h1>Support</h1>"
            "<h1>Destek</h1>"
            "<h1>Soporte</h1>"
            "<h1>Assistance</h1>"
            "<h1>Suporte</h1>"
          )

          if [[ "${#paths[@]}" -ne "${#markers[@]}" ]]; then
            echo "Public URL paths and markers must remain aligned." >&2
            exit 1
          fi

          for index in "${!paths[@]}"; do
            url="${base_url}${paths[$index]}"
            body="$(mktemp)"
            trap 'rm -f "$body"' RETURN
            curl \
              --fail \
              --location \
              --silent \
              --show-error \
              --retry 6 \
              --retry-all-errors \
              --retry-delay 5 \
              --connect-timeout 15 \
              --max-time 45 \
              "$url" \
              --output "$body"
            grep -Fq "${markers[$index]}" "$body"
            rm -f "$body"
            trap - RETURN
          done

      - name: Publish deployment status
        env:
          GH_TOKEN: ${{ github.token }}
          DEPLOY_RESULT: ${{ needs.deploy.result }}
          LIVE_RESULT: ${{ steps.live.outcome }}
          PAGE_URL: ${{ needs.deploy.outputs.page_url }}
        shell: bash
        run: |
          if [[ "$DEPLOY_RESULT" == "success" && "$LIVE_RESULT" == "success" ]]; then
            state="success"
            description="Mystic Tarot Pages, press kit, and localized store URLs are live"
          else
            state="failure"
            description="Mystic Tarot Pages, press kit, or localized URL verification failed"
          fi

          args=(
            --method POST
            "repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}"
            -f "state=${state}"
            -f "context=${context}"
            -f "description=${description}"
          )

          if [[ -n "$PAGE_URL" ]]; then
            args+=(-f "target_url=${PAGE_URL}landing.html")
          fi

          gh api "${args[@]}"

          if [[ "$state" != "success" ]]; then
            exit 1
          fi
