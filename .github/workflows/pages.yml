name: Deploy GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Configure GitHub Pages
        id: pages
        uses: actions/configure-pages@v6

      - name: Build web release
        run: flutter build web --release --base-href "/${{ github.event.repository.name }}/"

      - name: Disable Jekyll processing
        run: touch build/web/.nojekyll

      - name: Verify application and marketing entry points
        shell: bash
        run: |
          set -euo pipefail
          required=(
            index.html
            landing.html
            landing-en.html
            landing-es.html
            landing-fr.html
            landing-pt-br.html
            marketing-i18n.css
            marketing-i18n.js
            sitemap.xml
            robots.txt
            404.html
          )
          for file in "${required[@]}"; do
            test -s "build/web/$file"
          done

          grep -q 'Kartların ötesini' build/web/landing.html
          grep -q 'See beyond' build/web/landing-en.html
          grep -q 'Mira más allá' build/web/landing-es.html
          grep -q 'Voyez au-delà' build/web/landing-fr.html
          grep -q 'Veja além' build/web/landing-pt-br.html
          grep -q 'Mystic Mirror' build/web/landing-en.html
          grep -q 'hreflang="pt-BR"' build/web/sitemap.xml
          grep -q 'hreflang="x-default"' build/web/sitemap.xml
          grep -q 'mystic-tarot/sitemap.xml' build/web/robots.txt

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: build/web

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    permissions:
      contents: read
      pages: write
      id-token: write
    outputs:
      page_url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5

  health:
    runs-on: ubuntu-latest
    needs: deploy
    permissions:
      contents: read
    env:
      PAGE_URL: ${{ needs.deploy.outputs.page_url }}
    steps:
      - name: Verify public store and legal URLs
        shell: bash
        run: |
          set -euo pipefail
          base="${PAGE_URL%/}/"
          paths=(
            ""
            privacy.html
            terms.html
            support.html
            privacy-tr.html
            terms-tr.html
            support-tr.html
            privacy-es.html
            terms-es.html
            support-es.html
            privacy-fr.html
            terms-fr.html
            support-fr.html
            privacy-pt-br.html
            terms-pt-br.html
            support-pt-br.html
          )
          summary="$RUNNER_TEMP/public-url-health.md"
          printf '# Mystic Tarot public URL health\n\n' > "$summary"

          for path in "${paths[@]}"; do
            label="${path:-root}"
            safe="${label//[^a-zA-Z0-9]/_}"
            body="$RUNNER_TEMP/public-url-${safe}.html"
            url="${base}${path}"
            code="000"
            healthy=false

            for attempt in {1..10}; do
              code=$(curl \
                --location \
                --silent \
                --show-error \
                --max-time 30 \
                --output "$body" \
                --write-out '%{http_code}' \
                "$url" || true)

              if [[ "$code" == "200" ]] &&
                 [[ -s "$body" ]] &&
                 grep -qi '<html' "$body" &&
                 grep -qi 'Mystic Tarot' "$body"; then
                healthy=true
                break
              fi

              sleep 6
            done

            if [[ "$healthy" != "true" ]]; then
              printf -- '- ❌ `%s` returned `%s` or invalid content\n' "$url" "$code" >> "$summary"
              cat "$summary" >> "$GITHUB_STEP_SUMMARY"
              exit 1
            fi

            printf -- '- ✅ `%s` — HTTP 200\n' "$url" >> "$summary"
          done

          cat "$summary" >> "$GITHUB_STEP_SUMMARY"

  report:
    if: always()
    runs-on: ubuntu-latest
    needs: [build, deploy, health]
    permissions:
      contents: read
      statuses: write
    steps:
      - name: Publish deployment status
        env:
          GH_TOKEN: ${{ github.token }}
          DEPLOY_RESULT: ${{ needs.deploy.result }}
          HEALTH_RESULT: ${{ needs.health.result }}
          PAGE_URL: ${{ needs.deploy.outputs.page_url }}
        shell: bash
        run: |
          if [[ "$DEPLOY_RESULT" == "success" && "$HEALTH_RESULT" == "success" ]]; then
            state="success"
            description="Mystic Tarot Pages and public URLs are live"
          else
            state="failure"
            description="Mystic Tarot Pages or public URL health failed"
          fi

          args=(
            --method POST
            "repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}"
            -f "state=${state}"
            -f "context=pages/deployment"
            -f "description=${description}"
          )

          if [[ -n "$PAGE_URL" ]]; then
            args+=(-f "target_url=${PAGE_URL}landing.html")
          fi

          gh api "${args[@]}"
