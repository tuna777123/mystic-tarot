name: Fix Category Leader Quote

on:
  push:
    branches:
      - agent/category-leader-pass

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Fix lint quote and remove helper workflow
        shell: python
        run: |
          from pathlib import Path
          path = Path('lib/src/mystic_living_journal_feature.dart')
          source = path.read_text()
          old = '              fr: "LE SIGNAL D’HIER",'
          new = "              fr: 'LE SIGNAL D’HIER',"
          if old not in source:
              raise SystemExit('Expected quote anchor not found')
          path.write_text(source.replace(old, new, 1))
      - name: Commit fix
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lib/src/mystic_living_journal_feature.dart
          git commit -m "Fix category leader lint"
          git push origin HEAD:agent/category-leader-pass
