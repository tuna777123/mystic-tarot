name: Format Measurement Baseline

on:
  push:
    branches:
      - product/measurement-ready-growth-lab

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          ref: product/measurement-ready-growth-lab
          fetch-depth: 0
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Format baseline source
        shell: bash
        run: |
          set -euo pipefail
          dart format \
            lib/src/business_metrics_bootstrap.dart \
            lib/src/growth_measurement_baseline.dart \
            lib/src/mirror_growth_tracker.dart \
            test/growth_measurement_baseline_test.dart \
            test/measurement_ready_growth_contract_test.dart \
            test/mirror_growth_tracker_test.dart
      - name: Commit exact formatter output
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet; then
            echo 'Already formatted.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- '*.dart'
          git commit -m 'Format growth measurement baseline'
          git push origin HEAD:product/measurement-ready-growth-lab
