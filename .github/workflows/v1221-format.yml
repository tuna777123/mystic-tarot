name: v1.22.1 Format

on:
  push:
    branches:
      - release/v1.22.1-retention-quality

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          ref: release/v1.22.1-retention-quality
          fetch-depth: 0

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Format changed Dart files
        run: dart format lib/src/growth_engine.dart test/growth_engine_test.dart

      - name: Commit formatter output
        run: |
          if git diff --quiet; then
            echo "No formatting changes required."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lib/src/growth_engine.dart test/growth_engine_test.dart
          git commit -m "style: apply Dart formatter to v1.22.1"
          git push origin HEAD:release/v1.22.1-retention-quality
