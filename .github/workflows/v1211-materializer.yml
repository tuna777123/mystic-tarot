name: Materialize Mystic Tarot v1.21.1

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]

permissions:
  contents: write

concurrency:
  group: mystic-tarot-v1211-source-finalizer
  cancel-in-progress: true

jobs:
  materialize:
    if: github.head_ref == 'release/v1.21.1-prelaunch-hardening'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out hardening branch
        uses: actions/checkout@v4
        with:
          ref: release/v1.21.1-prelaunch-hardening
          fetch-depth: 0

      - name: Determine whether patch is pending
        id: gate
        shell: bash
        run: |
          if test -e tool/v1211_harden.py && test -e tool/v1211_trigger.txt; then
            echo 'run=true' >> "$GITHUB_OUTPUT"
          else
            echo 'run=false' >> "$GITHUB_OUTPUT"
          fi

      - name: Apply reviewed hardening patch
        if: steps.gate.outputs.run == 'true'
        run: python tool/v1211_harden.py

      - name: Finalize permanent release workflows
        if: steps.gate.outputs.run == 'true'
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          flutter_ci = Path('.github/workflows/flutter-ci.yml')
          source = flutter_ci.read_text(encoding='utf-8')
          old = """      - name: Verify formatting
                  run: dart format --output=none --set-exit-if-changed lib test tool

                - name: Verify clean diff
                  run: git diff --check

                - name: Analyze
                  run: flutter analyze --fatal-infos
          """
          new = """      - name: Verify changed Dart formatting
                  shell: bash
                  run: |
                    if [[ \"$GITHUB_EVENT_NAME\" == \"pull_request\" ]]; then
                      git fetch origin \"$GITHUB_BASE_REF\" --depth=1
                      range=\"origin/$GITHUB_BASE_REF...HEAD\"
                    else
                      before=\"$(jq -r '.before // empty' \"$GITHUB_EVENT_PATH\")\"
                      if [[ -z \"$before\" || \"$before\" =~ ^0+$ ]]; then
                        range=\"HEAD^...HEAD\"
                      else
                        range=\"$before...HEAD\"
                      fi
                    fi
                    mapfile -t files < <(git diff --name-only --diff-filter=ACMR \"$range\" -- '*.dart')
                    if (( ${#files[@]} > 0 )); then
                      dart format --output=none --set-exit-if-changed \"${files[@]}\"
                    fi

                - name: Verify clean diff
                  run: git diff --check

                - name: Analyze
                  run: flutter analyze --fatal-infos
          """
          if old not in source:
              raise SystemExit('Expected broad formatting gate was not found')
          flutter_ci.write_text(source.replace(old, new, 1), encoding='utf-8')

          ios_ci = Path('.github/workflows/ios-ci.yml')
          source = ios_ci.read_text(encoding='utf-8')
          source = source.replace(
              'flutter create . --platforms=ios --org com.tunabozcali',
              'flutter create . --platforms=android,ios --org com.tunabozcali',
          )
          source = source.replace('Generate iOS shell', 'Generate native shells')
          ios_ci.write_text(source, encoding='utf-8')
          PY

      - name: Set up Flutter
        if: steps.gate.outputs.run == 'true'
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Resolve dependencies and format reviewed sources
        if: steps.gate.outputs.run == 'true'
        run: |
          flutter pub get
          dart format \
            lib/src/app.dart \
            lib/src/app_lock_gate.dart \
            lib/src/app_locale.dart \
            test/app_lock_gate_test.dart \
            test/app_locale_test.dart \
            test/app_lock_locale_lifecycle_test.dart \
            test/material_localization_test.dart \
            test/v117_oracle_language_contract_test.dart \
            test/v118_private_journal_transfer_contract_test.dart \
            test/v119_protected_transfer_contract_test.dart \
            test/v120_private_app_lock_contract_test.dart \
            test/v121_launch_differentiation_contract_test.dart

      - name: Verify clean hardening source
        if: steps.gate.outputs.run == 'true'
        run: |
          test "$(grep '^version:' pubspec.yaml)" = 'version: 1.21.1+28'
          test ! -e tool/v1211_harden.py
          test ! -e tool/v1211_trigger.txt
          grep -q 'languageCodeLoader' lib/src/app_lock_gate.dart
          grep -q 'GlobalMaterialLocalizations.delegates' lib/src/app.dart
          grep -q 'flutter build ios --release --no-codesign' .github/workflows/ios-ci.yml
          grep -q 'platforms=android,ios' .github/workflows/ios-ci.yml
          git diff --check

      - name: Commit clean hardening release
        if: steps.gate.outputs.run == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            RELEASE_NOTES.md \
            RELEASE_NOTES_1.21.1.md \
            STORE_RELEASE.md \
            pubspec.yaml \
            lib/src/app.dart \
            lib/src/app_lock_gate.dart \
            lib/src/app_locale.dart \
            test/app_lock_gate_test.dart \
            test/app_locale_test.dart \
            test/app_lock_locale_lifecycle_test.dart \
            test/material_localization_test.dart \
            test/v117_oracle_language_contract_test.dart \
            test/v118_private_journal_transfer_contract_test.dart \
            test/v119_protected_transfer_contract_test.dart \
            test/v120_private_app_lock_contract_test.dart \
            test/v121_launch_differentiation_contract_test.dart
          git add -u tool/v1211_harden.py tool/v1211_trigger.txt
          git commit -m "release: Mystic Tarot 1.21.1 prelaunch hardening"
          git push origin HEAD:release/v1.21.1-prelaunch-hardening
