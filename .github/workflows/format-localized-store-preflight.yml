name: Format localized store preflight

on:
  push:
    branches:
      - quality/all-localized-store-preflight

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v6
        with:
          ref: quality/all-localized-store-preflight
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Apply canonical Dart formatting
        run: dart format tool/src/public_store_urls.dart test/public_store_urls_test.dart
      - name: Commit formatting
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tool/src/public_store_urls.dart test/public_store_urls_test.dart
          git commit -m "Apply canonical Dart formatting [skip ci]"
          git push origin HEAD:quality/all-localized-store-preflight
