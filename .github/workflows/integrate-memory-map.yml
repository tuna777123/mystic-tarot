name: Integrate Memory Map

on:
  push:
    branches:
      - feature/memory-map-semantic-search

permissions:
  contents: write

jobs:
  integrate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out feature branch
        uses: actions/checkout@v4
        with:
          ref: feature/memory-map-semantic-search
          fetch-depth: 0

      - name: Patch Living Journal navigation
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('lib/src/mystic_living_journal_feature.dart')
          text = path.read_text()

          import_anchor = "import 'models.dart';\n"
          feature_import = "import 'models.dart';\nimport 'mystic_memory_map_feature.dart';\n"
          if "import 'mystic_memory_map_feature.dart';" not in text:
              if import_anchor not in text:
                  raise SystemExit('models import anchor not found')
              text = text.replace(import_anchor, feature_import, 1)

          text = text.replace(
              'enum _JournalSection { timeline, insights, search }',
              'enum _JournalSection { timeline, insights, map, search }',
              1,
          )

          search_segment = """          ButtonSegment<_JournalSection>(
            value: _JournalSection.search,
            icon: const Icon(Icons.search, size: 17),
            label: Text(_copy('Search', 'Ara')),
          ),"""
          map_and_search = """          ButtonSegment<_JournalSection>(
            value: _JournalSection.map,
            icon: const Icon(Icons.hub_outlined, size: 17),
            label: Text(_copy('Map', 'Harita')),
          ),
          ButtonSegment<_JournalSection>(
            value: _JournalSection.search,
            icon: const Icon(Icons.search, size: 17),
            label: Text(_copy('Search', 'Ara')),
          ),"""
          if '_JournalSection.map,' not in text:
              if search_segment not in text:
                  raise SystemExit('search segment anchor not found')
              text = text.replace(search_segment, map_and_search, 1)

          switch_anchor = """        _JournalSection.insights => _buildInsights(),
        _JournalSection.search => _buildSearch(),"""
          switch_replacement = """        _JournalSection.insights => _buildInsights(),
        _JournalSection.map => MysticMemoryMapFeature(
            records: widget.records,
            language: widget.language,
          ),
        _JournalSection.search => _buildSearch(),"""
          if 'MysticMemoryMapFeature(' not in text:
              if switch_anchor not in text:
                  raise SystemExit('section switch anchor not found')
              text = text.replace(switch_anchor, switch_replacement, 1)

          path.write_text(text)
          PY

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Validate Memory Map integration
        run: |
          flutter create .
          flutter pub get
          dart format lib/src/mystic_memory_map_feature.dart
          flutter analyze
          flutter test
          flutter build web --release
          flutter build appbundle --release

      - name: Commit integration and remove workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/integrate-memory-map.yml
          git add lib/src/mystic_living_journal_feature.dart lib/src/mystic_memory_map_feature.dart
          git commit -m "feat: integrate Memory Map and semantic search"
          git push
