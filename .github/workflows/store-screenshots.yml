name: Generate Store Screenshots

on:
  workflow_dispatch:
  pull_request:
    paths:
      - pubspec.yaml
      - lib/src/store_screenshot_manifest.dart
      - lib/src/store_showcase.dart
      - test/store_screenshot_generator_test.dart
      - test/store_screenshot_contract_test.dart
      - tool/verify_store_screenshot_pack.dart
      - .github/workflows/store-screenshots.yml

permissions:
  contents: read

concurrency:
  group: store-screenshots-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate-screenshot-source:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Verify screenshot source formatting
        run: |
          dart format \
            lib/src/store_screenshot_manifest.dart \
            lib/src/store_showcase.dart \
            test/store_screenshot_generator_test.dart \
            test/store_screenshot_contract_test.dart \
            tool/verify_store_screenshot_pack.dart
          git diff --exit-code -- \
            lib/src/store_screenshot_manifest.dart \
            lib/src/store_showcase.dart \
            test/store_screenshot_generator_test.dart \
            test/store_screenshot_contract_test.dart \
            tool/verify_store_screenshot_pack.dart

      - name: Analyze screenshot pipeline
        run: flutter analyze --fatal-infos

      - name: Verify every device and locale layout
        run: flutter test test/store_screenshot_contract_test.dart

  generate-store-screenshot-partitions:
    needs: validate-screenshot-source
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - device: apple-6.7
            locale: en
            locale_slug: en
          - device: apple-6.7
            locale: tr
            locale_slug: tr
          - device: apple-6.7
            locale: es
            locale_slug: es
          - device: apple-6.7
            locale: fr
            locale_slug: fr
          - device: apple-6.7
            locale: pt-BR
            locale_slug: pt-br
          - device: google-play-phone
            locale: en
            locale_slug: en
          - device: google-play-phone
            locale: tr
            locale_slug: tr
          - device: google-play-phone
            locale: es
            locale_slug: es
          - device: google-play-phone
            locale: fr
            locale_slug: fr
          - device: google-play-phone
            locale: pt-BR
            locale_slug: pt-br
    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Generate five localized PNGs
        env:
          GENERATE_STORE_SCREENSHOTS: '1'
          STORE_SCREENSHOT_DEVICE: ${{ matrix.device }}
          STORE_SCREENSHOT_LOCALE: ${{ matrix.locale }}
        run: flutter test test/store_screenshot_generator_test.dart

      - name: Upload screenshot partition
        uses: actions/upload-artifact@v7
        with:
          name: mystic-tarot-store-part-${{ matrix.device }}-${{ matrix.locale_slug }}
          path: build/store_screenshots
          if-no-files-found: error
          retention-days: 1

  audit-and-package-store-screenshots:
    needs: generate-store-screenshot-partitions
    runs-on: ubuntu-24.04
    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Download all screenshot partitions
        uses: actions/download-artifact@v7
        with:
          pattern: mystic-tarot-store-part-*
          path: build/store_screenshots
          merge-multiple: true

      - name: Audit complete screenshot pack
        env:
          SOURCE_COMMIT: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          mkdir -p build/reports
          dart run tool/verify_store_screenshot_pack.dart \
            build/store_screenshots "$SOURCE_COMMIT" \
            | tee build/reports/store-screenshot-audit.md
          expected_version="$(awk '/^version:/{print $2; exit}' pubspec.yaml)"
          test -n "$expected_version"
          test -s build/store_screenshots/manifest.json
          grep -Fq "\"applicationVersion\": \"$expected_version\"" \
            build/store_screenshots/manifest.json
          grep -Fq "\"sourceCommit\": \"$SOURCE_COMMIT\"" \
            build/store_screenshots/manifest.json
          cat build/reports/store-screenshot-audit.md >> "$GITHUB_STEP_SUMMARY"

      - name: Upload complete store screenshot pack
        uses: actions/upload-artifact@v7
        with:
          name: mystic-tarot-store-screenshots
          path: |
            build/store_screenshots
            build/reports/store-screenshot-audit.md
          if-no-files-found: error
          retention-days: 14
