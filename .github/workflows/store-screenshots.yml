name: Generate Store Screenshots

on:
  workflow_dispatch:
  pull_request:
    paths:
      - lib/src/store_screenshot_manifest.dart
      - lib/src/store_showcase.dart
      - test/store_screenshot_generator_test.dart
      - test/store_screenshot_contract_test.dart
      - tool/verify_store_screenshot_pack.dart
      - .github/workflows/store-screenshots.yml

permissions:
  contents: read

concurrency:
  group: store-screenshots-${{ github.ref }}
  cancel-in-progress: true

jobs:
  generate-store-screenshots:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Verify screenshot source formatting
        run: |
          dart format --output=none --set-exit-if-changed \
            lib/src/store_screenshot_manifest.dart \
            lib/src/store_showcase.dart \
            test/store_screenshot_generator_test.dart \
            test/store_screenshot_contract_test.dart \
            tool/verify_store_screenshot_pack.dart

      - name: Analyze screenshot pipeline
        run: flutter analyze --fatal-infos

      - name: Generate localized PNG pack
        env:
          GENERATE_STORE_SCREENSHOTS: '1'
        run: flutter test test/store_screenshot_generator_test.dart

      - name: Audit screenshot pack
        run: |
          mkdir -p build/reports
          dart run tool/verify_store_screenshot_pack.dart build/store_screenshots \
            | tee build/reports/store-screenshot-audit.md
          cat build/reports/store-screenshot-audit.md >> "$GITHUB_STEP_SUMMARY"

      - name: Upload store screenshot pack
        uses: actions/upload-artifact@v7
        with:
          name: mystic-tarot-store-screenshots
          path: |
            build/store_screenshots
            build/reports/store-screenshot-audit.md
          if-no-files-found: error
          retention-days: 14
