name: v1.22.1 Finalize

on:
  push:
    branches:
      - release/v1.22.1-retention-quality

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          ref: release/v1.22.1-retention-quality
          fetch-depth: 0

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Align release metadata and contracts
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          store_path = Path('STORE_RELEASE.md')
          store = store_path.read_text()
          store = store.replace(
              'Current verified source version: `1.22.0+29`.',
              'Current verified source version: `1.22.1+30`.',
          )
          store_path.write_text(store)

          contract_path = Path('test/v122_revenue_final_contract_test.dart')
          contract = contract_path.read_text()
          contract = contract.replace(
              "expect(pubspec, contains('version: 1.22.0+29'));",
              "expect(pubspec, contains('version: 1.22.1+30'));",
          )
          contract = contract.replace(
              "expect(storePack, contains('Current verified source version: `1.22.0+29`'));",
              "expect(storePack, contains('Current verified source version: `1.22.1+30`'));",
          )
          contract_path.write_text(contract)

          notes_path = Path('RELEASE_NOTES.md')
          notes = notes_path.read_text()
          patch_notes = Path('RELEASE_NOTES_1.22.1.md').read_text().rstrip()
          if not notes.startswith('# Mystic Tarot 1.22.1'):
              notes_path.write_text(f'{patch_notes}\n\n---\n\n{notes}')
          PY

          dart format \
            test/v122_revenue_final_contract_test.dart \
            test/v1221_retention_quality_contract_test.dart

      - name: Commit finalized release files
        shell: bash
        run: |
          if git diff --quiet; then
            echo "Release metadata already finalized."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            STORE_RELEASE.md \
            RELEASE_NOTES.md \
            test/v122_revenue_final_contract_test.dart \
            test/v1221_retention_quality_contract_test.dart
          git commit -m "docs: finalize v1.22.1 release contract"
          git push origin HEAD:release/v1.22.1-retention-quality
