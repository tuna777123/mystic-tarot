name: Apply Journey Integration

on:
  pull_request:
    branches: [main]
    types: [opened, reopened, synchronize]

permissions:
  contents: write

jobs:
  integrate:
    if: ${{ github.head_ref == 'feature/journey-final-integration' && !contains(github.event.pull_request.head.sha, 'journey-integrated') }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out integration branch
        uses: actions/checkout@v4
        with:
          ref: feature/journey-final-integration
          fetch-depth: 0

      - name: Skip when already integrated
        id: guard
        shell: bash
        run: |
          if grep -q "import 'mystic_journey_feature.dart';" lib/src/app.dart; then
            echo "needed=false" >> "$GITHUB_OUTPUT"
          else
            echo "needed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Integrate Journey feature
        if: ${{ steps.guard.outputs.needed == 'true' }}
        shell: python
        run: |
          from pathlib import Path

          path = Path('lib/src/app.dart')
          text = path.read_text()

          import_needle = "import 'mystic_identity_screen.dart';\n"
          import_replacement = import_needle + "import 'mystic_journey_feature.dart';\n"
          if text.count(import_needle) != 1:
              raise SystemExit('Journey import anchor was not unique')
          text = text.replace(import_needle, import_replacement, 1)

          tab_needle = "          JourneyScreen(streak: streak, xp: xp, records: journal, discoveredCards: discoveredCards, completedRituals: completedRituals, claimedRewards: claimedRewards, completedArcanaDays: completedArcanaDays, language: language, onOpenDestiny: _openDestinyHub, onCompleteRitual: _completeRitual, onClaimReward: _claimReward),\n"
          tab_replacement = """          MysticJourneysFeature(
            language: language,
            onOpenDestiny: _openDestinyHub,
            onStartReading: () {
              setState(() => tab = 0);
              _startReading(ReadingKind.daily);
            },
          ),
"""
          if text.count(tab_needle) != 1:
              raise SystemExit('Path tab anchor was not unique')
          text = text.replace(tab_needle, tab_replacement, 1)

          methods_needle = """  void _completeRitual(String id) {
    if (completedRituals.contains(id)) return;
    setState(() {
      completedRituals.add(id);
      xp += 15;
    });
    _saveProgress();
  }

  void _claimReward(int milestone) {
    if (xp < milestone || claimedRewards.contains(milestone)) return;
    setState(() => claimedRewards.add(milestone));
    _saveProgress();
  }

"""
          if text.count(methods_needle) != 1:
              raise SystemExit('Legacy Path method anchor was not unique')
          text = text.replace(methods_needle, '', 1)

          path.write_text(text)

      - name: Set up Flutter
        if: ${{ steps.guard.outputs.needed == 'true' }}
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Format integration
        if: ${{ steps.guard.outputs.needed == 'true' }}
        run: dart format lib/src/app.dart lib/src/mystic_journey_feature.dart

      - name: Remove one-shot workflow
        if: ${{ steps.guard.outputs.needed == 'true' }}
        run: rm .github/workflows/apply-journey-integration.yml

      - name: Commit integration
        if: ${{ steps.guard.outputs.needed == 'true' }}
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lib/src/app.dart lib/src/mystic_journey_feature.dart .github/workflows/apply-journey-integration.yml
          git commit -m "feat: integrate Mystic Journeys into the app shell [journey-integrated]"
          git push origin HEAD:feature/journey-final-integration
