name: Generate dependency lockfile

on:
  push:
    branches:
      - release/lock-production-dependencies
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@v6
        with:
          ref: release/lock-production-dependencies
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Resolve application dependencies
        run: flutter pub get
      - name: Verify generated lockfile is enforceable
        run: |
          test -s pubspec.lock
          dart pub get --enforce-lockfile
      - name: Commit exact generated lockfile on branch
        if: ${{ github.event_name == 'push' }}
        shell: bash
        run: |
          set -euo pipefail
          git add -f pubspec.lock
          if git diff --cached --quiet; then
            echo "Tracked lockfile is already exact."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Lock Flutter application dependencies"
          git push origin HEAD:release/lock-production-dependencies
      - name: Upload generated lockfile
        uses: actions/upload-artifact@v7
        with:
          name: mystic-tarot-pubspec-lock
          path: pubspec.lock
          if-no-files-found: error
          retention-days: 1
