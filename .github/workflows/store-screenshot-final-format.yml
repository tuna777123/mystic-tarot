name: Store Screenshot Final Format

on:
  push:
    branches:
      - release/localized-store-screenshot-pack
    paths:
      - .github/workflows/store-screenshot-final-format.yml

permissions:
  contents: write

jobs:
  format-and-push:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out screenshot branch
        uses: actions/checkout@v6
        with:
          ref: release/localized-store-screenshot-pack
          fetch-depth: 0

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Apply canonical formatting
        shell: bash
        run: |
          set -euo pipefail
          git pull --rebase origin release/localized-store-screenshot-pack
          dart format lib/src/store_showcase.dart
          git diff --check

      - name: Commit canonical formatting
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add lib/src/store_showcase.dart
          git commit -m "style: format finalized store showcase"
          git push origin HEAD:release/localized-store-screenshot-pack
