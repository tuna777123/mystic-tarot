name: Journey Diagnostics

on:
  push:
    branches: [feature/journey-dashboard-ui-clean]

permissions:
  contents: write

jobs:
  diagnose:
    if: ${{ !contains(github.event.head_commit.message, '[journey-diagnostics]') }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          ref: feature/journey-dashboard-ui-clean

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Generate platform shells
        run: flutter create .

      - name: Install dependencies
        run: flutter pub get

      - name: Format Journey files
        run: dart format lib/src/mystic_journey*.dart test/mystic_journey*.dart

      - name: Capture analyzer report
        shell: bash
        run: |
          mkdir -p ci
          set +e
          flutter analyze > ci/JOURNEY_ANALYZE_REPORT.txt 2>&1
          status=$?
          echo "ANALYZE_EXIT_CODE=$status" >> ci/JOURNEY_ANALYZE_REPORT.txt
          exit 0

      - name: Commit diagnostics
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lib/src/mystic_journey*.dart test/mystic_journey*.dart ci/JOURNEY_ANALYZE_REPORT.txt
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "chore: record Journey analyzer output [journey-diagnostics]"
          git push origin HEAD:feature/journey-dashboard-ui-clean
