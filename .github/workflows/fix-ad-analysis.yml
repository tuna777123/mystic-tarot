name: Fix Ad Migration Analysis

on:
  push:
    branches: [release/ad-supported-monetization]

permissions:
  contents: write

concurrency:
  group: fix-ad-analysis
  cancel-in-progress: true

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: release/ad-supported-monetization
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Remove obsolete subscription analysis leftovers
        shell: python
        run: |
          from pathlib import Path

          purchase = Path('lib/src/store_purchase_service.dart')
          text = purchase.read_text().replace("import 'monetization.dart' show MysticProductIds;\n", '')
          purchase.write_text(text)

          screen = Path('lib/src/store_ready_premium_screen.dart')
          text = screen.read_text()
          if "import 'flagship.dart';" not in text:
              text = text.replace("import 'app_language.dart';\n", "import 'app_language.dart';\nimport 'flagship.dart';\n")
          screen.write_text(text)

          showcase = Path('lib/src/store_showcase.dart')
          text = showcase.read_text()
          start = text.index('class _Plan extends StatelessWidget {')
          end = text.index('class _Feature extends StatelessWidget {')
          text = text[:start] + text[end:]
          showcase.write_text(text)
      - name: Format repaired files
        run: dart format lib/src/store_purchase_service.dart lib/src/store_ready_premium_screen.dart lib/src/store_showcase.dart
      - name: Commit repair
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add lib/src/store_purchase_service.dart lib/src/store_ready_premium_screen.dart lib/src/store_showcase.dart
          git commit -m "Fix advertising migration analysis"
          git push origin HEAD:release/ad-supported-monetization
