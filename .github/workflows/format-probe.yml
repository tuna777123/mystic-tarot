name: Format Probe

on:
  push:
    branches:
      - quality/release-certificate-fingerprint-lock-clean

permissions:
  contents: read

jobs:
  format-probe:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Show exact formatter patch
        shell: bash
        run: |
          set -euo pipefail
          files=(
            test/ios_artifact_certificate_test.dart
            tool/src/ios_artifact_certificate.dart
            tool/write_release_manifest.dart
          )
          dart format "${files[@]}"
          git diff -- "${files[@]}"
          if ! git diff --quiet -- "${files[@]}"; then
            exit 1
          fi
