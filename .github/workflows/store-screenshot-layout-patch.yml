name: Store Screenshot Layout Patch

on:
  push:
    branches:
      - release/localized-store-screenshot-pack
    paths:
      - .github/workflows/store-screenshot-layout-patch.yml

permissions:
  contents: write

jobs:
  patch-and-push:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out screenshot branch
        uses: actions/checkout@v6
        with:
          ref: release/localized-store-screenshot-pack
          fetch-depth: 0

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Apply responsive explainable-reading layout
        shell: bash
        run: |
          set -euo pipefail
          git pull --rebase origin release/localized-store-screenshot-pack
          python3 - <<'PY'
          from pathlib import Path

          path = Path('lib/src/store_showcase.dart')
          text = path.read_text()
          old = """      Expanded(\n        child: _Panel(\n          padding: const EdgeInsets.all(18),\n          child: Column(\n            children: [\n"""
          new = """      Expanded(\n        child: _Panel(\n          padding: const EdgeInsets.all(10),\n          child: Column(\n            mainAxisAlignment: MainAxisAlignment.spaceBetween,\n            children: [\n"""
          if old not in text:
              if 'padding: const EdgeInsets.all(10)' not in text:
                  raise SystemExit('Explainable-reading layout target was not found.')
          else:
              text = text.replace(old, new, 1)
          text = text.replace('              const Divider(height: 24),', '              const Divider(height: 8),', 2)
          text = text.replace(
              "                fontSize: 13,\n                height: 1.4,",
              "                fontSize: 11,\n                height: 1.25,",
              1,
          )
          path.write_text(text)
          PY
          dart format lib/src/store_showcase.dart
          flutter analyze --fatal-infos

      - name: Commit responsive layout
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add lib/src/store_showcase.dart
          git commit -m "fix: compact explainable store scene"
          git push origin HEAD:release/localized-store-screenshot-pack
