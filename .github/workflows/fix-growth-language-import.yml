name: Fix Growth Language Import

on:
  push:
    branches:
      - product/measurement-ready-growth-lab

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          ref: product/measurement-ready-growth-lab
          fetch-depth: 0
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Reuse canonical language bridge
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          path = Path('lib/src/growth_evidence_screen.dart')
          source = path.read_text()
          old = "import 'app_locale.dart';\n"
          new = "import 'language_bridge.dart';\n"
          if new not in source:
              if source.count(old) != 1:
                  raise SystemExit('expected exactly one app_locale import')
              source = source.replace(old, new, 1)
              path.write_text(source)
          PY
          dart format lib/src/growth_evidence_screen.dart
      - name: Commit source fix
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet; then
            echo 'Already fixed.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add lib/src/growth_evidence_screen.dart
          git commit -m 'Reuse canonical language bridge in growth diagnostics'
          git push origin HEAD:product/measurement-ready-growth-lab
