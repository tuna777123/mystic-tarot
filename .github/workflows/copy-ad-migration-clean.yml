name: Copy Clean Ad Migration

on:
  push:
    branches: [release/ad-supported-monetization]

permissions:
  contents: write

concurrency:
  group: copy-clean-ad-migration
  cancel-in-progress: true

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: release/ad-supported-monetization
          fetch-depth: 0
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Copy only intentional advertising migration files
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin backup/ad-supported-monetization-wip
          git checkout origin/backup/ad-supported-monetization-wip -- \
            .github/workflows/store-release.yml \
            README.md \
            STORE_RELEASE.md \
            docs/FINAL_DELIVERY.md \
            docs/MARKETING_LAUNCH_KIT.md \
            docs/OWNER_GUIDE_A_TO_Z.md \
            docs/STORE_LISTING_ES.md \
            docs/STORE_LISTING_FR.md \
            docs/STORE_LISTING_PT_BR.md \
            docs/STORE_LISTING_TR.md \
            lib/main.dart \
            lib/src/ad_revenue_service.dart \
            lib/src/reading_journal_store.dart \
            lib/src/store_purchase_service.dart \
            lib/src/store_ready_premium_screen.dart \
            pubspec.yaml \
            test/ad_supported_monetization_contract_test.dart \
            test/android_bundle_audit_test.dart \
            test/store_purchase_service_test.dart \
            test/store_ready_premium_conversion_test.dart \
            test/store_release_contract_test.dart \
            test/v112_revenue_contract_test.dart \
            test/v122_revenue_final_contract_test.dart \
            tool/audit_android_bundle.dart \
            tool/configure_store_identifiers.dart \
            tool/src/android_bundle_audit.dart \
            tool/src/store_release_contract.dart \
            tool/store_release_preflight.dart \
            tool/verify_launch_surface.sh \
            tool/write_release_manifest.dart \
            web/press-kit.html \
            web/privacy.html \
            web/privacy-tr.html \
            web/privacy-es.html \
            web/privacy-fr.html \
            web/privacy-pt-br.html
      - name: Convert store screenshot five to free ad-supported access
        shell: python
        run: |
          from pathlib import Path

          manifest = Path('lib/src/store_screenshot_manifest.dart')
          manifest_text = manifest.read_text().replace(
              "mysticPlus('05-mystic-plus')",
              "mysticPlus('05-free-ad-supported')",
          )
          manifest.write_text(manifest_text)

          showcase = Path('lib/src/store_showcase.dart')
          text = showcase.read_text()
          text = text.replace(
              "    StoreScreenshotScene.mysticPlus => 'MYSTIC PLUS',",
              """    StoreScreenshotScene.mysticPlus => _l(
              language,
              en: 'FREE EXPERIENCE',
              tr: 'ÜCRETSİZ DENEYİM',
              es: 'EXPERIENCIA GRATIS',
              fr: 'EXPÉRIENCE GRATUITE',
              pt: 'EXPERIÊNCIA GRÁTIS',
            ),""",
          )
          text = text.replace(
              """    StoreScreenshotScene.mysticPlus => _l(
              language,
              en: 'Go deeper without losing trust.',
              tr: 'Güveni kaybetmeden daha derine in.',
              es: 'Profundiza sin perder la confianza.',
              fr: 'Allez plus loin sans perdre confiance.',
              pt: 'Aprofunde-se sem perder a confiança.',
            ),""",
              """    StoreScreenshotScene.mysticPlus => _l(
              language,
              en: 'The whole ritual stays open.',
              tr: 'Ritüelin tamamı açık kalır.',
              es: 'Todo el ritual permanece abierto.',
              fr: 'Tout le rituel reste accessible.',
              pt: 'Todo o ritual continua aberto.',
            ),""",
          )
          text = text.replace(
              """    StoreScreenshotScene.mysticPlus => _l(
              language,
              en: 'Deep readings and private intelligence, with official store pricing.',
              tr: 'Derin okumalar ve özel içgörüler; resmi mağaza fiyatlarıyla.',
              es: 'Lecturas profundas e inteligencia privada con precio oficial.',
              fr: 'Lectures profondes et intelligence privée, au tarif officiel.',
              pt: 'Leituras profundas e inteligência privada com preço oficial.',
            ),""",
              """    StoreScreenshotScene.mysticPlus => _l(
              language,
              en: 'No subscription. Native apps are supported by occasional ads.',
              tr: 'Abonelik yok. Mobil uygulama seyrek reklamlarla desteklenir.',
              es: 'Sin suscripción. Las apps nativas se financian con anuncios ocasionales.',
              fr: 'Aucun abonnement. Les apps natives sont financées par des publicités occasionnelles.',
              pt: 'Sem assinatura. Os apps nativos são financiados por anúncios ocasionais.',
            ),""",
          )

          start = text.index('class _Plus extends StatelessWidget {')
          end = text.index('class _Trust extends StatelessWidget {')
          replacement = """class _Plus extends StatelessWidget {
            const _Plus({required this.language});

            final MysticLanguage language;

            @override
            Widget build(BuildContext context) => Column(
              children: [
                Row(
                  children: [
                    Expanded(
                      child: _Metric(
                        value: _l(language, en: 'FREE', tr: 'ÜCRETSİZ', es: 'GRATIS', fr: 'GRATUIT', pt: 'GRÁTIS'),
                        label: _l(language, en: 'ALL FEATURES', tr: 'TÜM ÖZELLİKLER', es: 'TODAS LAS FUNCIONES', fr: 'TOUTES LES FONCTIONS', pt: 'TODOS OS RECURSOS'),
                      ),
                    ),
                    const SizedBox(width: 10),
                    Expanded(
                      child: _Metric(
                        value: _l(language, en: 'NO PAYWALL', tr: 'ÖDEME YOK', es: 'SIN PAGO', fr: 'SANS PÉAGE', pt: 'SEM PAYWALL'),
                        label: _l(language, en: 'NATIVE AD-SUPPORTED', tr: 'MOBİL REKLAM DESTEKLİ', es: 'APP CON PUBLICIDAD', fr: 'APP AVEC PUBLICITÉ', pt: 'APP COM ANÚNCIOS'),
                      ),
                    ),
                  ],
                ),
                const SizedBox(height: 13),
                Expanded(
                  child: _Panel(
                    padding: const EdgeInsets.all(20),
                    child: Column(
                      crossAxisAlignment: CrossAxisAlignment.start,
                      children: [
                        Row(
                          children: [
                            Container(
                              width: 48,
                              height: 48,
                              alignment: Alignment.center,
                              decoration: BoxDecoration(
                                borderRadius: BorderRadius.circular(15),
                                gradient: const LinearGradient(colors: [MysticColors.gold, Color(0xFF8A6A2D)]),
                              ),
                              child: const Icon(Icons.auto_awesome_rounded, color: Color(0xFF18101F)),
                            ),
                            const SizedBox(width: 13),
                            Expanded(
                              child: Column(
                                crossAxisAlignment: CrossAxisAlignment.start,
                                children: [
                                  Text(
                                    _l(language, en: 'COMPLETE MYSTIC EXPERIENCE', tr: 'TAM MYSTIC DENEYİMİ', es: 'EXPERIENCIA MYSTIC COMPLETA', fr: 'EXPÉRIENCE MYSTIC COMPLÈTE', pt: 'EXPERIÊNCIA MYSTIC COMPLETA'),
                                    style: const TextStyle(fontSize: 19, fontWeight: FontWeight.w800),
                                  ),
                                  Text(
                                    _l(language, en: 'Core access never depends on watching an ad', tr: 'Temel erişim reklam izlemeye bağlı değildir', es: 'El acceso principal no depende de ver un anuncio', fr: 'L’accès essentiel ne dépend pas du visionnage d’une pub', pt: 'O acesso principal não depende de assistir anúncio'),
                                    style: const TextStyle(fontFamily: 'Arial', fontSize: 11, color: MysticColors.muted),
                                  ),
                                ],
                              ),
                            ),
                          ],
                        ),
                        const SizedBox(height: 22),
                        _Feature(_l(language, en: 'All readings and deep spreads', tr: 'Tüm okumalar ve derin açılımlar', es: 'Todas las lecturas y tiradas profundas', fr: 'Tous les tirages et lectures approfondies', pt: 'Todas as leituras e tiragens profundas')),
                        const SizedBox(height: 16),
                        _Feature(_l(language, en: 'Mystic Mirror and private patterns', tr: 'Mystic Ayna ve özel örüntüler', es: 'Mystic Mirror y patrones privados', fr: 'Mystic Mirror et motifs privés', pt: 'Mystic Mirror e padrões privados')),
                        const SizedBox(height: 16),
                        _Feature(_l(language, en: 'Living Journal, Oracle, Path and Arcana', tr: 'Yaşayan Günlük, Oracle, Yol ve Arkana', es: 'Diario, Oracle, Path y Arcana', fr: 'Journal, Oracle, Path et Arcanes', pt: 'Diário, Oracle, Path e Arcanos')),
                        const Spacer(),
                        Container(
                          width: double.infinity,
                          padding: const EdgeInsets.symmetric(vertical: 15),
                          alignment: Alignment.center,
                          decoration: BoxDecoration(
                            borderRadius: BorderRadius.circular(17),
                            gradient: const LinearGradient(colors: [MysticColors.gold, Color(0xFFB78D3D)]),
                          ),
                          child: Text(
                            _l(language, en: 'CONTINUE FREE', tr: 'ÜCRETSİZ DEVAM ET', es: 'CONTINUAR GRATIS', fr: 'CONTINUER GRATUITEMENT', pt: 'CONTINUAR GRÁTIS'),
                            style: const TextStyle(fontFamily: 'Arial', fontWeight: FontWeight.w900, letterSpacing: .7, color: Color(0xFF17101D)),
                          ),
                        ),
                      ],
                    ),
                  ),
                ),
              ],
            );
          }

          """
          text = text[:start] + replacement + text[end:]
          showcase.write_text(text)

          contract = Path('test/store_screenshot_contract_test.dart')
          contract_text = contract.read_text()
          contract_text = contract_text.replace(
              "    expect(expectedStoreScreenshotCount, 50);",
              "    expect(expectedStoreScreenshotCount, 50);\n    expect(StoreScreenshotScene.mysticPlus.slug, '05-free-ad-supported');",
          )
          contract_text = contract_text.replace(
              "      'million downloads',",
              "      'million downloads',\n      'mystic plus',\n      'official store pricing',\n      'continue with yearly',",
          )
          contract.write_text(contract_text)
      - name: Format only intentional Dart changes
        run: |
          dart format \
            lib/main.dart \
            lib/src/ad_revenue_service.dart \
            lib/src/reading_journal_store.dart \
            lib/src/store_purchase_service.dart \
            lib/src/store_ready_premium_screen.dart \
            lib/src/store_screenshot_manifest.dart \
            lib/src/store_showcase.dart \
            test/ad_supported_monetization_contract_test.dart \
            test/android_bundle_audit_test.dart \
            test/store_purchase_service_test.dart \
            test/store_ready_premium_conversion_test.dart \
            test/store_release_contract_test.dart \
            test/store_screenshot_contract_test.dart \
            test/v112_revenue_contract_test.dart \
            test/v122_revenue_final_contract_test.dart \
            tool/audit_android_bundle.dart \
            tool/configure_store_identifiers.dart \
            tool/src/android_bundle_audit.dart \
            tool/src/store_release_contract.dart \
            tool/store_release_preflight.dart \
            tool/write_release_manifest.dart
      - name: Commit clean migration
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add \
            .github/workflows/store-release.yml \
            README.md STORE_RELEASE.md docs lib pubspec.yaml test tool web
          git commit -m "Apply clean advertising-only monetization migration"
          git push origin HEAD:release/ad-supported-monetization
