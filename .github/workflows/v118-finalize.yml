name: v1.18 Finalize

on:
  push:
    branches:
      - feature/v1.18-private-journal-transfer
    paths:
      - tool/v118_finalize.py
      - .github/workflows/v118-finalize.yml

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - name: Check out release branch
        uses: actions/checkout@v4
        with:
          ref: feature/v1.18-private-journal-transfer
          fetch-depth: 0

      - name: Apply final integration
        run: python3 tool/v118_finalize.py

      - name: Commit clean release tree
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat: finalize private journal transfer"
          git push origin HEAD:feature/v1.18-private-journal-transfer
