name: Temporary Context Formatter

on:
  push:
    branches:
      - product/context-aware-meanings

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v6
        with:
          ref: product/context-aware-meanings
          fetch-depth: 0
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.9'
          channel: stable
          cache: true
      - name: Apply canonical Dart formatting
        run: dart format lib/src/reading_synthesis.dart test/context_aware_synthesis_test.dart
      - name: Commit formatter output
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet; then
            exit 0
          fi
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add lib/src/reading_synthesis.dart test/context_aware_synthesis_test.dart
          git commit -m "Apply canonical context synthesis formatting"
          git push origin HEAD:product/context-aware-meanings
