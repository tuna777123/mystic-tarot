name: Ad-only user copy migration

on:
  push:
    branches: [release/ad-supported-monetization]

permissions:
  contents: write

jobs:
  migrate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          ref: release/ad-supported-monetization
          fetch-depth: 0
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Remove legacy paid messaging from runtime UI
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          app_path = Path('lib/src/app.dart')
          app = app_path.read_text()
          import_anchor = "import 'app_language.dart';\n"
          if "import 'ad_revenue_service.dart';\n" not in app:
              if import_anchor not in app:
                  raise SystemExit('app import anchor missing')
              app = app.replace(import_anchor, "import 'ad_revenue_service.dart';\n" + import_anchor, 1)
          app = app.replace('  bool isPlus = false;\n', '  bool isPlus = true;\n', 1)

          start_anchor = "          const SizedBox(height: 14),\n          InkWell(\n            onTap: onPremium,\n"
          end_anchor = "          const SizedBox(height: 18),\n          ListTile(\n            onTap: () => Navigator.push(\n"
          start = app.find(start_anchor)
          end = app.find(end_anchor, start) if start >= 0 else -1
          if start >= 0 and end >= 0:
              replacement = """          const SizedBox(height: 14),
          Container(
            padding: const EdgeInsets.all(20),
            decoration: BoxDecoration(
              gradient: const LinearGradient(
                colors: [Color(0xFF6847B7), Color(0xFF312057)],
              ),
              borderRadius: BorderRadius.circular(22),
            ),
            child: Row(
              children: [
                const Icon(Icons.auto_awesome_rounded, size: 28, color: MysticColors.gold),
                const SizedBox(width: 14),
                Expanded(
                  child: Column(
                    crossAxisAlignment: CrossAxisAlignment.start,
                    children: [
                      Text(
                        localized(
                          language.appLanguage,
                          english: 'Free · advertising-supported',
                          turkish: 'Ücretsiz · reklam destekli',
                          spanish: 'Gratis · con anuncios',
                          french: 'Gratuit · financé par la publicité',
                          portugueseBrazil: 'Grátis · com anúncios',
                        ),
                        style: const TextStyle(fontSize: 18, fontWeight: FontWeight.bold),
                      ),
                      const SizedBox(height: 4),
                      Text(
                        localized(
                          language.appLanguage,
                          english: 'All features are unlocked. Native Android and iOS revenue comes only from occasional ads.',
                          turkish: 'Tüm özellikler açık. Android ve iOS geliri yalnızca seyrek reklamlardan gelir.',
                          spanish: 'Todas las funciones están abiertas. Los ingresos de Android e iOS provienen solo de anuncios ocasionales.',
                          french: 'Toutes les fonctions sont ouvertes. Les revenus Android et iOS viennent uniquement de publicités occasionnelles.',
                          portugueseBrazil: 'Todos os recursos estão liberados. A receita no Android e iOS vem apenas de anúncios ocasionais.',
                        ),
                        style: const TextStyle(fontFamily: 'Arial', color: MysticColors.lavender),
                      ),
                    ],
                  ),
                ),
              ],
            ),
          ),
          if (AdRevenueService.instance.privacyOptionsAvailable) ...[
            const SizedBox(height: 8),
            ListTile(
              onTap: AdRevenueService.instance.showPrivacyOptions,
              contentPadding: const EdgeInsets.symmetric(horizontal: 4),
              leading: const Icon(Icons.privacy_tip_outlined, color: MysticColors.gold),
              title: Text(
                localized(
                  language.appLanguage,
                  english: 'Advertising privacy choices',
                  turkish: 'Reklam gizlilik tercihleri',
                  spanish: 'Opciones de privacidad publicitaria',
                  french: 'Choix de confidentialité publicitaire',
                  portugueseBrazil: 'Opções de privacidade de anúncios',
                ),
                style: const TextStyle(fontFamily: 'Arial'),
              ),
              subtitle: Text(
                localized(
                  language.appLanguage,
                  english: 'Review the consent choices used for native ads.',
                  turkish: 'Native reklamlar için kullanılan izin tercihlerini gözden geçir.',
                  spanish: 'Revisa las opciones de consentimiento usadas para los anuncios nativos.',
                  french: 'Révisez les choix de consentement utilisés pour les publicités natives.',
                  portugueseBrazil: 'Revise as escolhas de consentimento usadas para anúncios nativos.',
                ),
                style: Theme.of(context).textTheme.bodyMedium,
              ),
              trailing: const Icon(Icons.chevron_right),
            ),
          ],
"""
              app = app[:start] + replacement + app[end:]

          replacements = {
              "'Mystic Plus readings'": "'Deep readings'",
              "'Mystic Plus okumaları'": "'Derin okumalar'",
              "'Your verified Mystic Plus entitlement is active.'": "'All features are unlocked.'",
              "'Doğrulanmış Mystic Plus hakkın etkin.'": "'Tüm özellikler açık.'",
              "'Unlock unlimited readings with Mystic Plus.'": "'All readings are available without payment.'",
              "'Mystic Plus ile sınırsız okumaları aç.'": "'Tüm okumalar ödeme olmadan kullanılabilir.'",
              "'Your free answer is complete. Continue the dialogue with Mystic Plus.'": "'Your answer is complete. Keep the private dialogue going.'",
              "'Ücretsiz cevabın tamamlandı. Diyaloğa Mystic Plus ile devam et.'": "'Cevabın tamamlandı. Özel diyaloğa devam et.'",
              "'Ask unlimited follow-ups, revisit saved conversations, and unlock every deep spread with Mystic Plus.'": "'Ask unlimited follow-ups, revisit saved conversations, and explore every deep spread.'",
              "'Sınırsız devam sorusu sor, kayıtlı sohbetlere dön ve Mystic Plus ile tüm derin açılımları aç.'": "'Sınırsız devam sorusu sor, kayıtlı sohbetlere dön ve tüm derin açılımları keşfet.'",
              "'You can revisit it here at any time. Mystic Plus continues the same private conversation.'": "'You can revisit it here at any time and continue the same private conversation.'",
              "'Buraya istediğin zaman dönebilirsin. Mystic Plus aynı özel konuşmayı sürdürür.'": "'Buraya istediğin zaman dönebilir ve aynı özel konuşmayı sürdürebilirsin.'",
              "'Puedes volver aquí cuando quieras. Mystic Plus continúa la misma conversación privada.'": "'Puedes volver aquí cuando quieras y continuar la misma conversación privada.'",
              "'Vous pouvez la relire ici à tout moment. Mystic Plus poursuit la même conversation privée.'": "'Vous pouvez la relire ici à tout moment et poursuivre la même conversation privée.'",
              "'Você pode voltar aqui quando quiser. O Mystic Plus continua a mesma conversa privada.'": "'Você pode voltar aqui quando quiser e continuar a mesma conversa privada.'",
              "'Continue with Mystic Plus'": "'Continue conversation'",
              "'Mystic Plus ile devam et'": "'Sohbete devam et'",
              "'Continuar con Mystic Plus'": "'Continuar conversación'",
              "'Continuer avec Mystic Plus'": "'Continuer la conversation'",
              "'Continuar com Mystic Plus'": "'Continuar conversa'",
              "'Included with Mystic Plus • Cancel anytime'": "'Included free • Native apps are advertising-supported'",
              "'Mystic Plus’a dâhil • İstediğin zaman iptal et'": "'Ücretsiz dâhil • Mobil uygulama reklam destekli'",
              "t('Can I cancel Mystic Plus?', 'Mystic Plus’ı iptal edebilir miyim?')": "t('Why is Mystic Tarot free?', 'Mystic Tarot neden ücretsiz?')",
              "'When native subscriptions launch, they can be managed and cancelled through Apple or Google account settings. The web release does not process payments.'": "'There is no paid subscription. Native Android and iOS editions are funded by occasional advertising; the public web edition is ad-free.'",
              "'Yerel abonelikler başladığında Apple veya Google hesap ayarlarından yönetilip iptal edilebilir. Web sürümü ödeme işlemez.'": "'Ücretli abonelik yoktur. Android ve iOS sürümlerinin geliri seyrek reklamlardan gelir; herkese açık web sürümü reklamsızdır.'",
              "t('How do I restore a purchase?', 'Satın almayı nasıl geri yüklerim?')": "t('Do I need to restore anything?', 'Bir şeyi geri yüklemem gerekir mi?')",
              "'Restore becomes available with native Apple and Google subscriptions. The current web release does not process or store purchases.'": "'No. Product access does not depend on a purchase or restore flow.'",
              "'Geri yükleme, yerel Apple ve Google abonelikleriyle kullanılabilir. Mevcut web sürümü satın alma işlemez veya saklamaz.'": "'Hayır. Ürün erişimi satın alma veya geri yükleme akışına bağlı değildir.'",
          }
          for old, new in replacements.items():
              app = app.replace(old, new)
          if 'Mystic Plus' in app or 'MYSTIC PLUS' in app:
              raise SystemExit('legacy Mystic Plus user copy remains in app.dart')
          if 'View plan and manage subscription' in app:
              raise SystemExit('legacy subscription management copy remains in app.dart')
          app_path.write_text(app)

          intel_path = Path('lib/src/mystic_plus_intelligence_screen.dart')
          intel = intel_path.read_text()
          intel_replacements = {
              "en: 'View and manage my plan'": "en: 'Continue to my report'",
              "es: 'Ver y gestionar mi plan'": "es: 'Continuar a mi informe'",
              "fr: 'Voir et gérer mon offre'": "fr: 'Continuer vers mon rapport'",
              "pt: 'Ver e gerenciar meu plano'": "pt: 'Continuar para meu relatório'",
              "tr: 'Planımı gör ve yönet'": "tr: 'Raporuma devam et'",
              "en: 'Unlock the full report'": "en: 'Open the full report'",
              "es: 'Desbloquear el informe completo'": "es: 'Abrir el informe completo'",
              "fr: 'Débloquer le rapport complet'": "fr: 'Ouvrir le rapport complet'",
              "pt: 'Desbloquear o relatório completo'": "pt: 'Abrir o relatório completo'",
              "tr: 'Tam raporun kilidini aç'": "tr: 'Tam raporu aç'",
              'Icons.settings_outlined': 'Icons.arrow_forward_rounded',
              "'MYSTIC PLUS'": "'MYSTIC INTELLIGENCE'",
              "en: 'Personalized insight ready inside Mystic Plus'": "en: 'Personalized insight ready on this device'",
              "es: 'Información personalizada lista en Mystic Plus'": "es: 'Información personalizada lista en este dispositivo'",
              "fr: 'Analyse personnalisée prête dans Mystic Plus'": "fr: 'Analyse personnalisée prête sur cet appareil'",
              "pt: 'Insight personalizado pronto no Mystic Plus'": "pt: 'Insight personalizado pronto neste dispositivo'",
              "tr: 'Kişisel içgörü Mystic Plus içinde hazır'": "tr: 'Kişisel içgörü bu cihazda hazır'",
              "en: 'See the private evidence your saved readings are already building, then decide whether Plus is worth it.'": "en: 'See the private evidence your saved readings are already building and keep exploring the full report.'",
              "es: 'Mira la evidencia privada que tus lecturas ya están creando y decide si Plus vale la pena.'": "es: 'Mira la evidencia privada que tus lecturas ya están creando y sigue explorando el informe completo.'",
              "fr: 'Voyez les preuves privées que vos tirages construisent déjà, puis décidez si Plus en vaut la peine.'": "fr: 'Voyez les preuves privées que vos tirages construisent déjà et poursuivez le rapport complet.'",
              "pt: 'Veja as evidências privadas que suas leituras já estão criando e decida se o Plus vale a pena.'": "pt: 'Veja as evidências privadas que suas leituras já estão criando e continue explorando o relatório completo.'",
              "tr: 'Kayıtlı okumalarının oluşturduğu özel kanıtı gör; sonra Plus’ın değerli olup olmadığına karar ver.'": "tr: 'Kayıtlı okumalarının oluşturduğu özel kanıtı gör ve tam raporu keşfetmeye devam et.'",
              "en: 'Mystic Plus connects follow-up questions with your seven-day private pattern report.'": "en: 'Mystic Intelligence connects follow-up questions with your seven-day private pattern report.'",
              "es: 'Mystic Plus conecta las preguntas de seguimiento con tu informe privado de siete días.'": "es: 'Mystic Intelligence conecta las preguntas de seguimiento con tu informe privado de siete días.'",
              "fr: 'Mystic Plus relie les questions de suivi à votre rapport privé sur sept jours.'": "fr: 'Mystic Intelligence relie les questions de suivi à votre rapport privé sur sept jours.'",
              "pt: 'O Mystic Plus conecta perguntas de acompanhamento ao seu relatório privado de sete dias.'": "pt: 'Mystic Intelligence conecta perguntas de acompanhamento ao seu relatório privado de sete dias.'",
              "tr: 'Mystic Plus devam sorularını yedi günlük özel örüntü raporunla birleştirir.'": "tr: 'Mystic Intelligence devam sorularını yedi günlük özel örüntü raporunla birleştirir.'",
              "en: 'Mystic Plus is not only more readings. It is a private intelligence layer that becomes more useful as you return.'": "en: 'Mystic Intelligence is a private pattern layer that becomes more useful as you return.'",
              "es: 'Mystic Plus no es solo más lecturas. Es una capa privada de inteligencia que mejora con cada regreso.'": "es: 'Mystic Intelligence es una capa privada de patrones que mejora con cada regreso.'",
              "fr: 'Mystic Plus ne signifie pas seulement plus de tirages. C’est une intelligence privée qui gagne en valeur à chaque retour.'": "fr: 'Mystic Intelligence est une couche privée de tendances qui gagne en valeur à chaque retour.'",
              "pt: 'Mystic Plus não é apenas mais leituras. É uma camada privada de inteligência que melhora a cada retorno.'": "pt: 'Mystic Intelligence é uma camada privada de padrões que melhora a cada retorno.'",
              "tr: 'Mystic Plus yalnızca daha fazla okuma değildir. Her dönüşünde değerlenen özel bir intelligence katmanıdır.'": "tr: 'Mystic Intelligence her dönüşünde değerlenen özel bir örüntü katmanıdır.'",
          }
          for old, new in intel_replacements.items():
              intel = intel.replace(old, new)
          if 'Mystic Plus' in intel or 'MYSTIC PLUS' in intel:
              raise SystemExit('legacy Mystic Plus user copy remains in intelligence screen')
          intel_path.write_text(intel)

          contract = Path('test/ad_only_user_copy_contract_test.dart')
          contract.write_text("""import 'dart:io';

import 'package:flutter_test/flutter_test.dart';

void main() {
  test('advertising-only runtime exposes no legacy paid copy', () {
    final app = File('lib/src/app.dart').readAsStringSync();
    final intelligence = File('lib/src/mystic_plus_intelligence_screen.dart').readAsStringSync();
    final access = File('lib/src/store_ready_premium_screen.dart').readAsStringSync();

    expect(app, contains('bool isPlus = true'));
    expect(app, contains('Free · advertising-supported'));
    expect(app, contains('Advertising privacy choices'));
    expect(app, isNot(contains('Mystic Plus')));
    expect(app, isNot(contains('View plan and manage subscription')));
    expect(app, isNot(contains('Can I cancel Mystic Plus?')));
    expect(intelligence, contains('MYSTIC INTELLIGENCE'));
    expect(intelligence, isNot(contains('Mystic Plus')));
    expect(intelligence, isNot(contains('View and manage my plan')));
    expect(access, contains('Everything is unlocked.'));
    expect(access, isNot(contains('Manage subscription')));
  });
}
""")
          PY
          dart format lib/src/app.dart lib/src/mystic_plus_intelligence_screen.dart test/ad_only_user_copy_contract_test.dart
          rm .github/workflows/ad-only-user-copy-migration.yml
          git diff --check
      - name: Commit migration
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lib/src/app.dart lib/src/mystic_plus_intelligence_screen.dart test/ad_only_user_copy_contract_test.dart .github/workflows/ad-only-user-copy-migration.yml
          git diff --cached --quiet && exit 0
          git commit -m "Remove legacy paid messaging from runtime UI"
          git push origin HEAD:release/ad-supported-monetization
