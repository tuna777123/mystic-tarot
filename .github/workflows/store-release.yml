name: Production Store Release

on:
  workflow_dispatch:
    inputs:
      platform:
        description: Signed store package to build
        required: true
        default: android
        type: choice
        options: [android, ios, both]
      channel:
        description: Intended store channel
        required: true
        default: closed-testing
        type: choice
        options: [internal, closed-testing, production]
      release_notes:
        description: Optional operator note stored with the workflow run
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: production-store-release
  cancel-in-progress: false

env:
  STORE_BUNDLE_ID: com.tunabozcali.mystictarot

jobs:
  source-validation:
    name: Validate release source
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Require main release source
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = "refs/heads/main"
          test "$GITHUB_SHA" = "$(git rev-parse HEAD)"
      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.9'
          channel: stable
          cache: true
      - name: Generate native project shells
        run: bash tool/scaffold_native_preserving_sources.sh --platforms=android,ios --org com.tunabozcali
      - name: Install dependencies
        run: flutter pub get --enforce-lockfile
      - name: Apply permanent store identifiers
        run: dart run tool/configure_store_identifiers.dart
      - name: Generate branded native icons
        run: dart run flutter_launcher_icons
      - name: Verify Dart formatting
        run: dart format --output=none --set-exit-if-changed lib test tool
      - name: Verify clean diff
        run: git diff --check
      - name: Verify advertising-only launch surface
        run: bash tool/verify_launch_surface.sh
      - name: Analyze
        run: flutter analyze --fatal-infos
      - name: Test
        run: flutter test

  android-release:
    name: Build signed Android AAB
    if: ${{ inputs.platform == 'android' || inputs.platform == 'both' }}
    needs: source-validation
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment: production-stores
    env:
      ADMOB_ANDROID_APP_ID: ${{ secrets.ADMOB_ANDROID_APP_ID }}
      ADMOB_ANDROID_APP_OPEN_ID: ${{ secrets.ADMOB_ANDROID_APP_OPEN_ID }}
      ADMOB_ANDROID_INTERSTITIAL_ID: ${{ secrets.ADMOB_ANDROID_INTERSTITIAL_ID }}
      ANDROID_UPLOAD_KEYSTORE_BASE64: ${{ secrets.ANDROID_UPLOAD_KEYSTORE_BASE64 }}
      ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
      ANDROID_STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
      ANDROID_UPLOAD_CERT_SHA256: ${{ secrets.ANDROID_UPLOAD_CERT_SHA256 }}
    steps:
      - name: Check out source
        uses: actions/checkout@v6
      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.9'
          channel: stable
          cache: true
      - name: Generate Android project shell
        run: bash tool/scaffold_native_preserving_sources.sh --platforms=android --org com.tunabozcali
      - name: Install dependencies
        run: flutter pub get --enforce-lockfile
      - name: Apply permanent store and AdMob identifiers
        run: dart run tool/configure_store_identifiers.dart
      - name: Validate protected Android release inputs
        run: dart run tool/store_release_preflight.dart --platform=android
      - name: Install and verify Android upload key
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import base64, os
          from pathlib import Path
          payload = base64.b64decode(''.join(os.environ['ANDROID_UPLOAD_KEYSTORE_BASE64'].split()), validate=True)
          target = Path('android/app/upload-keystore.jks')
          target.write_bytes(payload)
          target.chmod(0o600)
          PY
          keytool -list -keystore android/app/upload-keystore.jks -storepass "$ANDROID_STORE_PASSWORD" -alias "$ANDROID_KEY_ALIAS" >/dev/null
          keytool -exportcert -keystore android/app/upload-keystore.jks -storepass "$ANDROID_STORE_PASSWORD" -alias "$ANDROID_KEY_ALIAS" -file "$RUNNER_TEMP/android-upload-cert.der"
          EXPECTED=$(printf '%s' "$ANDROID_UPLOAD_CERT_SHA256" | tr -d '[:space:]:' | tr '[:lower:]' '[:upper:]')
          ACTUAL=$(sha256sum "$RUNNER_TEMP/android-upload-cert.der" | awk '{print toupper($1)}')
          test "$ACTUAL" = "$EXPECTED"
          openssl x509 -inform der -in "$RUNNER_TEMP/android-upload-cert.der" -checkend 2592000 -noout
          {
            printf 'storePassword=%s\n' "$ANDROID_STORE_PASSWORD"
            printf 'keyPassword=%s\n' "$ANDROID_KEY_PASSWORD"
            printf 'keyAlias=%s\n' "$ANDROID_KEY_ALIAS"
            printf 'storeFile=%s\n' 'upload-keystore.jks'
          } > android/key.properties
          chmod 600 android/key.properties
          dart run tool/configure_android_signing.dart
          grep -q 'signingConfigs.getByName("release")' android/app/build.gradle.kts
      - name: Generate branded native icons
        run: dart run flutter_launcher_icons
      - name: Build signed Android bundle
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build/reports
          flutter build appbundle --release \
            --dart-define=MYSTIC_USE_TEST_ADS=false \
            --dart-define=ADMOB_ANDROID_APP_OPEN_ID="$ADMOB_ANDROID_APP_OPEN_ID" \
            --dart-define=ADMOB_ANDROID_INTERSTITIAL_ID="$ADMOB_ANDROID_INTERSTITIAL_ID" \
            2>&1 | tee build/reports/android-store-release.log
      - name: Audit Built-in Kotlin compatibility
        shell: bash
        run: |
          set -euo pipefail
          report="build/release/android/built-in-kotlin-audit.md"
          dart run tool/verify_kotlin_plugin_warnings.dart --log build/reports/android-store-release.log --report "$report"
          cat "$report" >> "$GITHUB_STEP_SUMMARY"
      - name: Verify Android signature and certificate
        shell: bash
        run: |
          set -euo pipefail
          AAB_PATH=build/app/outputs/bundle/release/app-release.aab
          test -s "$AAB_PATH"
          SIGNATURE_OUTPUT=$(jarsigner -verify -certs "$AAB_PATH" 2>&1)
          printf '%s\n' "$SIGNATURE_OUTPUT"
          grep -q 'jar verified.' <<< "$SIGNATURE_OUTPUT"
          keytool -printcert -jarfile "$AAB_PATH" -rfc > "$RUNNER_TEMP/android-bundle-cert.pem"
          EXPECTED=$(printf '%s' "$ANDROID_UPLOAD_CERT_SHA256" | tr -d '[:space:]:' | tr '[:lower:]' '[:upper:]')
          ACTUAL=$(openssl x509 -in "$RUNNER_TEMP/android-bundle-cert.pem" -outform der | sha256sum | awk '{print toupper($1)}')
          test "$ACTUAL" = "$EXPECTED"
      - name: Install pinned bundletool
        env:
          BUNDLETOOL_VERSION: '1.18.3'
          BUNDLETOOL_SHA256: a099cfa1543f55593bc2ed16a70a7c67fe54b1747bb7301f37fdfd6d91028e29
        shell: bash
        run: |
          set -euo pipefail
          bundletool="$RUNNER_TEMP/bundletool-all-$BUNDLETOOL_VERSION.jar"
          curl --fail --location --silent --show-error --retry 3 --retry-all-errors --output "$bundletool" "https://github.com/google/bundletool/releases/download/$BUNDLETOOL_VERSION/bundletool-all-$BUNDLETOOL_VERSION.jar"
          echo "$BUNDLETOOL_SHA256  $bundletool" | sha256sum --check --strict
          java -jar "$bundletool" version
      - name: Audit signed Android release bundle
        shell: bash
        run: |
          set -euo pipefail
          report="build/release/android/aab-audit.md"
          dart run tool/audit_android_bundle.dart --bundle build/app/outputs/bundle/release/app-release.aab --bundletool "$RUNNER_TEMP/bundletool-all-1.18.3.jar" --report "$report"
          cat "$report" >> "$GITHUB_STEP_SUMMARY"
      - name: Create Android release manifest
        id: android_metadata
        shell: bash
        run: |
          set -euo pipefail
          AAB_PATH=build/app/outputs/bundle/release/app-release.aab
          VERSION=$(awk '/^version:/ {print $2}' pubspec.yaml)
          SAFE_VERSION=${VERSION/+/-build}
          CHECKSUM=$(sha256sum "$AAB_PATH" | awk '{print $1}')
          mkdir -p build/release/android
          printf '%s  %s\n' "$CHECKSUM" "$(basename "$AAB_PATH")" > build/release/android/app-release.aab.sha256
          dart run tool/write_release_manifest.dart --platform=android --artifact="$AAB_PATH" --sha256="$CHECKSUM" --channel="${{ inputs.channel }}" --output=build/release/android/release-manifest.json
          echo "artifact_name=mystic-tarot-${SAFE_VERSION}-android-${{ inputs.channel }}" >> "$GITHUB_OUTPUT"
      - name: Upload signed Android package
        uses: actions/upload-artifact@v7
        with:
          name: ${{ steps.android_metadata.outputs.artifact_name }}
          path: |
            build/app/outputs/bundle/release/app-release.aab
            build/release/android/app-release.aab.sha256
            build/release/android/aab-audit.md
            build/release/android/built-in-kotlin-audit.md
            build/release/android/release-manifest.json
          if-no-files-found: error
          retention-days: 30
      - name: Remove Android signing material
        if: always()
        run: |
          rm -f android/key.properties android/app/upload-keystore.jks
          rm -f "$RUNNER_TEMP/android-upload-cert.der" "$RUNNER_TEMP/android-bundle-cert.pem"

  ios-release:
    name: Build signed iOS IPA
    if: ${{ inputs.platform == 'ios' || inputs.platform == 'both' }}
    needs: source-validation
    runs-on: macos-latest
    timeout-minutes: 60
    environment: production-stores
    env:
      ADMOB_IOS_APP_ID: ${{ secrets.ADMOB_IOS_APP_ID }}
      ADMOB_IOS_APP_OPEN_ID: ${{ secrets.ADMOB_IOS_APP_OPEN_ID }}
      ADMOB_IOS_INTERSTITIAL_ID: ${{ secrets.ADMOB_IOS_INTERSTITIAL_ID }}
      IOS_DISTRIBUTION_CERTIFICATE_BASE64: ${{ secrets.IOS_DISTRIBUTION_CERTIFICATE_BASE64 }}
      IOS_DISTRIBUTION_CERTIFICATE_PASSWORD: ${{ secrets.IOS_DISTRIBUTION_CERTIFICATE_PASSWORD }}
      IOS_DISTRIBUTION_CERT_SHA256: ${{ secrets.IOS_DISTRIBUTION_CERT_SHA256 }}
      IOS_PROVISIONING_PROFILE_BASE64: ${{ secrets.IOS_PROVISIONING_PROFILE_BASE64 }}
      IOS_TEAM_ID: ${{ secrets.IOS_TEAM_ID }}
    steps:
      - name: Check out source
        uses: actions/checkout@v6
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.9'
          channel: stable
          cache: true
      - name: Generate iOS project shell
        run: bash tool/scaffold_native_preserving_sources.sh --platforms=ios --org com.tunabozcali
      - name: Install dependencies
        run: flutter pub get --enforce-lockfile
      - name: Apply permanent store and AdMob identifiers
        run: dart run tool/configure_store_identifiers.dart
      - name: Validate protected iOS release inputs
        run: dart run tool/store_release_preflight.dart --platform=ios
      - name: Install and verify Apple signing identity
        id: apple_signing
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import base64, os
          from pathlib import Path
          for name, key in {'distribution.p12':'IOS_DISTRIBUTION_CERTIFICATE_BASE64','profile.mobileprovision':'IOS_PROVISIONING_PROFILE_BASE64'}.items():
              payload = base64.b64decode(''.join(os.environ[key].split()), validate=True)
              target = Path(os.environ['RUNNER_TEMP']) / name
              target.write_bytes(payload)
              target.chmod(0o600)
          PY
          openssl pkcs12 -in "$RUNNER_TEMP/distribution.p12" -clcerts -nokeys -passin env:IOS_DISTRIBUTION_CERTIFICATE_PASSWORD -out "$RUNNER_TEMP/distribution-cert.pem"
          openssl x509 -in "$RUNNER_TEMP/distribution-cert.pem" -checkend 604800 -noout
          EXPECTED=$(printf '%s' "$IOS_DISTRIBUTION_CERT_SHA256" | tr -d '[:space:]:' | tr '[:lower:]' '[:upper:]')
          ACTUAL=$(openssl x509 -in "$RUNNER_TEMP/distribution-cert.pem" -outform der | shasum -a 256 | awk '{print toupper($1)}')
          test "$ACTUAL" = "$EXPECTED"
          KEYCHAIN_PATH="$RUNNER_TEMP/mystic-signing.keychain-db"
          KEYCHAIN_PASSWORD=$(openssl rand -hex 24)
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security import "$RUNNER_TEMP/distribution.p12" -P "$IOS_DISTRIBUTION_CERTIFICATE_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN_PATH"
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security list-keychains -d user -s "$KEYCHAIN_PATH"
          security default-keychain -s "$KEYCHAIN_PATH"
          security cms -D -i "$RUNNER_TEMP/profile.mobileprovision" > "$RUNNER_TEMP/profile.plist"
          PROFILE_UUID=$(/usr/libexec/PlistBuddy -c 'Print :UUID' "$RUNNER_TEMP/profile.plist")
          PROFILE_NAME=$(/usr/libexec/PlistBuddy -c 'Print :Name' "$RUNNER_TEMP/profile.plist")
          PROFILE_TEAM=$(/usr/libexec/PlistBuddy -c 'Print :TeamIdentifier:0' "$RUNNER_TEMP/profile.plist")
          PROFILE_APP_ID=$(/usr/libexec/PlistBuddy -c 'Print :Entitlements:application-identifier' "$RUNNER_TEMP/profile.plist")
          test "$PROFILE_TEAM" = "$IOS_TEAM_ID"
          test "$PROFILE_APP_ID" = "$IOS_TEAM_ID.$STORE_BUNDLE_ID"
          mkdir -p "$HOME/Library/MobileDevice/Provisioning Profiles"
          cp "$RUNNER_TEMP/profile.mobileprovision" "$HOME/Library/MobileDevice/Provisioning Profiles/$PROFILE_UUID.mobileprovision"
          echo "profile_uuid=$PROFILE_UUID" >> "$GITHUB_OUTPUT"
          echo "profile_name=$PROFILE_NAME" >> "$GITHUB_OUTPUT"
      - name: Generate branded native icons
        run: dart run flutter_launcher_icons
      - name: Prepare Flutter iOS release
        run: |
          flutter build ios --release --no-codesign \
            --dart-define=MYSTIC_USE_TEST_ADS=false \
            --dart-define=ADMOB_IOS_APP_OPEN_ID="$ADMOB_IOS_APP_OPEN_ID" \
            --dart-define=ADMOB_IOS_INTERSTITIAL_ID="$ADMOB_IOS_INTERSTITIAL_ID"
      - name: Archive signed iOS app
        run: |
          xcodebuild -workspace ios/Runner.xcworkspace -scheme Runner -configuration Release -sdk iphoneos -archivePath build/ios/archive/Runner.xcarchive \
            DEVELOPMENT_TEAM="$IOS_TEAM_ID" PRODUCT_BUNDLE_IDENTIFIER="$STORE_BUNDLE_ID" CODE_SIGN_STYLE=Manual \
            PROVISIONING_PROFILE_SPECIFIER="${{ steps.apple_signing.outputs.profile_name }}" CODE_SIGN_IDENTITY="Apple Distribution" archive
      - name: Export signed IPA
        id: ios_export
        shell: bash
        run: |
          cat > "$RUNNER_TEMP/ExportOptions.plist" <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
            <key>destination</key><string>export</string>
            <key>manageAppVersionAndBuildNumber</key><false/>
            <key>method</key><string>app-store-connect</string>
            <key>provisioningProfiles</key><dict><key>$STORE_BUNDLE_ID</key><string>${{ steps.apple_signing.outputs.profile_name }}</string></dict>
            <key>signingStyle</key><string>manual</string>
            <key>stripSwiftSymbols</key><true/>
            <key>teamID</key><string>$IOS_TEAM_ID</string>
            <key>uploadSymbols</key><true/>
          </dict></plist>
          PLIST
          xcodebuild -exportArchive -archivePath build/ios/archive/Runner.xcarchive -exportPath build/ios/export -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist"
          IPA_PATH=$(find build/ios/export -maxdepth 1 -name '*.ipa' -print -quit)
          test -n "$IPA_PATH" && test -s "$IPA_PATH"
          echo "ipa_path=$IPA_PATH" >> "$GITHUB_OUTPUT"
      - name: Verify iOS signature and identity
        shell: bash
        run: |
          set -euo pipefail
          rm -rf "$RUNNER_TEMP/ipa-inspect" && mkdir -p "$RUNNER_TEMP/ipa-inspect"
          unzip -q "${{ steps.ios_export.outputs.ipa_path }}" -d "$RUNNER_TEMP/ipa-inspect"
          APP_PATH=$(find "$RUNNER_TEMP/ipa-inspect/Payload" -maxdepth 1 -name '*.app' -print -quit)
          test -n "$APP_PATH"
          codesign --verify --deep --strict --verbose=2 "$APP_PATH"
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$APP_PATH/Info.plist")" = "$STORE_BUNDLE_ID"
          codesign -d --entitlements :- "$APP_PATH" > "$RUNNER_TEMP/app-entitlements.plist" 2>/dev/null
          test "$(/usr/libexec/PlistBuddy -c 'Print :application-identifier' "$RUNNER_TEMP/app-entitlements.plist")" = "$IOS_TEAM_ID.$STORE_BUNDLE_ID"
      - name: Create iOS release manifest
        id: ios_metadata
        shell: bash
        run: |
          set -euo pipefail
          IPA_PATH="${{ steps.ios_export.outputs.ipa_path }}"
          VERSION=$(awk '/^version:/ {print $2}' pubspec.yaml)
          SAFE_VERSION=${VERSION/+/-build}
          CHECKSUM=$(shasum -a 256 "$IPA_PATH" | awk '{print $1}')
          mkdir -p build/release/ios
          printf '%s  %s\n' "$CHECKSUM" "$(basename "$IPA_PATH")" > build/release/ios/mystic-tarot.ipa.sha256
          dart run tool/write_release_manifest.dart --platform=ios --artifact="$IPA_PATH" --sha256="$CHECKSUM" --channel="${{ inputs.channel }}" --output=build/release/ios/release-manifest.json
          echo "artifact_name=mystic-tarot-${SAFE_VERSION}-ios-${{ inputs.channel }}" >> "$GITHUB_OUTPUT"
      - name: Upload signed iOS package
        uses: actions/upload-artifact@v7
        with:
          name: ${{ steps.ios_metadata.outputs.artifact_name }}
          path: |
            ${{ steps.ios_export.outputs.ipa_path }}
            build/release/ios/mystic-tarot.ipa.sha256
            build/release/ios/release-manifest.json
          if-no-files-found: error
          retention-days: 30
      - name: Remove Apple signing material
        if: always()
        run: |
          security delete-keychain "$RUNNER_TEMP/mystic-signing.keychain-db" 2>/dev/null || true
          rm -f "$RUNNER_TEMP/distribution.p12" "$RUNNER_TEMP/distribution-cert.pem" "$RUNNER_TEMP/profile.mobileprovision" "$RUNNER_TEMP/profile.plist"
          rm -f "$HOME/Library/MobileDevice/Provisioning Profiles/${{ steps.apple_signing.outputs.profile_uuid }}.mobileprovision"
