name: Store Screenshot Layout Fix

on:
  push:
    branches:
      - release/localized-store-screenshot-pack
    paths:
      - .github/workflows/store-screenshot-layout-fix.yml

permissions:
  contents: write

jobs:
  fix-and-push:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out screenshot branch
        uses: actions/checkout@v6
        with:
          ref: release/localized-store-screenshot-pack
          fetch-depth: 0

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Compact the explainable-reading scene
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('lib/src/store_showcase.dart')
          text = path.read_text()
          old = """      Expanded(\n        child: _Panel(\n          padding: const EdgeInsets.all(18),\n          child: Column(\n            children: [\n"""
          new = """      Expanded(\n        child: _Panel(\n          padding: const EdgeInsets.all(14),\n          child: Column(\n            mainAxisAlignment: MainAxisAlignment.spaceBetween,\n            children: [\n"""
          if old not in text:
              raise SystemExit('Explainable-reading panel target was not found.')
          text = text.replace(old, new, 1)
          text = text.replace('              const Divider(height: 24),', '              const Divider(height: 12),', 2)
          text = text.replace(
              "                fontSize: 13,\n                height: 1.4,",
              "                fontSize: 12,\n                height: 1.3,",
              1,
          )
          path.write_text(text)
          PY

          dart format lib/src/store_showcase.dart
          flutter pub get
          flutter analyze --fatal-infos
          flutter test test/store_screenshot_contract_test.dart

      - name: Commit responsive layout fix
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add lib/src/store_showcase.dart
          git commit -m "fix: fit explainable store scene across launch locales"
          git push origin HEAD:release/localized-store-screenshot-pack
