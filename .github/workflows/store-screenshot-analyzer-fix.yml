name: Store Screenshot Analyzer Fix

on:
  push:
    branches:
      - release/localized-store-screenshot-pack
    paths:
      - .github/workflows/store-screenshot-analyzer-fix.yml

permissions:
  contents: write

jobs:
  fix-and-push:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out screenshot branch
        uses: actions/checkout@v6
        with:
          ref: release/localized-store-screenshot-pack
          fetch-depth: 0

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Apply targeted analyzer fixes
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          showcase = Path('lib/src/store_showcase.dart')
          text = showcase.read_text()
          old = """      Row(\n        children: const [\n          Expanded(\n            child: _Metric(value: 'Clarity', label: 'INTENTION'),\n"""
          new = """      const Row(\n        children: [\n          Expanded(\n            child: _Metric(value: 'Clarity', label: 'INTENTION'),\n"""
          if old not in text:
              raise SystemExit('Expected Row formatting target was not found.')
          showcase.write_text(text.replace(old, new, 1))

          verifier = Path('tool/verify_store_screenshot_pack.dart')
          text = verifier.read_text()
          text = text.replace(
              "    _fail(<String>['Screenshot directory does not exist: ${root.path}']);\n    return;\n",
              "    _fail(<String>['Screenshot directory does not exist: ${root.path}']);\n",
              1,
          )
          text = text.replace(
              "    _fail(errors);\n    return;\n",
              "    _fail(errors);\n",
              1,
          )
          text = text.replace(
              "  exitCode = 1;\n  throw const FileSystemException('Store screenshot audit failed.');\n",
              "  exit(1);\n",
              1,
          )
          verifier.write_text(text)
          PY

          dart format \
            lib/src/store_showcase.dart \
            tool/verify_store_screenshot_pack.dart
          flutter analyze --fatal-infos

      - name: Commit analyzer fixes
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add lib/src/store_showcase.dart tool/verify_store_screenshot_pack.dart
          git commit -m "fix: satisfy screenshot pipeline analyzer"
          git push origin HEAD:release/localized-store-screenshot-pack
