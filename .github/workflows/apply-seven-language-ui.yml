name: Apply seven-language UI integration

on: [push]

permissions:
  contents: write

jobs:
  integrate:
    if: github.ref == 'refs/heads/feature/mystic-soul-experience'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/mystic-soul-experience
          fetch-depth: 0

      - name: Patch language model and onboarding picker
        run: |
          python3 - <<'PY'
          from pathlib import Path

          flagship = Path('lib/src/flagship.dart')
          text = flagship.read_text()
          old_enum = """enum MysticLanguage {
  english('English', 'EN'),
  turkish('Türkçe', 'TR');
"""
          new_enum = """enum MysticLanguage {
  english('English', 'EN'),
  spanish('Español', 'ES'),
  french('Français', 'FR'),
  portugueseBrazil('Português (Brasil)', 'PT-BR'),
  turkish('Türkçe', 'TR'),
  italian('Italiano', 'IT'),
  german('Deutsch', 'DE');
"""
          if old_enum not in text:
              raise SystemExit('MysticLanguage enum block not found')
          flagship.write_text(text.replace(old_enum, new_enum, 1))

          app = Path('lib/src/app.dart')
          text = app.read_text()
          old_picker = """      SegmentedButton<MysticLanguage>(
        segments: MysticLanguage.values.map((item) => ButtonSegment(value: item, label: Text(item.label))).toList(),
        selected: {language},
        onSelectionChanged: (value) => setState(() => language = value.first),
      ),
"""
          new_picker = """      Wrap(
        alignment: WrapAlignment.center,
        spacing: 8,
        runSpacing: 8,
        children: MysticLanguage.values.map((item) => ChoiceChip(
          label: Text(item.label),
          selected: language == item,
          onSelected: (_) => setState(() => language = item),
          selectedColor: MysticColors.violet,
        )).toList(),
      ),
"""
          if old_picker not in text:
              raise SystemExit('Onboarding language picker block not found')
          app.write_text(text.replace(old_picker, new_picker, 1))
          PY

      - name: Add integration coverage
        run: |
          cat > test/mystic_language_integration_test.dart <<'DART'
          import 'package:flutter_test/flutter_test.dart';
          import 'package:mystic_tarot/src/flagship.dart';

          void main() {
            test('application language model exposes all seven languages', () {
              expect(MysticLanguage.values.map((item) => item.label), containsAll(<String>[
                'English',
                'Español',
                'Français',
                'Português (Brasil)',
                'Türkçe',
                'Italiano',
                'Deutsch',
              ]));
              expect(MysticLanguage.values.length, 7);
            });

            test('legacy copy falls back to English outside Turkish', () {
              for (final language in MysticLanguage.values.where((item) => item != MysticLanguage.turkish)) {
                expect(mysticText(language, 'Read', 'Oku'), 'Read');
              }
              expect(mysticText(MysticLanguage.turkish, 'Read', 'Oku'), 'Oku');
            });
          }
          DART

      - name: Remove migration workflow
        run: rm .github/workflows/apply-seven-language-ui.yml

      - name: Commit integration
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lib/src/flagship.dart lib/src/app.dart test/mystic_language_integration_test.dart .github/workflows/apply-seven-language-ui.yml
          git commit -m "feat: connect seven languages to onboarding and profile"
          git push origin HEAD:feature/mystic-soul-experience
