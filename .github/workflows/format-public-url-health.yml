name: Format public URL health contract

on:
  push:
    branches:
      - quality/public-url-health-gate

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v6
        with:
          ref: quality/public-url-health-gate
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Apply canonical Dart formatting
        run: dart format test/pages_public_url_health_contract_test.dart
      - name: Commit formatting
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add test/pages_public_url_health_contract_test.dart
          git commit -m "Apply canonical Dart formatting [skip ci]"
          git push origin HEAD:quality/public-url-health-gate
