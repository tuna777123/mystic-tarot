name: Temporary Synthesis Duplicate Debug

on:
  push:
    branches:
      - product/context-aware-meanings

permissions:
  contents: read

jobs:
  debug:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.9'
          channel: stable
          cache: true
      - run: flutter pub get --enforce-lockfile
      - name: Print duplicate synthesis sentences
        shell: bash
        run: |
          cat > tool/tmp_synthesis_duplicate_debug.dart <<'DART'
          import 'package:mystic_tarot/src/flagship.dart';
          import 'package:mystic_tarot/src/models.dart';
          import 'package:mystic_tarot/src/reading_synthesis.dart';
          import 'package:mystic_tarot/src/tarot_data.dart';

          void main() {
            const languages = <MysticLanguage>[
              MysticLanguage.turkish,
              MysticLanguage.spanish,
              MysticLanguage.french,
              MysticLanguage.portugueseBrazil,
            ];
            const kinds = <ReadingKind>[
              ReadingKind.timeline,
              ReadingKind.celticCross,
            ];
            for (final language in languages) {
              for (final kind in kinds) {
                final cards = <DrawnCard>[
                  for (var index = 0; index < kind.cardCount; index++)
                    DrawnCard(tarotDeck[(index * 7) % tarotDeck.length], index.isOdd),
                ];
                final result = buildReadingSynthesis(
                  kind: kind,
                  cards: cards,
                  emotion: EmotionalState.anxious,
                  intention: 'Purpose',
                  language: language,
                );
                final sentences = result
                    .split(RegExp(r'[.!?…]+'))
                    .map((item) => item.trim().toLowerCase())
                    .where((item) => item.length > 20)
                    .toList();
                final counts = <String, int>{};
                for (final sentence in sentences) {
                  counts[sentence] = (counts[sentence] ?? 0) + 1;
                }
                print('=== ${language.code} ${kind.name} ===');
                for (final entry in counts.entries.where((entry) => entry.value > 1)) {
                  print('DUP x${entry.value}: ${entry.key}');
                }
              }
            }
          }
          DART
          dart run tool/tmp_synthesis_duplicate_debug.dart
