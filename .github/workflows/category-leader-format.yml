name: Format Category Leader Polish

on:
  push:
    branches:
      - agent/category-leader-pass

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Format changed Dart files
        shell: bash
        run: |
          set -euo pipefail
          dart format \
            lib/src/app.dart \
            lib/src/reading_explanation.dart \
            lib/src/mystic_living_journal_feature.dart \
            test/category_leader_ux_contract_test.dart
          if git diff --quiet; then
            echo "Already formatted."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lib/src/app.dart \
            lib/src/reading_explanation.dart \
            lib/src/mystic_living_journal_feature.dart \
            test/category_leader_ux_contract_test.dart
          git commit -m "Format category leader polish"
          git push origin HEAD:agent/category-leader-pass
