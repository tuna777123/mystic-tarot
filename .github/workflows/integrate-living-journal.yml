name: Integrate Living Journal

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]

permissions:
  contents: write

jobs:
  integrate:
    if: github.head_ref == 'feature/living-journal-integration'
    runs-on: ubuntu-latest
    steps:
      - name: Check out feature branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0

      - name: Patch app shell
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('lib/src/app.dart')
          text = path.read_text()

          import_anchor = "import 'mystic_journey_feature.dart';\n"
          integrated_imports = (
              "import 'mystic_journey_feature.dart';\n"
              "import 'mystic_living_journal_feature.dart';\n"
          )
          if "import 'mystic_living_journal_feature.dart';" not in text:
              if import_anchor not in text:
                  raise SystemExit('Journey import anchor not found')
              text = text.replace(import_anchor, integrated_imports, 1)

          old_widget = '          JournalScreen(records: journal),'
          new_widget = (
              '          MysticLivingJournalFeature(\n'
              '            records: journal,\n'
              '            language: language,\n'
              "            onPremium: () => _showPremium(source: 'living_journal'),\n"
              '          ),'
          )
          if 'MysticLivingJournalFeature(' not in text:
              if old_widget not in text:
                  raise SystemExit('Journal widget anchor not found')
              text = text.replace(old_widget, new_widget, 1)

          path.write_text(text)
          PY

      - name: Restore production CI
        run: git checkout origin/main -- .github/workflows/flutter-ci.yml

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Validate integrated application
        run: |
          flutter create .
          flutter pub get
          dart format lib/src/app.dart lib/src/mystic_living_journal_feature.dart
          flutter analyze
          flutter test
          flutter build web --release
          flutter build appbundle --release

      - name: Commit integration and remove temporary workflow
        run: |
          git rm .github/workflows/integrate-living-journal.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lib/src/app.dart lib/src/mystic_living_journal_feature.dart .github/workflows/flutter-ci.yml
          git commit -m "feat: activate Living Journal in app navigation"
          git push origin HEAD:${{ github.head_ref }}
