name: Temporary Mystic Tarot 1.11 RC integrator

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  integrate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out release candidate
        uses: actions/checkout@v4
        with:
          ref: release/v1.11.0-rc
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Apply exact release integration
        run: python3 tool/integrate_v111_rc.py

      - name: Commit integrated release candidate
        run: |
          rm tool/integrate_v111_rc.py
          git config user.name "Mystic Release Bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -m "feat: integrate Mystic Tarot 1.11.0 release candidate"
          git push origin HEAD:release/v1.11.0-rc

      - name: Remove temporary workflow from main
        run: |
          git fetch origin main
          git switch --force-create main origin/main
          git rm .github/workflows/temporary-v111-rc-integrator.yml
          git commit -m "chore: remove completed 1.11 RC integrator"
          git push origin HEAD:main
