name: Investment Share Origin Patch

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          ref: product/investment-grade-growth
          fetch-depth: 0
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Add iPad-safe share origin
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('lib/src/mystic_living_journal_feature.dart')
          source = path.read_text()

          subject = '                    subject: mysticMirrorShareSubject(widget.language),\n'
          replacement = subject + '                    sharePositionOrigin: _mirrorShareOrigin(),\n'
          if 'sharePositionOrigin: _mirrorShareOrigin(),' not in source:
              if source.count(subject) != 1:
                  raise SystemExit(f'Mirror share subject anchor mismatch: {source.count(subject)}')
              source = source.replace(subject, replacement, 1)

          method_anchor = '  Widget _buildDueMirrorAction(ReadingRecord record) {\n'
          helper = '''  Rect _mirrorShareOrigin() {
    final renderObject = context.findRenderObject();
    return renderObject is RenderBox
        ? renderObject.localToGlobal(Offset.zero) & renderObject.size
        : const Rect.fromLTWH(0, 0, 1, 1);
  }

'''
          if 'Rect _mirrorShareOrigin()' not in source:
              if source.count(method_anchor) != 1:
                  raise SystemExit(f'Mirror due-action anchor mismatch: {source.count(method_anchor)}')
              source = source.replace(method_anchor, helper + method_anchor, 1)

          path.write_text(source)
          PY
          dart format lib/src/mystic_living_journal_feature.dart
          grep -Fq 'sharePositionOrigin: _mirrorShareOrigin()' lib/src/mystic_living_journal_feature.dart
          grep -Fq 'Rect _mirrorShareOrigin()' lib/src/mystic_living_journal_feature.dart
      - name: Commit source fix
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          if git diff --quiet -- lib/src/mystic_living_journal_feature.dart; then
            echo 'Share origin already hardened.'
            exit 0
          fi
          git add lib/src/mystic_living_journal_feature.dart
          git commit -m 'Make Mirror sharing iPad-safe'
          git push origin HEAD:product/investment-grade-growth
